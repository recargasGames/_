<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="3A5udHt-1flbfBdKc7UC2d_KGz2yKlwOSfjRovfdPaY" />
<title>RECARGASGAMES — Netflix</title>
<style>
:root{--color-principal:#E50914;--color-hover:#c20812;--color-fondo:#0f172a;--color-tarjeta:#1e293b;--color-borde:rgba(229,9,20,0.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{
    background-image:url('fondo.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    padding-top:80px;
}
.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:rgba(11,18,32,.95);
    padding:12px 20px;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    border-bottom:2px solid var(--color-principal);
    z-index:999;
}
.header img{height:50px;width:auto;border-radius:8px;object-fit:contain}
.container{max-width:480px;margin:0 auto;padding:30px 20px}
.titulo-pagina{text-align:center;font-size:28px;font-weight:700;margin-bottom:10px;color:var(--color-principal)}
.subtitulo{text-align:center;color:#cbd5e1;margin-bottom:40px}
.grid-productos{display:grid;gap:20px}
.tarjeta-producto{
    background:rgba(30,41,59,0.8);
    border:2px solid var(--color-borde);
    border-radius:16px;
    padding:25px;
    cursor:pointer;
    transition:.3s;
    backdrop-filter:blur(10px);
}
.tarjeta-producto:hover{
    border-color:var(--color-principal);
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(229,9,20,0.15);
}
.tarjeta-nombre{font-size:20px;font-weight:700;margin-bottom:10px}
.tarjeta-descripcion{color:#94a3b8;margin-bottom:15px;font-size:14px}
.tarjeta-precio-usd{font-size:22px;font-weight:700;color:var(--color-principal);margin-bottom:5px}
.tarjeta-precio-bsf{font-size:15px;color:#facc15;margin-bottom:15px}
.btn-comprar{
    width:100%;
    padding:14px;
    background:var(--color-principal);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}
.btn-comprar:hover{background:var(--color-hover)}
</style>
</head>
<body>

<div class="header">
    <img src="logo.png" alt="Logo RecargasGames">
</div>

<div class="container">
    <h1 class="titulo-pagina">🎬 Netflix</h1>
    <p class="subtitulo">Elige tu plan y recarga al instante</p>

    <div class="grid-productos">
        <!-- PRODUCTO 1: Netflix 1 Pantalla -->
        <div class="tarjeta-producto" onclick="seleccionarProducto('recargaPerfilNetflix', 'Netflix — 1 Pantalla', 3.80, 3700.00)">
            <div class="tarjeta-nombre">📺 1 Pantalla</div>
            <div class="tarjeta-descripcion">Perfil individual — calidad HD</div>
            <div class="tarjeta-precio-usd">$3.80 USD</div>
            <div class="tarjeta-precio-bsf">3.700,00 Bs</div>
            <button class="btn-comprar" onclick="event.stopPropagation();seleccionarProducto('recargaPerfilNetflix', 'Netflix — 1 Pantalla', 3.80, 3700.00)">Comprar Ahora</button>
        </div>

        <!-- PRODUCTO 2: Netflix Cuenta Completa -->
        <div class="tarjeta-producto" onclick="seleccionarProducto('recargaCuentaNetflix', 'Netflix — Cuenta Completa', 13.50, 12800.00)">
            <div class="tarjeta-nombre">🎬 Cuenta Completa</div>
            <div class="tarjeta-descripcion">Acceso completo — 4 pantallas — 4K</div>
            <div class="tarjeta-precio-usd">$13.50 USD</div>
            <div class="tarjeta-precio-bsf">12.800,00 Bs</div>
            <button class="btn-comprar" onclick="event.stopPropagation();seleccionarProducto('recargaCuentaNetflix', 'Netflix — Cuenta Completa', 13.50, 12800.00)">Comprar Ahora</button>
        </div>
    </div>
</div>

<script>
function seleccionarProducto(tipo, nombre, precioUSD, precioBSF){
    localStorage.setItem('juego_seleccionado', 'Netflix');
    localStorage.setItem('producto_seleccionado', nombre);
    localStorage.setItem('paquete_tipo', tipo);
    localStorage.setItem('precio_usd', precioUSD);
    localStorage.setItem('precio_bs', precioBSF);
    window.location.href = 'pasarela.html';
}
</script>

</body>
</html>
