<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECARGASGAMES - Free Fire</title>
<style>
body{background:#030712;background-image:url('img/fondo.jpg');background-size:cover;background-position:center;background-attachment:fixed;color:white;font-family:sans-serif;margin:0;padding:0;}
.navbar{background:#0b1220;padding:18px;font-size:22px;font-weight:bold;border-bottom:1px solid #1f2937;}
.games-menu{display:flex;gap:10px;overflow-x:auto;padding:15px;background:#0b1220;border-bottom:1px solid #1f2937;}
.games-menu::-webkit-scrollbar{display:none;}
.games-menu a{text-decoration:none;color:white;background:#111827;padding:10px 18px;border-radius:14px;font-size:15px;font-weight:bold;white-space:nowrap;border:1px solid #1f2937;}
.games-menu a.active{background:#2563eb;}
.main{padding:20px;}
.card-panel{background:#0b1220;border:1px solid #1f2937;border-radius:20px;padding:20px;margin-bottom:20px;}
.panel-title{font-size:20px;font-weight:bold;margin-bottom:15px;}
.form-input{width:100%;height:55px;background:#111827;border:none;border-radius:14px;padding:15px;color:white;font-size:18px;box-sizing:border-box;}
.payment-title{font-size:15px;font-weight:bold;color:#d1d5db;margin:20px 0 10px;}
.pay-box{display:flex;align-items:center;gap:15px;background:#030712;border:2px solid #1e3a8a;border-radius:18px;padding:18px;margin-bottom:15px;cursor:pointer;}
.pay-box.active{border:2px solid #2563eb;}
.pay-name{font-size:20px;font-weight:bold;}
.product-card{background:#0b1220;border:1px solid #1f2937;border-radius:20px;padding:18px;margin-bottom:15px;}
.product-title{font-size:22px;font-weight:bold;margin-bottom:10px;}
.product-status{color:#9ca3af;margin-bottom:12px;}
.product-price{font-size:34px;font-weight:bold;color:#00d084;margin-bottom:12px;}
.btn-buy{width:100%;height:45px;border:none;border-radius:12px;background:#2563eb;color:white;font-size:18px;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>

<div class="navbar">RECARGASGAMES</div>

<div class="games-menu">
<a href="freefire.html" class="active">🔥 Free Fire</a>
<a href="bloodstrike.html">🪖 Blood Strike</a>
<a href="roblox.html">🤖 Roblox</a>
</div>

<div class="main">
<div class="card-panel">
<div class="panel-title">👤 ID Free Fire</div>
<input type="number" class="form-input" id="jugadorId" placeholder="Ingresa tu ID">
</div>

<div class="card-panel">
<div class="panel-title">💳 Método de pago</div>
<div class="payment-title">BS BOLIVARES</div>
<div class="pay-box active" onclick="seleccionarPago('bs', this)">
<div class="pay-name">💳 PAGO MOVIL</div>
</div>
<div class="payment-title">$ DOLAR (USDT)</div>
<div class="pay-box" onclick="seleccionarPago('usdt', this)">
<div class="pay-name">🔶 BINANCE</div>
</div>
</div>

<div class="product-card">
<div class="product-title">110 Diamantes💎</div>
<div class="product-status">Recarga instantánea ⚡</div>
<div class="product-price" data-usd="0.97">$0.97</div>
<button class="btn-buy">🔒 Comprar</button>
</div>

<div class="product-card">
<div class="product-title">220 Diamantes💎</div>
<div class="product-status">Recarga instantánea ⚡</div>
<div class="product-price" data-usd="1.96">$1.96</div>
<button class="btn-buy">🔒 Comprar</button>
</div>
</div>

<script>
function seleccionarPago(tipo, elemento){
document.querySelectorAll('.pay-box').forEach(box=>{box.classList.remove('active');});
elemento.classList.add('active');
let tasa = 690;
document.querySelectorAll('.product-price').forEach(precio=>{
let usd = parseFloat(precio.dataset.usd);
if(tipo=="bs"){precio.innerHTML = (usd*tasa).toFixed(0) + " Bs";}
else{precio.innerHTML = "$"+usd.toFixed(2);}
});
}

document.querySelectorAll('.product-card').forEach(card => {
    const btn = card.querySelector('.btn-buy');
    btn.addEventListener('click', function(){
        const idInput = document.getElementById('jugadorId');
        const jugadorId = idInput ? idInput.value.trim() : '';

        if(jugadorId === ""){
            alert("Por favor, ingresa tu ID de Free Fire antes de continuar.");
            return;
        }

        const juego = "Free Fire";
        const producto = card.querySelector('.product-title').innerText;
        const precioUsd = card.querySelector('.product-price').dataset.usd;
        const metodoPago = document.querySelector('.pay-box.active .pay-name').innerText.trim();

        localStorage.setItem('id_jugador', jugadorId);
        localStorage.setItem('juego_seleccionado', juego);
        localStorage.setItem('producto_seleccionado', producto);
        localStorage.setItem('precio_usd', precioUsd);
        localStorage.setItem('metodo_pago', metodoPago);

        window.location.href = 'pasarela.html';
    });
});
seleccionarPago('bs', document.querySelector('.pay-box'));
</script>
</body>
</html>
