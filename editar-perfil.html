<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Editar Perfil - RECARGASGAMES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background-image:url('fondo.jpg');background-size:cover;background-attachment:fixed;color:#fff;font-family:'Segoe UI',sans-serif}
.header{background:rgba(11,18,32,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;color:#10b981;display:flex;align-items:center;gap:10px}
.brand img{height:35px}
.header-actions{display:flex;gap:10px}
.back-home{background:#10b981;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none}
.back-home:hover{background:#059669}
.games-menu{display:flex;gap:8px;overflow-x:auto;background:rgba(11,18,32,.95);padding:12px 15px;border-bottom:1px solid #1f2937;margin-bottom:20px}
.games-menu a{text-decoration:none;color:#fff;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;transition:0.2s}
.games-menu a:hover{background:#10b981;color:#0f172a}
.games-menu a.active{background:#10b981;color:#0f172a}
.main{padding:20px;max-width:500px;margin:0 auto}
.perfil-card{background:rgba(11,18,32,.9);border:1px solid #10b981;border-radius:20px;padding:25px;margin-bottom:20px}
.perfil-header{display:flex;align-items:center;gap:20px;margin-bottom:25px;flex-wrap:wrap}
.perfil-avatar{background:#1f2937;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px}
.perfil-info h2{color:#10b981;margin-bottom:5px}
.perfil-info p{color:#9ca3af;font-size:14px}
.section-title{font-size:16px;font-weight:700;margin:20px 0 12px;color:#10b981;border-left:4px solid #10b981;padding-left:12px}
.form-group{margin-bottom:18px}
.form-group label{display:block;color:#9ca3af;font-size:13px;margin-bottom:8px}
.form-group input{width:100%;height:45px;border-radius:12px;border:1px solid #1f2937;background:#111827;color:#fff;padding:12px;font-size:14px}
.form-group input:focus{outline:none;border-color:#10b981}
.btn-guardar{background:#10b981;color:#fff;border:none;width:100%;height:45px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-guardar:hover{background:#059669}
.btn-guardar.loading{opacity:0.6;pointer-events:none}
.btn-cerrar{background:#ef4444;color:#fff;border:none;width:100%;height:45px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px}
.btn-cerrar:hover{background:#dc2626}
.divider{height:1px;background:#1f2937;margin:20px 0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:30px;font-weight:bold;z-index:1000;animation:fadeInUp 0.3s ease}
.toast.error{background:#ef4444}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360)}}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:500px){.perfil-header{justify-content:center;text-align:center}}
</style>
</head>
<body>

<div class="header">
    <div class="brand"><img src="logo.png" alt="Logo"> RECARGASGAMES</div>
    <div class="header-actions">
        
    </div>
</div>

<!-- Menú de juegos -->
<div class="games-menu">
    <a href="index.html">🏠 Inicio</a>
    <a href="freefire.html">🔥 Free Fire</a>
    <a href="bloodstrike.html">🪖 Blood Strike</a>
    <a href="roblox.html">🤖 Roblox</a>
    <a href="ml.html">👑 MLBB</a>
    <a href="cod.html">🎮 COD Mobile</a>
    <a href="pubg.html">🎮 PUBG Mobile</a>
</div>

<div class="main">
    <div class="perfil-card">
        <div class="perfil-header">
            <div class="perfil-avatar" id="avatar">👤</div>
            <div class="perfil-info">
                <h2 id="nombreUsuario">Cargando...</h2>
                <p id="emailUsuario">cargando@email.com</p>
            </div>
        </div>
        
        <div class="section-title">✏️ EDITAR NOMBRE</div>
        <div class="form-group">
            <label>📝 Nombre completo</label>
            <input type="text" id="editNombre" placeholder="Tu nombre">
        </div>
        <button class="btn-guardar" id="btnGuardarNombre">💾 Actualizar Nombre</button>
        
        <div class="divider"></div>
        
        <div class="section-title">🔐 CAMBIAR CONTRASEÑA</div>
        <div class="form-group">
            <label>🔒 Contraseña actual</label>
            <input type="password" id="passActual" placeholder="Ingresa tu contraseña actual">
        </div>
        <div class="form-group">
            <label>🆕 Nueva contraseña</label>
            <input type="password" id="passNueva" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
            <label>✅ Confirmar nueva contraseña</label>
            <input type="password" id="passConfirmar" placeholder="Repite la nueva contraseña">
        </div>
        <button class="btn-guardar" id="btnGuardarPass">🔒 Actualizar Contraseña</button>
        
        <button class="btn-cerrar" id="btnCerrarSesion">🚪 Cerrar Sesión</button>
    </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile,updatePassword,reauthenticateWithCredential,EmailAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,update}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
    apiKey:"AIzaSyDyo-HiGfO0IcRret7AgHj4dlU4j0PVlq0",
    authDomain:"recargasgames-14c38.firebaseapp.com",
    databaseURL:"https://recargasgames-14c38-default-rtdb.firebaseio.com",
    projectId:"recargasgames-14c38",
    storageBucket:"recargasgames-14c38.firebasestorage.app",
    messagingSenderId:"370952235234",
    appId:"1:370952235234:web:41a9ebd7084f1955a256bb"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let usuarioActual=null;

function mostrarToast(mensaje,isError=false){
    const toast=document.createElement('div');
    toast.className='toast'+(isError?' error':'');
    toast.innerText=mensaje;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),3000);
}

function cargarPerfil(user){
    document.getElementById('nombreUsuario').innerText=user.displayName || user.email;
    document.getElementById('emailUsuario').innerText=user.email;
    document.getElementById('editNombre').value=user.displayName || '';
    document.getElementById('avatar').innerHTML=(user.displayName || user.email).charAt(0).toUpperCase();
}

// Guardar nombre
document.getElementById('btnGuardarNombre').onclick=async()=>{
    const nuevoNombre=document.getElementById('editNombre').value.trim();
    if(!nuevoNombre){
        mostrarToast("❌ Ingresa un nombre", true);
        return;
    }
    const btn=document.getElementById('btnGuardarNombre');
    btn.classList.add('loading');
    btn.innerHTML='<span class="spinner"></span> Guardando...';
    try{
        await updateProfile(usuarioActual, { displayName: nuevoNombre });
        const userRef=ref(db,'usuarios/'+usuarioActual.uid);
        await update(userRef, { nombre: nuevoNombre });
        cargarPerfil(usuarioActual);
        mostrarToast("✅ Nombre actualizado");
    }catch(e){
        mostrarToast("❌ Error: "+e.message, true);
    }
    btn.classList.remove('loading');
    btn.innerHTML='💾 Actualizar Nombre';
};

// Guardar contraseña
document.getElementById('btnGuardarPass').onclick=async()=>{
    const passActual=document.getElementById('passActual').value;
    const passNueva=document.getElementById('passNueva').value;
    const passConfirmar=document.getElementById('passConfirmar').value;
    
    if(!passActual){
        mostrarToast("❌ Ingresa tu contraseña actual", true);
        return;
    }
    if(!passNueva){
        mostrarToast("❌ Ingresa una nueva contraseña", true);
        return;
    }
    if(passNueva.length<6){
        mostrarToast("❌ La nueva contraseña debe tener al menos 6 caracteres", true);
        return;
    }
    if(passNueva !== passConfirmar){
        mostrarToast("❌ Las contraseñas nuevas no coinciden", true);
        return;
    }
    
    const btn=document.getElementById('btnGuardarPass');
    btn.classList.add('loading');
    btn.innerHTML='<span class="spinner"></span> Actualizando...';
    try{
        const credential=EmailAuthProvider.credential(usuarioActual.email, passActual);
        await reauthenticateWithCredential(usuarioActual, credential);
        await updatePassword(usuarioActual, passNueva);
        mostrarToast("✅ Contraseña actualizada");
        document.getElementById('passActual').value='';
        document.getElementById('passNueva').value='';
        document.getElementById('passConfirmar').value='';
    }catch(e){
        if(e.code==='auth/wrong-password'){
            mostrarToast("❌ Contraseña actual incorrecta", true);
        }else{
            mostrarToast("❌ Error: "+e.message, true);
        }
    }
    btn.classList.remove('loading');
    btn.innerHTML='🔒 Actualizar Contraseña';
};

// Cerrar sesión
document.getElementById('btnCerrarSesion').onclick=()=>{
    signOut(auth).then(()=>{
        localStorage.clear();
        window.location.href="index.html";
    });
};

onAuthStateChanged(auth,(user)=>{
    if(!user){
        window.location.href="login.html";
        return;
    }
    usuarioActual=user;
    cargarPerfil(user);
});
</script>
</body>
</html>
