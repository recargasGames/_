<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - RECARGASGAMES</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background-image:url('fondo.jpg');background-size:cover;background-attachment:fixed;color:#fff;font-family:'Segoe UI',sans-serif}
.login-admin{display:flex;justify-content:center;align-items:center;height:100vh;padding:20px}
.login-box{background:rgba(11,18,32,.95);border:1px solid #10b981;border-radius:20px;padding:30px;width:100%;max-width:350px;text-align:center}
.login-box h2{color:#10b981;margin-bottom:20px}
.login-box input{width:100%;height:45px;margin:10px 0;border-radius:10px;border:1px solid #1f2937;background:#111827;color:#fff;padding:10px}
.login-box button{width:100%;height:45px;background:#10b981;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700}
.error{color:#ef4444;margin-top:10px;display:none}
.header{background:rgba(11,18,32,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;color:#10b981}
.admin-actions{display:flex;gap:10px}
.admin-btn{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
.admin-btn.danger{background:#dc2626}
.main{padding:15px;max-width:1400px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:rgba(11,18,32,.9);border:1px solid #1f2937;border-radius:14px;padding:12px;text-align:center}
.stat-number{font-size:24px;font-weight:700;color:#10b981}
.stat-label{font-size:11px;color:#9ca3af}
.config-card{background:rgba(11,18,32,.85);border:1px solid #1f2937;border-radius:14px;padding:15px;margin-bottom:20px}
.config-card h3{color:#10b981;margin-bottom:12px;font-size:16px}
.config-row{display:flex;gap:10px;flex-wrap:wrap}
.config-input{flex:1;min-width:120px;height:40px;border-radius:10px;background:#111827;color:#fff;padding:8px 12px;border:1px solid #1f2937}
.config-btn{background:#10b981;color:#fff;border:none;padding:8px 20px;border-radius:10px;cursor:pointer}
.filters{background:rgba(11,18,32,.85);border:1px solid #1f2937;border-radius:14px;padding:12px;margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap}
.filter-select,.filter-search{background:#111827;border:1px solid #1f2937;color:#fff;padding:8px 12px;border-radius:10px}
.filter-search{flex:1;min-width:150px}
.refresh-btn{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:10px;cursor:pointer}
.table-container{background:rgba(11,18,32,.85);border:1px solid #1f2937;border-radius:14px;padding:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:800px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #1f2937}
th{background:#1f2937;color:#10b981}
tr:hover{background:rgba(16,185,129,.1)}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-pendiente{background:#f97316}
.badge-completado{background:#22c55e}
.btn-action{border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;margin:2px}
.btn-view{background:#2563eb;color:#fff}
.btn-complete{background:#22c55e;color:#fff}
.btn-delete{background:#ef4444;color:#fff}
.pagination{display:flex;justify-content:center;gap:5px;margin-top:15px;flex-wrap:wrap}
.page-btn{background:#111827;border:1px solid #1f2937;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer}
.page-btn.active{background:#10b981}
.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.modal-content{background:#111827;padding:20px;border-radius:16px;max-width:90%;width:450px;border:1px solid #10b981}
.modal-content h3{color:#10b981;margin-bottom:15px}
.modal-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1f2937;font-size:13px}
.close-modal{background:#10b981;color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer;margin-top:15px;width:100%}
.nombre-jugador{color:#10b981;font-weight:700}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.filters{flex-direction:column}.filter-search,.filter-select,.refresh-btn{width:100%}}
</style>
</head>
<body>

<div class="login-admin" id="loginPanel">
    <div class="login-box">
        <h2>🔐 Acceso Administrador</h2>
        <input type="email" id="adminEmail" placeholder="Correo autorizado" value="aa3964063@gmail.com">
        <input type="password" id="adminPassword" placeholder="Contraseña">
        <button onclick="verificarAcceso()">Ingresar</button>
        <div id="errorMsg" class="error"></div>
    </div>
</div>

<div id="adminContent" style="display:none">
    <div class="header">
        <div class="brand">⚙️ PANEL ADMIN - RECARGASGAMES</div>
        <div class="admin-actions">
            <button class="admin-btn" onclick="recargarTodo()">🔄 Recargar</button>
            <button class="admin-btn danger" onclick="cerrarSesion()">🚪 Salir</button>
        </div>
    </div>
    <div class="main">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalPedidos">0</div><div class="stat-label">Total Pedidos</div></div>
            <div class="stat-card"><div class="stat-number" id="totalPendientes">0</div><div class="stat-label">Pendientes</div></div>
            <div class="stat-card"><div class="stat-number" id="totalCompletados">0</div><div class="stat-label">Completados</div></div>
            <div class="stat-card"><div class="stat-number" id="totalGanado">0</div><div class="stat-label">💰 Ganado (Bs)</div></div>
        </div>

        <div class="config-card">
            <h3>💱 Configuración Tasa USDT</h3>
            <div class="config-row">
                <input type="number" id="tasaInput" class="config-input" placeholder="Tasa Bs/USDT" value="735">
                <button class="config-btn" onclick="guardarTasa()">💾 Guardar Tasa</button>
                <span style="font-size:12px;color:#9ca3af">Tasa actual: <span id="tasaActual">735</span> Bs</span>
            </div>
        </div>

        <div class="filters">
            <select id="filtroEstado" class="filter-select">
                <option value="todos">Todos</option>
                <option value="pendiente">Pendientes</option>
                <option value="completado">Completados</option>
            </select>
            <select id="filtroJuego" class="filter-select">
                <option value="todos">Todos los juegos</option>
                <option value="FREE FIRE">🔥 Free Fire</option>
                <option value="BLOOD STRIKE">🪖 Blood Strike</option>
                <option value="ROBLOX">🤖 Roblox</option>
                <option value="MOBILE LEGENDS">👑 MLBB</option>
                <option value="CALL OF DUTY">🎮 COD Mobile</option>
            </select>
            <input type="text" id="searchInput" class="filter-search" placeholder="Buscar por ID, nombre o referencia...">
            <button class="refresh-btn" onclick="recargarPedidos()">🔄 Actualizar</button>
            <button class="refresh-btn" onclick="exportarPedidos()" style="background:#22c55e">📥 Exportar</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>ID Jugador</th><th>Nombre</th><th>Juego</th><th>Producto</th><th>Monto</th><th>Referencia</th><th>Estado</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaPedidos"><tr><td colspan="9" class="no-pedidos">Cargando...</td></tr>
            </table>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</div>

<div id="modalDetalles" class="modal">
    <div class="modal-content"><h3>📋 Detalles del Pedido</h3><div id="modalBody"></div><button class="close-modal" onclick="cerrarModal()">Cerrar</button></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,onValue,update,remove,set,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyDyo-HiGfO0IcRret7AgHj4dlU4j0PVlq0",authDomain:"recargasgames-14c38.firebaseapp.com",databaseURL:"https://recargasgames-14c38-default-rtdb.firebaseio.com",projectId:"recargasgames-14c38",storageBucket:"recargasgames-14c38.firebasestorage.app",messagingSenderId:"370952235234",appId:"1:370952235234:web:41a9ebd7084f1955a256bb"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const ADMIN_EMAIL="aa3964063@gmail.com";

let pedidos=[];
let currentPage=1;
const porPagina=10;

function filtrarPedidos(){
    let filtrados=pedidos;
    const estado=document.getElementById('filtroEstado').value;
    const juego=document.getElementById('filtroJuego').value;
    const busqueda=document.getElementById('searchInput').value.toLowerCase();
    
    if(estado==='pendiente')filtrados=filtrados.filter(p=>p.estado!=='Completado');
    if(estado==='completado')filtrados=filtrados.filter(p=>p.estado==='Completado');
    if(juego!=='todos')filtrados=filtrados.filter(p=>p.juego?.includes(juego));
    if(busqueda){
        filtrados=filtrados.filter(p=>
            (p.id_jugador && p.id_jugador.toLowerCase().includes(busqueda)) ||
            (p.nombre_verificado && p.nombre_verificado.toLowerCase().includes(busqueda)) ||
            (p.referencia && p.referencia.toLowerCase().includes(busqueda))
        );
    }
    return filtrados;
}

function actualizarStats(filtrados){
    const pendientes=filtrados.filter(p=>p.estado!=='Completado').length;
    const completados=filtrados.filter(p=>p.estado==='Completado').length;
    let ganado=0;
    filtrados.forEach(p=>{if(p.estado==='Completado' && p.precio)ganado+=parseFloat(p.precio.replace('Bs',''))||0});
    document.getElementById('totalPedidos').innerText=filtrados.length;
    document.getElementById('totalPendientes').innerText=pendientes;
    document.getElementById('totalCompletados').innerText=completados;
    document.getElementById('totalGanado').innerText=ganado.toLocaleString('es-VE');
}

function renderizarPedidos(){
    const filtrados=filtrarPedidos();
    actualizarStats(pedidos);
    const totalPages=Math.ceil(filtrados.length/porPagina);
    const start=(currentPage-1)*porPagina;
    const paginados=filtrados.slice(start,start+porPagina);
    const tbody=document.getElementById('listaPedidos');
    
    if(paginados.length===0){
        tbody.innerHTML='<tr><td colspan="9" class="no-pedidos">📭 Sin pedidos</td></tr>';
        document.getElementById('pagination').innerHTML='';
        return;
    }
    
    let html='';
    paginados.forEach((p,i)=>{
        const badgeClass=p.estado==='Completado'?'badge-completado':'badge-pendiente';
        const nombreMostrar=p.nombre_verificado || p.usuario || 'Anónimo';
        html+=`<tr>
            <td>${start+i+1}</td>
            <td><strong>${p.id_jugador || p.jugadorId || 'N/A'}</strong></td>
            <td><span class="nombre-jugador">${nombreMostrar}</span></td>
            <td>${p.juego || 'N/A'}</td>
            <td>${p.producto || 'N/A'}</td>
            <td>${p.precio || '0 Bs'}</td>
            <td>${p.referencia || 'N/A'}</td>
            <td><span class="badge ${badgeClass}">${p.estado || 'Pendiente'}</span></td>
            <td>
                <button class="btn-action btn-view" onclick="verDetalle('${p.id}')">👁️</button>
                <button class="btn-action btn-complete" onclick="completarPedido('${p.id}')" ${p.estado==='Completado'?'disabled':''}>✅</button>
                <button class="btn-action btn-delete" onclick="eliminarPedido('${p.id}')">🗑️</button>
            </td>
        </tr>`;
    });
    tbody.innerHTML=html;
    
    let pages='';
    for(let i=1;i<=totalPages;i++)pages+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="irPagina(${i})">${i}</button>`;
    document.getElementById('pagination').innerHTML=pages;
}

function cargarPedidos(){
    onValue(ref(db,'pedidos'),(snapshot)=>{
        const data=snapshot.val();
        pedidos=[];
        if(data)for(let id in data)pedidos.push({id,...data[id]});
        pedidos.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
        renderizarPedidos();
    });
}

window.verDetalle=(id)=>{
    const p=pedidos.find(x=>x.id===id);
    if(!p)return;
    const nombreMostrar=p.nombre_verificado || p.usuario || 'No disponible';
    document.getElementById('modalBody').innerHTML=`
        <div class="modal-detail-row"><strong>ID Jugador:</strong> ${p.id_jugador || p.jugadorId || 'N/A'}</div>
        <div class="modal-detail-row"><strong>Nombre:</strong> <span class="nombre-jugador">${nombreMostrar}</span></div>
        <div class="modal-detail-row"><strong>Juego:</strong> ${p.juego || 'N/A'}</div>
        <div class="modal-detail-row"><strong>Producto:</strong> ${p.producto || 'N/A'}</div>
        <div class="modal-detail-row"><strong>Monto:</strong> ${p.precio || '0 Bs'}</div>
        <div class="modal-detail-row"><strong>Referencia:</strong> ${p.referencia || 'N/A'}</div>
        <div class="modal-detail-row"><strong>Método:</strong> ${p.metodo || 'PAGO MOVIL'}</div>
        <div class="modal-detail-row"><strong>Fecha:</strong> ${p.fecha || new Date(p.timestamp).toLocaleString()}</div>
        <div class="modal-detail-row"><strong>Estado:</strong> ${p.estado || 'Pendiente'}</div>
    `;
    document.getElementById('modalDetalles').style.display='flex';
};

window.completarPedido=async(id)=>{
    if(!confirm('¿Marcar como COMPLETADO?'))return;
    await update(ref(db,'pedidos/'+id),{estado:'Completado',fecha_completado:new Date().toLocaleString()});
    alert('✅ Pedido completado');
    cargarPedidos();
};

window.eliminarPedido=async(id)=>{
    if(!confirm('¿Eliminar?'))return;
    await remove(ref(db,'pedidos/'+id));
    cargarPedidos();
};

window.recargarPedidos=()=>{currentPage=1;renderizarPedidos();};
window.irPagina=(page)=>{currentPage=page;renderizarPedidos();};
window.cerrarModal=()=>document.getElementById('modalDetalles').style.display='none';

window.guardarTasa=async()=>{
    let tasa=document.getElementById('tasaInput').value;
    if(!tasa)return alert('Ingresa una tasa');
    await set(ref(db,'configuracion/tasa_dolar'),parseFloat(tasa));
    document.getElementById('tasaActual').innerText=tasa;
    alert('✅ Tasa guardada');
};

function cargarTasa(){
    onValue(ref(db,'configuracion/tasa_dolar'),(snapshot)=>{
        const tasa=snapshot.val();
        if(tasa){document.getElementById('tasaInput').value=tasa;document.getElementById('tasaActual').innerText=tasa;}
    });
}

window.recargarTodo=()=>{cargarPedidos();};

window.exportarPedidos=()=>{
    const filtrados=filtrarPedidos();
    if(filtrados.length===0)return alert('No hay pedidos');
    let csv="ID Jugador,Nombre,Juego,Producto,Monto,Referencia,Fecha,Estado\n";
    filtrados.forEach(p=>{
        csv+=`"${p.id_jugador||p.jugadorId||''}","${p.nombre_verificado||p.usuario||''}","${p.juego||''}","${p.producto||''}","${p.precio||''}","${p.referencia||''}","${p.fecha||''}","${p.estado||'Pendiente'}"\n`;
    });
    const blob=new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`pedidos_${new Date().toISOString().slice(0,19)}.csv`;
    a.click();
    alert('✅ Exportado');
};

window.verificarAcceso=async()=>{
    const email=document.getElementById("adminEmail").value.trim();
    const password=document.getElementById("adminPassword").value;
    const errorMsg=document.getElementById("errorMsg");
    if(email!==ADMIN_EMAIL){errorMsg.textContent="❌ Correo no autorizado";errorMsg.style.display="block";return;}
    try{
        await signInWithEmailAndPassword(auth,email,password);
        document.getElementById("loginPanel").style.display="none";
        document.getElementById("adminContent").style.display="block";
        cargarPedidos();
        cargarTasa();
    }catch(e){errorMsg.textContent="❌ Contraseña incorrecta";errorMsg.style.display="block";}
};

window.cerrarSesion=()=>{signOut(auth);document.getElementById("loginPanel").style.display="flex";document.getElementById("adminContent").style.display="none";};

document.getElementById('filtroEstado')?.addEventListener('change',()=>{currentPage=1;renderizarPedidos();});
document.getElementById('filtroJuego')?.addEventListener('change',()=>{currentPage=1;renderizarPedidos();});
document.getElementById('searchInput')?.addEventListener('keyup',()=>{currentPage=1;renderizarPedidos();});

onAuthStateChanged(auth,(user)=>{if(user&&user.email===ADMIN_EMAIL){document.getElementById("loginPanel").style.display="none";document.getElementById("adminContent").style.display="block";cargarPedidos();cargarTasa();}});
</script>
</body>
</html>
