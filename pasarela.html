<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Recarga - Recargas Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-top: 80px;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(11, 18, 32, 0.95);
            border-bottom: 2px solid #3b82f6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .topbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar .logo img {
            height: 45px;
            border-radius: 10px;
        }
        .topbar .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .topbar .logo h1 span {
            color: #3b82f6;
        }
        .topbar .btn-back {
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .topbar .btn-back:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .card .sub {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .id-display {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .id-display .label {
            font-size: 14px;
            color: #9ca3af;
        }
        .id-display .id-value {
            font-size: 28px;
            font-weight: 700;
            color: #3b82f6;
            margin-top: 5px;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .resumen-box {
            background: rgba(11, 18, 32, 0.6);
            border-radius: 12px;
            padding: 18px;
            margin: 20px 0;
            text-align: left;
        }
        .resumen-fila {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .resumen-fila:last-child {
            border-bottom: none;
        }
        .resumen-etiqueta {
            color: #9ca3af;
        }
        .resumen-valor {
            font-weight: 600;
        }
        .resumen-valor.verde {
            color: #22c55e;
        }

        .btn-procesar {
            width: 100%;
            padding: 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-procesar:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .btn-procesar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-volver {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-volver:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .resultado {
            padding: 16px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
            white-space: pre-line;
        }
        .resultado.exito {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .resultado.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .resultado.procesando {
            display: block;
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .pin-container {
            margin-top: 15px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            border: 2px solid #22c55e;
            display: none;
        }
        .pin-container .pin-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .pin-container .pin-value {
            font-size: 32px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 4px;
            margin: 8px 0;
            word-break: break-all;
        }
        .pin-container .btn-copiar {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .pin-container .btn-copiar:hover {
            background: rgba(34, 197, 94, 0.3);
        }

        @media (max-width: 500px) {
            .card {
                padding: 20px;
            }
            .id-display .id-value {
                font-size: 22px;
            }
            .topbar .logo h1 {
                font-size: 16px;
            }
            .pin-container .pin-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">
            <img src="logo.png" alt="Recargas Games">
            <h1>Recargas<span>Games</span></h1>
        </div>
        <a href="javascript:history.back()" class="btn-back">← Volver</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>🔄 Procesando Recarga</h2>
            <p class="sub">Confirma los datos y procesa tu recarga</p>

            <div class="id-display">
                <div class="label">🆔 ID del Jugador</div>
                <div class="id-value" id="idMostrado">-</div>
            </div>

            <div class="resumen-box">
                <div class="resumen-fila">
                    <span class="resumen-etiqueta">🎮 Juego</span>
                    <span class="resumen-valor" id="resJuego">-</span>
                </div>
                <div class="resumen-fila">
                    <span class="resumen-etiqueta">📦 Producto</span>
                    <span class="resumen-valor" id="resProducto">-</span>
                </div>
                <div class="resumen-fila">
                    <span class="resumen-etiqueta">💳 Método</span>
                    <span class="resumen-valor" id="resMetodo">-</span>
                </div>
                <div class="resumen-fila">
                    <span class="resumen-etiqueta">💰 Total</span>
                    <span class="resumen-valor verde" id="resTotal">-</span>
                </div>
            </div>

            <div class="spinner" id="spinner"></div>
            <div class="resultado" id="resultado"></div>

            <div class="pin-container" id="pinContainer">
                <div class="pin-label">🎮 PIN DE ROBLOX</div>
                <div class="pin-value" id="pinValue">-</div>
                <button class="btn-copiar" onclick="copiarPIN()">📋 Copiar PIN</button>
            </div>

            <button class="btn-procesar" id="btnProcesar" onclick="procesarRecarga()">🚀 Procesar Recarga</button>
            <button class="btn-volver" onclick="window.location.href='freefire.html'">← Volver a la tienda</button>
        </div>
    </div>

    <script>
        // ==============================================
        // 📋 CARGAR DATOS DEL LOCALSTORAGE
        // ==============================================
        const idJugador = localStorage.getItem('id_jugador') || '';
        const juego = localStorage.getItem('juego_seleccionado') || 'Juego';
        const producto = localStorage.getItem('producto_seleccionado') || 'Producto';
        const metodo = localStorage.getItem('metodo_pago') || 'Pago Móvil';
        const precioUsd = localStorage.getItem('precio_usd') || '0.00';
        const precioBs = localStorage.getItem('precio_en_bs') || '0';
        const paqueteCodigo = localStorage.getItem('paquete_codigo') || '1';

        // Mostrar datos
        document.getElementById('idMostrado').textContent = idJugador || 'No hay ID';
        document.getElementById('resJuego').textContent = juego;
        document.getElementById('resProducto').textContent = producto;
        document.getElementById('resMetodo').textContent = metodo;
        document.getElementById('resTotal').textContent = `${precioUsd} USD / ${precioBs} Bs`;

        // ==============================================
        // 🚀 PROCESAR RECARGA
        // ==============================================
        async function procesarRecarga() {
            const btn = document.getElementById('btnProcesar');
            const spinner = document.getElementById('spinner');
            const resultado = document.getElementById('resultado');
            const pinContainer = document.getElementById('pinContainer');

            // Validar ID
            if (!idJugador || idJugador.length < 5) {
                resultado.className = 'resultado error';
                resultado.textContent = '❌ ID de jugador inválido. Vuelve a la tienda.';
                return;
            }

            // Deshabilitar botón
            btn.disabled = true;
            btn.textContent = '⏳ Procesando...';
            spinner.style.display = 'block';
            resultado.className = 'resultado procesando';
            resultado.textContent = '⏳ Enviando recarga...';
            pinContainer.style.display = 'none';

            try {
                // Preparar datos
                const datosEnvio = {
                    juego: juego.toUpperCase(),
                    id_jugador: idJugador,
                    paquete: paqueteCodigo,
                    email: idJugador
                };

                console.log('📤 Enviando:', datosEnvio);

                // ✅ LLAMAR A LA API CON URL COMPLETA
                const response = await fetch('https://www.recargasgames.shop/api/central-one', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        accion: 'recarga',
                        datos: datosEnvio
                    })
                });

                console.log('📥 Status:', response.status);
                console.log('📥 Content-Type:', response.headers.get('content-type'));

                // Verificar que la respuesta sea JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const texto = await response.text();
                    console.error('❌ Respuesta no es JSON:', texto.substring(0, 200));
                    throw new Error('La API no devolvió JSON. Revisa el backend.');
                }

                const data = await response.json();
                console.log('📥 Respuesta:', data);

                // Verificar errores
                if (!response.ok) {
                    if (data.sinSaldo) {
                        resultado.className = 'resultado error';
                        resultado.textContent = '⚠️ Saldo insuficiente. Contacta a soporte.';
                    } else if (data.sinStock) {
                        resultado.className = 'resultado error';
                        resultado.textContent = '⚠️ Producto agotado temporalmente. Intenta más tarde.';
                    } else {
                        resultado.className = 'resultado error';
                        resultado.textContent = `❌ Error: ${data.error || 'Error desconocido'}`;
                    }
                    return;
                }

                // ✅ Éxito
                if (data.exito) {
                    resultado.className = 'resultado exito';
                    resultado.textContent = `✅ ${data.mensaje || 'Recarga exitosa'}`;
                    
                    if (data.referencia) {
                        resultado.textContent += `\n📋 Ref: ${data.referencia}`;
                    }

                    // Mostrar PIN si es Roblox
                    if (data.codigos && data.codigos.length > 0) {
                        pinContainer.style.display = 'block';
                        document.getElementById('pinValue').textContent = data.codigos[0];
                        resultado.textContent += '\n🎮 PIN generado!';
                    }

                } else {
                    resultado.className = 'resultado error';
                    resultado.textContent = `❌ ${data.mensaje || 'Error en la recarga'}`;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                resultado.className = 'resultado error';
                resultado.textContent = `❌ Error: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Reintentar';
                spinner.style.display = 'none';
            }
        }

        // ==============================================
        // 📋 COPIAR PIN
        // ==============================================
        function copiarPIN() {
            const pin = document.getElementById('pinValue').textContent;
            if (pin && pin !== '-') {
                navigator.clipboard.writeText(pin).then(() => {
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copiado!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    alert('PIN: ' + pin);
                });
            }
        }

        // ==============================================
        // ⏳ PROCESAMIENTO AUTOMÁTICO AL CARGAR
        // ==============================================
        if (idJugador && idJugador.length >= 5) {
            setTimeout(() => {
                procesarRecarga();
            }, 500);
        } else {
            document.getElementById('resultado').className = 'resultado error';
            document.getElementById('resultado').textContent = '❌ No hay ID de jugador. Vuelve a la tienda.';
        }

        console.log('📋 Pasarela cargada');
        console.log('🎮 Juego:', juego);
        console.log('🆔 ID:', idJugador);
        console.log('📦 Producto:', producto);
        console.log('💰 Precio:', precioUsd, 'USD');
    </script>

</body>
</html>
