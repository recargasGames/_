<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago - RECARGASGAMES</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-image: url('fondo.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            padding: 15px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 450px; background: rgba(11, 18, 32, 0.9); border: 2px solid #2563eb; border-radius: 20px; padding: 20px; }
        
        h2 { text-align: center; color: white; background: #2563eb; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 18px; }

        .neon-card { border: 2px solid #a855f7; box-shadow: 0 0 10px #a855f7; background: #0b1220; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .info-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .info-text { font-size: 13px; font-weight: bold; color: #cbd5e1; }
        .info-value { font-size: 16px; color: #fff; display: block; margin-top: 5px; }
        
        .copy-btn { background: #1f2937; border: 1px solid #6366f1; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .copy-btn.copied { background: #22c55e !important; border-color: #22c55e !important; }

        .instrucciones { border: 2px solid #06b6d4; box-shadow: 0 0 10px #06b6d4; background: #0b1220; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; font-size: 13px; }
        .monto-box { border: 2px solid #22c55e; box-shadow: 0 0 10px #22c55e; background: #0b1220; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #0b1220; color: white; margin-bottom: 10px; text-align: center; font-size: 14px; }
        .complete-btn { width: 100%; padding: 15px; background: #22c55e; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Método de Pago</h2>
    
    <div class="neon-card">
        <div class="info-row">
            <div><span class="info-text">TELEFONO:</span><span class="info-value">04228242411</span></div>
            <button class="copy-btn" onclick="copiar('04228242411', this)">☐</button>
        </div>
        <div class="info-row">
            <div><span class="info-text">CEDULA:</span><span class="info-value">32824869</span></div>
            <button class="copy-btn" onclick="copiar('32824869', this)">☐</button>
        </div>
        <div class="info-row">
            <div><span class="info-text">BANCO:</span><span class="info-value">0102 BDV</span></div>
            <button class="copy-btn" onclick="copiar('0102', this)">☐</button>
        </div>
    </div>

    <div class="instrucciones">
        ℹ️ REALIZA TU PAGO Y CARGA LA REFERENCIA<br>
        EJEMPLO: 001432808801
    </div>

    <div class="monto-box">
        <div><span class="info-text">Monto a enviar:</span><br><span id="montoDisplay" style="color:#22c55e; font-size: 20px; font-weight: bold;">Bs 708.10</span></div>
        <button class="copy-btn" onclick="copiar(document.getElementById('montoDisplay').innerText, this)">☐</button>
    </div>

    <input type="text" id="codigoDesc" class="input-box" placeholder="¿Código de descuento? " oninput="aplicarDesc()">
    <input type="text" id="referencia" class="input-box" placeholder="🧾 Ingresa tu Referencia">

    <button class="complete-btn" onclick="completar()">✅ COMPLETAR PEDIDO</button>
</div>

<script>
    function copiar(texto, btn) {
        navigator.clipboard.writeText(texto).then(() => {
            btn.innerText = "✓";
            btn.classList.add("copied");
            setTimeout(() => {
                btn.innerText = "☐";
                btn.classList.remove("copied");
            }, 1500);
        });
    }
    
    function aplicarDesc() {
        let cod = document.getElementById('codigoDesc').value.toUpperCase();
        let display = document.getElementById('montoDisplay');
        if(cod === "GAMES") {
            display.innerText = "Bs 697.48";
            display.style.color = "#a855f7";
        } else {
            display.innerText = "Bs 708.10";
            display.style.color = "#22c55e";
        }
    }

    function completar() {
        let ref = document.getElementById('referencia').value;
        if(!ref) { alert("¡Por favor, ingresa tu referencia de pago!"); return; }
        alert("Pedido procesado con referencia: " + ref);
    }
</script>
</body>
</html>
