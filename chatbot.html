<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente RecargasGames</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0e1a; color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #10a37f, #0d8a6b);
            padding: 14px 18px; display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .chat-header h3 { font-size: 15px; font-weight: 700; }
        .chat-header p { font-size: 11px; opacity: 0.85; }

        .chat-box {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 88%; padding: 11px 14px;
            border-radius: 14px; font-size: 14px;
            line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
        }
        .user { align-self: flex-end; background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #1e2a45; color: #e2e8f0; border-bottom-left-radius: 4px; }

        .typing { display: flex; gap: 4px; padding: 14px 18px; align-self: flex-start; background: #1e2a45; border-radius: 14px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: #94a3b8; animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        .sugerencias {
            display: flex; gap: 6px; padding: 8px 12px;
            overflow-x: auto; background: #0d1627;
            border-top: 1px solid rgba(30, 42, 69, 0.5);
            scrollbar-width: none; flex-shrink: 0;
        }
        .sugerencias::-webkit-scrollbar { display: none; }
        .sug-chip {
            flex-shrink: 0; padding: 6px 12px; border-radius: 16px;
            background: rgba(16, 163, 127, 0.15);
            border: 1px solid rgba(16, 163, 127, 0.4);
            color: #4ade80; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            transition: all 0.2s;
        }
        .sug-chip:hover { background: rgba(16, 163, 127, 0.3); }

        .input-area {
            display: flex; gap: 8px; padding: 12px;
            background: #0d1627;
            border-top: 1px solid rgba(30, 42, 69, 0.8);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 11px 14px; border-radius: 22px;
            border: 1px solid rgba(30, 42, 69, 0.9);
            background: #060c20; color: #fff; font-size: 14px;
            outline: none; font-family: inherit;
        }
        .input-area input:focus { border-color: #10a37f; }
        .input-area button {
            width: 44px; height: 44px; border-radius: 50%;
            border: none; background: #10a37f; color: #fff;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .input-area button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-header">
    <div class="avatar">🤖</div>
    <div>
        <h3>Asistente RecargasGames</h3>
        <p>Pregúntame lo que quieras</p>
    </div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="sugerencias" id="sugerencias">
    <button class="sug-chip" data-msg="¿Cuánto cuesta Free Fire 110 diamantes?">Free Fire 110 💎</button>
    <button class="sug-chip" data-msg="Precios de Netflix">Netflix</button>
    <button class="sug-chip" data-msg="Precios de Disney+">Disney+</button>
    <button class="sug-chip" data-msg="Precios de Roblox">Roblox</button>
    <button class="sug-chip" data-msg="¿Cómo recargo?">¿Cómo recargo?</button>
</div>

<div class="input-area">
    <input type="text" id="inputMensaje" placeholder="Escribe tu pregunta..." autocomplete="off">
    <button id="btnEnviar" aria-label="Enviar">➤</button>
</div>

<script>
    // ═══════════════════════════════════════════════
    // CONFIGURACIÓN
    // ═══════════════════════════════════════════════
    const OPENROUTER_KEY = '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';
    const MODELO = 'openai/gpt-3.5-turbo';
    const WHATSAPP = '584228242411';

    // Detectar si estamos en local o en producción (Vercel)
    const ES_LOCAL = location.hostname === 'localhost' ||
                     location.hostname === '127.0.0.1' ||
                     location.protocol === 'file:';

    // ═══════════════════════════════════════════════
    // FIREBASE
    // ═══════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ═══════════════════════════════════════════════
    // PÁGINAS CON PRECIOS
    // ═══════════════════════════════════════════════
    const PAGINAS_PRECIOS = [
        { archivo: 'freefire.html',      juego: 'Free Fire' },
        { archivo: 'roblox.html',        juego: 'Roblox' },
        { archivo: 'netflix.html',       juego: 'Netflix' },
        { archivo: 'disney.html',        juego: 'Disney+' },
        { archivo: 'hbo.html',           juego: 'HBO Max' },
        { archivo: 'mobilelegends.html', juego: 'Mobile Legends' },
        { archivo: 'bloodstrike.html',   juego: 'Blood Strike' },
        { archivo: 'spotify.html',       juego: 'Spotify' }
    ];

    let preciosExtraidos = null;

    async function extraerPreciosDeHTML() {
        if (preciosExtraidos) return preciosExtraidos;

        const resultado = {};

        for (const pagina of PAGINAS_PRECIOS) {
            try {
                const resp = await fetch(pagina.archivo);
                if (!resp.ok) continue;
                const html = await resp.text();

                const items = extraerPreciosDelHTML(html);
                if (items.length > 0) {
                    resultado[pagina.juego] = items;
                }
            } catch (e) {
                console.warn(`No se pudo leer ${pagina.archivo}:`, e.message);
            }
        }

        preciosExtraidos = resultado;
        return resultado;
    }

    function extraerPreciosDelHTML(html) {
        const items = [];

        // 1) data-nombre / data-precio
        const regexData = /data-(?:nombre|name|producto|paquete)="([^"]+)"[^>]*data-(?:precio|price|monto)="([^"]+)"/gi;
        let match;
        while ((match = regexData.exec(html)) !== null) {
            items.push({ nombre: match[1].trim(), precio: match[2].trim() });
        }

        // 2) Patrón: nombre en h3/span + precio con $
        if (items.length === 0) {
            const regexClase = /<(?:h[1-6]|span|div|p)[^>]*class="[^"]*(?:nombre|titulo|paquete|item|producto)[^"]*"[^>]*>([^<]+)<\/[^>]*>[\s\S]{0,300}?\$([\d.,]+)/gi;
            while ((match = regexClase.exec(html)) !== null) {
                items.push({ nombre: match[1].trim(), precio: match[2].trim() });
            }
        }

        // 3) Fallback: cualquier $X.XX
        if (items.length === 0) {
            const precios = html.match(/\$[\d]+(?:[.,]\d{1,2})?/g) || [];
            precios.forEach((p, i) => {
                items.push({ nombre: `Paquete ${i + 1}`, precio: p.replace('$', '').trim() });
            });
        }

        return items.slice(0, 20);
    }

    // ═══════════════════════════════════════════════
    // UI
    // ═══════════════════════════════════════════════
    const chatBox = document.getElementById('chatBox');
    const inputMensaje = document.getElementById('inputMensaje');
    const btnEnviar = document.getElementById('btnEnviar');
    const sugerencias = document.getElementById('sugerencias');

    let mensajes = JSON.parse(sessionStorage.getItem('chatHistorial') || '[]');

    function scrollAbajo() { chatBox.scrollTop = chatBox.scrollHeight; }

    function agregarMensaje(rol, contenido, guardar = true) {
        const div = document.createElement('div');
        div.className = `message ${rol}`;
        div.textContent = contenido;
        chatBox.appendChild(div);
        scrollAbajo();
        if (guardar) {
            mensajes.push({ role: rol, content: contenido });
            sessionStorage.setItem('chatHistorial', JSON.stringify(mensajes));
        }
    }

    function mostrarTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant typing';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatBox.appendChild(div);
        scrollAbajo();
        return div;
    }

    // ═══════════════════════════════════════════════
    // ENVIAR MENSAJE
    // ═══════════════════════════════════════════════
    async function enviarMensaje() {
        const texto = inputMensaje.value.trim();
        if (!texto) return;

        agregarMensaje('user', texto);
        inputMensaje.value = '';
        btnEnviar.disabled = true;
        inputMensaje.disabled = true;

        const typing = mostrarTyping();

        try {
            // 1. Obtener precios de los HTML
            let contextoPrecios = '';
            try {
                const precios = await extraerPreciosDeHTML();
                contextoPrecios = formatearPreciosParaIA(precios);
            } catch (e) {
                contextoPrecios = '';
            }

            // 2. Construir system prompt
            const systemPrompt = construirSystemPrompt(contextoPrecios);

            // 3. Llamar a la IA (local directo / Vercel con backend)
            let respuestaIA = '';

            if (ES_LOCAL) {
                // Modo local: llamada directa a OpenRouter
                const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENROUTER_KEY}`,
                        'HTTP-Referer': location.origin,
                        'X-Title': 'RecargasGames'
                    },
                    body: JSON.stringify({
                        model: MODELO,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...mensajes.slice(-12)
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                typing.remove();

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('OpenRouter error:', errText);
                    agregarMensaje('assistant', 'Disculpa, tuve un problema. ¿Me repites? O escríbenos por WhatsApp: +58 422-824-2411');
                    return;
                }

                const data = await resp.json();
                respuestaIA = data.choices?.[0]?.message?.content || 'Disculpa, ¿me repites?';

            } else {
                // Modo producción: usar backend de Vercel
                const resp = await fetch('/api/chatbot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemPrompt,
                        mensajes: mensajes.slice(-12)
                    })
                });

                typing.remove();

                if (!resp.ok) {
                    agregarMensaje('assistant', 'Disculpa, tuve un problema. ¿Me repites? O escríbenos por WhatsApp: +58 422-824-2411');
                    return;
                }

                const data = await resp.json();
                respuestaIA = data.respuesta || 'Disculpa, ¿me repites?';
            }

            agregarMensaje('assistant', respuestaIA);

        } catch (error) {
            typing.remove();
            console.error(error);
            agregarMensaje('assistant', 'Ups, algo falló. Intenta otra vez o escríbenos por WhatsApp: +58 422-824-2411');
        } finally {
            btnEnviar.disabled = false;
            inputMensaje.disabled = false;
            inputMensaje.focus();
        }
    }

    // ═══════════════════════════════════════════════
    // PROMPT DEL ASISTENTE
    // ═══════════════════════════════════════════════
    function formatearPreciosParaIA(precios) {
        if (!precios || Object.keys(precios).length === 0) return '';
        let txt = 'LISTA DE PRECIOS REALES (extraída de la tienda):\n\n';
        Object.keys(precios).forEach((juego) => {
            txt += `🎮 ${juego}:\n`;
            precios[juego].forEach((p) => {
                txt += `   - ${p.nombre}: $${p.precio}\n`;
            });
            txt += '\n';
        });
        return txt;
    }

    function construirSystemPrompt(contextoPrecios) {
        return `Eres "Rigo", el asistente virtual de RecargasGames, una tienda venezolana de recargas de juegos y streaming.

PERSONALIDAD:
- Amable, cercano, venezolano, con chispa pero respetuoso.
- Hablas en español siempre.
- NUNCA dices "no entendí", "no sé" o "no puedo ayudarte" sin ofrecer una alternativa útil.
- Si no tienes una respuesta exacta, das tu mejor aproximación o invitas a WhatsApp.
- Respuestas cortas, claras y útiles.

INFORMACIÓN QUE MANEJAS:
- WhatsApp de soporte: +58 422-824-2411 (https://wa.me/584228242411)
- Métodos de pago: Pago Móvil, Binance, Zelle, transferencia.
- Tiempo de entrega: al instante en juegos; streaming manual hasta 30 min.
- Los precios están en dólares (USD).

${contextoPrecios}

REGLAS ESTRICTAS:
1. Da el precio EXACTO de la lista cuando te pregunten por un producto.
2. Nunca inventes precios que no estén en la lista. Si no está, di "no lo tengo a mano pero te lo confirmo por WhatsApp" y da el número.
3. Si preguntan por algo que no sea de la tienda, responde amablemente y redirige al tema de recargas.
4. Si el usuario pregunta algo ambiguo, haz una suposición razonable y responde.
5. Si el cliente quiere comprar o tiene un problema con un pedido, dale el WhatsApp.
6. Nunca menciones que eres una IA ni que usas una API.
7. Usa emojis con moderación (1 o 2 por respuesta).
8. Si el usuario te saluda, saluda de vuelta y pregunta en qué puedes ayudar.

EJEMPLOS:
- "¿Cuánto cuesta Netflix?" → "Netflix lo tenemos desde $X.XX al mes 🎬. ¿Quieres ver todos los planes?"
- "Hola" → "¡Hola! 👋 ¿En qué te ayudo hoy?"
- "No me llegó el pedido" → "Uy, vamos a resolverlo. Escríbenos a wa.me/584228242411 con tu número de pedido. 🙌"
- "¿Hacen descuentos?" → "¡Claro! Escríbenos por WhatsApp al +58 422-824-2411 y te paso las promos del día. 🔥"`;
    }

    // ═══════════════════════════════════════════════
    // EVENTOS
    // ═══════════════════════════════════════════════
    btnEnviar.addEventListener('click', enviarMensaje);
    inputMensaje.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensaje(); });

    sugerencias.addEventListener('click', (e) => {
        const chip = e.target.closest('.sug-chip');
        if (!chip) return;
        inputMensaje.value = chip.dataset.msg;
        enviarMensaje();
    });

    // ═══════════════════════════════════════════════
    // ARRANQUE
    // ═══════════════════════════════════════════════
    if (mensajes.length === 0) {
        agregarMensaje('assistant',
            '¡Hola! 👋 Soy Rigo, tu asistente. Pregúntame por precios de juegos, streaming, o cómo recargar. 🎮',
            true
        );
    } else {
        mensajes.forEach((m) => {
            const div = document.createElement('div');
            div.className = `message ${m.role}`;
            div.textContent = m.content;
            chatBox.appendChild(div);
        });
        scrollAbajo();
    }

    // Precargar precios en segundo plano
    extraerPreciosDeHTML().catch(() => {});
</script>

</body>
</html>
