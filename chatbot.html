<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte RecargasGames</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0e1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .chat-header {
            background: linear-gradient(135deg, #10a37f, #0d8a6b);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        /* 🆕 Avatar circular con tu logo */
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .chat-header h3 { font-size: 15px; font-weight: 700; }
        .chat-header p { font-size: 11px; opacity: 0.85; }

        .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

        .message {
            max-width: 88%;
            padding: 11px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user { align-self: flex-end; background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #1e2a45; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .sistema {
            align-self: center;
            background: rgba(16, 163, 127, 0.15);
            border: 1px solid rgba(16, 163, 127, 0.4);
            color: #4ade80;
            font-size: 12px;
            text-align: center;
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 90%;
        }

        .input-area {
            display: flex; gap: 8px; padding: 12px;
            background: #0d1627; border-top: 1px solid rgba(30, 42, 69, 0.8); flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 11px 14px; border-radius: 22px;
            border: 1px solid rgba(30, 42, 69, 0.9);
            background: #060c20; color: #fff; font-size: 14px; outline: none; font-family: inherit;
        }
        .input-area input:focus { border-color: #10a37f; }
        .input-area button {
            width: 44px; height: 44px; border-radius: 50%;
            border: none; background: #10a37f; color: #fff; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .input-area button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-header">
    <!-- 🆕 Burbujita con el logo.png -->
    <div class="avatar">
        <img src="logo.png" alt="RecargasGames">
    </div>
    <div>
        <h3>Soporte RecargasGames</h3>
        <p>Cuéntanos tu duda o problema</p>
    </div>
</div>

<div class="chat-box" id="chatBox">
    <div class="message assistant">
        ¡Hola! 👋 Soy el equipo de soporte de RecargasGames.
        Escríbenos tu duda, problema o pedido y te responderemos lo antes posible.
    </div>
    <div class="sistema">
        💬 Tu mensaje llegará directamente a nuestro equipo
    </div>
</div>

<div class="input-area">
    <input type="text" id="inputMensaje" placeholder="Escribe tu mensaje..." autocomplete="off">
    <button id="btnEnviar" aria-label="Enviar">➤</button>
</div>

<script>
    // ═══════════════════════════════════════════════
    // FIREBASE
    // ═══════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // ═══════════════════════════════════════════════
    // UI
    // ═══════════════════════════════════════════════
    const chatBox = document.getElementById('chatBox');
    const inputMensaje = document.getElementById('inputMensaje');
    const btnEnviar = document.getElementById('btnEnviar');

    let usuarioActual = null;
    let nombreUsuario = 'Cliente';

    auth.onAuthStateChanged((user) => {
        if (user) {
            usuarioActual = user.uid;
            nombreUsuario = user.displayName || user.email || 'Cliente';
        }
    });

    function scrollAbajo() { chatBox.scrollTop = chatBox.scrollHeight; }

    function agregarMensaje(rol, contenido) {
        const div = document.createElement('div');
        div.className = `message ${rol}`;
        div.textContent = contenido;
        chatBox.appendChild(div);
        scrollAbajo();
    }

    function agregarSistema(contenido) {
        const div = document.createElement('div');
        div.className = 'sistema';
        div.textContent = contenido;
        chatBox.appendChild(div);
        scrollAbajo();
    }

    // ═══════════════════════════════════════════════
    // ENVIAR MENSAJE
    // ═══════════════════════════════════════════════
    async function enviarMensaje() {
        const texto = inputMensaje.value.trim();
        if (!texto) return;

        agregarMensaje('user', texto);
        inputMensaje.value = '';
        btnEnviar.disabled = true;
        inputMensaje.disabled = true;

        try {
            const nuevoMensaje = {
                mensaje: texto,
                uid: usuarioActual || 'anonimo',
                nombre: nombreUsuario,
                fecha: new Date().toISOString(),
                estado: 'nuevo',
                origen: 'chatbot'
            };

            await db.ref('mensajes_soporte').push(nuevoMensaje);

            agregarSistema('✅ Mensaje enviado. Nuestro equipo te responderá pronto.');

            setTimeout(() => {
                agregarMensaje('assistant',
                    'Mientras tanto, también puedes escribirnos directo por WhatsApp: +58 422-824-2411 💬');
            }, 800);

        } catch (error) {
            console.error('Error:', error);
            agregarMensaje('assistant',
                '⚠️ No pudimos enviar tu mensaje. Intenta de nuevo o escríbenos por WhatsApp: +58 422-824-2411');
        } finally {
            btnEnviar.disabled = false;
            inputMensaje.disabled = false;
            inputMensaje.focus();
        }
    }

    // ═══════════════════════════════════════════════
    // EVENTOS
    // ═══════════════════════════════════════════════
    btnEnviar.addEventListener('click', enviarMensaje);
    inputMensaje.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enviarMensaje();
    });
</script>

</body>
</html>
