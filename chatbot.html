<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0e1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #10a37f, #0d8a6b);
            padding: 14px 18px;
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .chat-header h3 { font-size: 15px; font-weight: 700; }
        .chat-header p { font-size: 11px; opacity: 0.85; }

        .chat-box {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 85%; padding: 11px 14px;
            border-radius: 14px; font-size: 14px;
            line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
        }
        .user { align-self: flex-end; background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #1e2a45; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .typing { display: flex; gap: 4px; padding: 14px 18px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: #94a3b8; animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        .input-area {
            display: flex; gap: 8px; padding: 12px;
            background: #0d1627;
            border-top: 1px solid rgba(30, 42, 69, 0.8);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 11px 14px; border-radius: 22px;
            border: 1px solid rgba(30, 42, 69, 0.9);
            background: #060c20; color: #fff; font-size: 14px;
            outline: none; font-family: inherit;
        }
        .input-area input:focus { border-color: #10a37f; }
        .input-area button {
            width: 44px; height: 44px; border-radius: 50%;
            border: none; background: #10a37f; color: #fff;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .input-area button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-header">
    <div class="avatar">🤖</div>
    <div>
        <h3>Asistente RecargasGames</h3>
        <p>En línea</p>
    </div>
</div>

<div class="chat-box" id="chatBox">
    <div class="message assistant">¡Hola! 👋 Pregúntame por precios de juegos o streaming.</div>
</div>

<div class="input-area">
    <input type="text" id="inputMensaje" placeholder="Escribe tu pregunta..." autocomplete="off">
    <button id="btnEnviar" aria-label="Enviar">➤</button>
</div>

<script>
    const API_URL = '/api/chatbot';

    const chatBox = document.getElementById('chatBox');
    const inputMensaje = document.getElementById('inputMensaje');
    const btnEnviar = document.getElementById('btnEnviar');
    let mensajes = [];

    async function enviarMensaje() {
        const texto = inputMensaje.value.trim();
        if (!texto) return;

        agregarMensaje('user', texto);
        mensajes.push({ role: 'user', content: texto });
        inputMensaje.value = '';

        btnEnviar.disabled = true;
        inputMensaje.disabled = true;
        const typing = mostrarTyping();

        try {
            const r = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensajes })
            });

            typing.remove();

            if (!r.ok) {
                agregarMensaje('assistant', '⚠️ Ups, hubo un error. Intenta de nuevo.');
                return;
            }

            const data = await r.json();
            const respuesta = data.respuesta || 'Sin respuesta';
            agregarMensaje('assistant', respuesta);
            mensajes.push({ role: 'assistant', content: respuesta });

        } catch (error) {
            typing.remove();
            console.error(error);
            agregarMensaje('assistant', '⚠️ Sin conexión. Intenta más tarde.');
        } finally {
            btnEnviar.disabled = false;
            inputMensaje.disabled = false;
            inputMensaje.focus();
        }
    }

    function agregarMensaje(rol, contenido) {
        const div = document.createElement('div');
        div.className = `message ${rol}`;
        div.textContent = contenido;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function mostrarTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant typing';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    btnEnviar.addEventListener('click', enviarMensaje);
    inputMensaje.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensaje(); });
</script>

</body>
</html>
