<script type="module">
    const CONFIG = {
        parBinance: "USDTVES",
        urlBinance: "https://api.binance.com/api/v3/ticker/price?symbol=",
        tasaRespaldo: 930,
        actualizarCada: 60000
    };

    let tasaActual = null;

    async function cargarTasaBinance() {
        try {
            const respuesta = await fetch(CONFIG.urlBinance + CONFIG.parBinance, {
                method: 'GET',
                cache: 'no-cache'
            });
            if (!respuesta.ok) throw new Error("Error en la API");
            const datos = await respuesta.json();
            const precio = parseFloat(datos.price);
            if (!precio || precio <= 0) throw new Error("Precio inválido");
            tasaActual = Math.round(precio);
            localStorage.setItem('tasa_usd_ves', tasaActual);
            window.dispatchEvent(new CustomEvent('tasaActualizada', { detail: tasaActual }));
        } catch (error) {
            console.warn("Usando tasa de respaldo:", error);
            tasaActual = localStorage.getItem('tasa_usd_ves') ? parseFloat(localStorage.getItem('tasa_usd_ves')) : CONFIG.tasaRespaldo;
            localStorage.setItem('tasa_usd_ves', tasaActual);
        }
    }

    cargarTasaBinance();
    setInterval(cargarTasaBinance, CONFIG.actualizarCada);

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {

        deferredPrompt.prompt();
