<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECARGAS GAMES — Asistente IA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        :root{--azul:#3b82f6;--fondo:#0f172a;--tarjeta:#1e293b;--texto:#f1f5f9;--borde:#334155}
        body{background:var(--fondo);color:var(--texto);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}
        .contenedor{width:100%;max-width:550px}
        h1{text-align:center;margin-bottom:20px;color:var(--azul);font-size:1.4rem}
        .chat{background:var(--tarjeta);border-radius:16px;padding:20px;height:450px;overflow-y:auto;margin-bottom:15px;border:1px solid var(--borde)}
        .mensaje{margin-bottom:12px;padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.5}
        .cliente{background:var(--azul);margin-left:auto;border-bottom-right-radius:4px}
        .ia{background:#475569;margin-right:auto;border-bottom-left-radius:4px;white-space:pre-wrap}
        .entrada{display:flex;gap:10px;margin-top:15px}
        input{flex:1;padding:14px;border-radius:10px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);font-size:1rem}
        button{padding:14px 24px;background:var(--azul);border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
        button:hover{background:#2563eb}
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>🤖 RECARGAS GAMES — Asistente IA</h1>
        
        <div class="chat" id="chat">
            <div class="mensaje ia">¡Hola! 👋 Soy el asistente de Recargas Games. Pregúntame sobre precios, productos o cómo comprar 😊</div>
        </div>

        <div class="entrada">
            <input type="text" id="pregunta" placeholder="Ej: ¿cuánto cuesta Netflix?">
            <button onclick="enviar()">Enviar</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const pregunta = document.getElementById('pregunta');

        function responder(texto) {
            const t = texto.toLowerCase();
            
            if(/hola|buenas/.test(t)) return "¡Hola! 👋 Bienvenido 😊\nPregúntame por:\n• Netflix / Disney+\n• Free Fire / Roblox\n• Precios / Pagos";
            
            if(/netflix/.test(t)) return "🎬 NETFLIX:\n✅ 1 Pantalla → 3.8$ / 3.500 Bs\n✅ Completa → 13$ / 12.500 Bs\n\n🌐 recargasgames.shop";
            
            if(/disney/.test(t)) return "🎬 DISNEY+:\n✅ 1 Pantalla → 3.5$ / 3.500 Bs\n✅ Completa → 9$ / 12.500 Bs\n\n🌐 recargasgames.shop";
            
            if(/free fire|diamantes/.test(t)) return "🔥 FREE FIRE:\n✅ Desde 770 Bs\n✅ Paquetes de 110 hasta 6160+ diamantes\n\n🌐 recargasgames.shop";
            
            if(/pago|datos/.test(t)) return "💳 PAGO MÓVIL:\nBco Venezuela 0102\nC.I.: 32824869\nTel: 04228242411\n✅ También Binance / USDT\n\n📲 Envía comprobante por WhatsApp";
            
            if(/precio|lista/.test(t)) return "📦 TODOS LOS PRECIOS:\nNetflix 1P → 3.8$ / 3.500 Bs\nNetflix Completa → 13$ / 12.500 Bs\nDisney+ 1P → 3.5$ / 3.500 Bs\nDisney+ Completa → 9$ / 12.500 Bs\nFree Fire → desde 770 Bs\nRoblox → desde 3.5$\n\n🌐 recargasgames.shop";
            
            return "No entendí 😅 Pregúntame por Netflix, Disney+, Free Fire, Roblox o precios";
        }

        function enviar() {
            const texto = pregunta.value.trim();
            if(!texto) return;
            
            agregarMensaje(texto, 'cliente');
            pregunta.value = '';
            
            setTimeout(() => {
                agregarMensaje(responder(texto), 'ia');
            }, 300);
        }

        function agregarMensaje(texto, tipo) {
            const div = document.createElement('div');
            div.className = `mensaje ${tipo}`;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        pregunta.addEventListener('keydown', e => e.key === 'Enter' && enviar());
    </script>
</body>
</html>
