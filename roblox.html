<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="3A5udHt-1flbfBdKc7UC2d_KGz2yKlwOSfjRovfdPaY" />
<title>RECARGASGAMES - Roblox</title>
<style>
:root{
    --color-principal:#3b82f6; /* 🔵 TODO EN AZUL */
    --color-hover:#2563eb;
    --color-azul:#3b82f6;
    --color-blanco:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    background-image:url('fondo.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    padding-top:110px;
}

/* 🔒 BARRA FIJA — SOLO LOGO, SIN NOMBRE, SIN BOTONES */
.barra-superior{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:999;
    background:rgba(11,18,32,.95);
    border-bottom:2px solid var(--color-azul);
    box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.header{
    padding:12px 20px;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    border-bottom:1px solid #2a374f; /* ✅ LÍNEA EN MEDIO RELLENA */
    margin-bottom:0;
}
.brand{display:flex;align-items:center}
.brand img{
    height:55px;
    width:auto;
    border-radius:14px;
    background:transparent;
}
/* ❌ SIN TEXTO, SIN BOTONES DE PERFIL */

/* MENÚ — SIN BRAWL STARS, SIN BARRA DE SCROLL */
.games-menu{
    display:flex;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:12px 15px;
    border-top:none;
    border-bottom:none;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}
.games-menu::-webkit-scrollbar{display:none;width:0;height:0}
.games-menu a{
    text-decoration:none;
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    transition:.2s;
}
.games-menu a:hover,.games-menu a.active{
    color:var(--color-azul);
    border-bottom:2px solid var(--color-azul);
    border-radius:0;
}

/* CONTENIDO — TARJETA BAJITA Y SEPARADITA */
.main{
    padding:20px;
    padding-top:30px; /* ✅ SEPARADITA como 1cm del menú */
    max-width:800px;
    margin:0 auto;
}
.card-panel{
    background:rgba(11,18,32,.85);
    border:1px solid #1f2937;
    border-radius:20px;
    padding:18px;
    margin-bottom:20px;
}
.panel-title{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--color-azul)}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:8px;color:#9ca3af;font-size:13px}
.form-input{
    width:100%;height:50px;
    border-radius:14px;
    background:#111827;
    color:#fff;
    padding:12px;
    border:1px solid #1f2937;
    font-size:16px;
}
.form-input:focus{outline:none;border-color:var(--color-azul)}
.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.pay-box{
    background:#111827;
    border:2px solid #1f2937;
    border-radius:16px;
    padding:12px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
}
.pay-box.active{border-color:var(--color-azul);background:#1e293b;color:var(--color-azul)}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px}
.product-card{
    background:rgba(11,18,32,.85);
    border:1px solid #1f2937;
    border-radius:16px;
    padding:15px;
    transition:.2s;
}
.product-card:hover{border-color:var(--color-azul);transform:translateY(-2px)}
.card-header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #1f2937;padding-bottom:10px;margin-bottom:10px}
.game-icon{background:#1a2333;padding:8px;border-radius:12px;font-size:18px}
.product-title{font-size:16px;font-weight:700}
.product-desc{color:#9ca3af;font-size:11px;margin-bottom:10px}
.product-price{font-size:22px;font-weight:700;color:var(--color-azul);margin-bottom:12px}
.btn-buy{
    background:var(--color-azul); /* 🔵 BOTÓN AZUL */
    color:#fff;
    border:none;
    width:100%;height:40px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}
.btn-buy:hover{background:var(--color-hover)}
.section-divider{margin:25px 0 15px;text-align:center}
.section-divider span{
    background:var(--color-azul); /* 🔵 ETIQUETA AZUL */
    color:#fff;
    padding:6px 18px;
    border-radius:30px;
    font-size:14px;
    font-weight:700;
}
.status-success{color:#22c55e;background:rgba(34,197,94,.1);padding:8px 12px;border-radius:10px;display:inline-block;width:100%;text-align:center}
.status-error{color:#ef4444;background:rgba(239,68,68,.1);padding:8px 12px;border-radius:10px;display:inline-block;width:100%;text-align:center}
.status-warning{color:#f59e0b;background:rgba(245,158,11,.1);padding:8px 12px;border-radius:10px;display:inline-block;width:100%;text-align:center}
.whatsapp-float{
    position:fixed;bottom:20px;right:20px;
    background:#25D366;
    width:55px;height:55px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:28px;z-index:1000;
}
.back-to-top{
    position:fixed;bottom:90px;right:20px;
    background:var(--color-azul);
    color:#fff;
    width:45px;height:45px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;visibility:hidden;
    z-index:1000;transition:.3s;text-decoration:none;
}
.back-to-top.show{opacity:1;visibility:visible}
@media(min-width:550px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){
    body{padding-top:100px}
    .main{padding-top:25px}
    .brand img{height:45px}
    .header{padding:10px 16px}
    .games-menu{padding:10px 12px}
}
</style>
</head>
<body>

<!-- 🔒 BARRA FIJA — SOLO LOGO, SIN NOMBRE, SIN BOTONES, SIN BRAWL STARS -->
<div class="barra-superior">
    <div class="header">
        <div class="brand"><img src="logo.png" alt="Logo"></div>
    </div>
    <div class="games-menu">
        <a href="index.html">Inicio</a>
        <a href="freefire.html">Free Fire</a>
        <a href="bloodstrike.html">Blood Strike</a>
        <a href="roblox.html" class="active">Roblox</a>
        <a href="ml.html">Mobile Legends</a>
        <a href="cod.html">COD Mobile</a>
        <a href="pubg.html">PUBG Mobile</a>
    </div>
</div>

<div class="main">
    <!-- ✅ TARJETA BAJITA Y SEPARADITA -->
    <div class="card-panel">
        <div class="panel-title">Datos para la Recarga</div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" class="form-input" id="robloxEmail" placeholder="ejemplo@correo.com">
        </div>
        <div class="form-group">
            <label>Número de WhatsApp</label>
            <input type="tel" class="form-input" id="robloxWhatsapp" placeholder="Ej: 04121234567">
        </div>
        <div id="verificacionStatus" style="margin-top:8px"></div>
    </div>

    <div class="card-panel">
        <div class="panel-title">Método de Pago</div>
        <div class="payment-methods">
            <div class="pay-box active" onclick="seleccionarPago('PAGO MOVIL', this)">PAGO MOVIL</div>
            <div class="pay-box" onclick="seleccionarPago('BINANCE', this)">BINANCE</div>
        </div>
    </div>
    
    <div class="section-divider"><span>💰 ROBUX DISPONIBLES</span></div>
    <div class="products-grid">
        <div class="product-card">
            <div class="card-header"><div class="game-icon">💰</div><div class="product-title">400 Robux</div></div>
            <div class="product-desc">Carga directa a la cuenta</div>
            <div class="product-price" data-usd="4.99">$4.99</div>
            <button class="btn-buy" data-robux="400" onclick="comprarProducto('400 Robux', '4.99')">Comprar</button>
        </div>
        <div class="product-card">
            <div class="card-header"><div class="game-icon">💰</div><div class="product-title">800 Robux</div></div>
            <div class="product-desc">Carga directa a la cuenta</div>
            <div class="product-price" data-usd="9.99">$9.99</div>
            <button class="btn-buy" data-robux="800" onclick="comprarProducto('800 Robux', '9.99')">Comprar</button>
        </div>
        <div class="product-card">
            <div class="card-header"><div class="game-icon">💰</div><div class="product-title">2000 Robux</div></div>
            <div class="product-desc">Carga directa a la cuenta</div>
            <div class="product-price" data-usd="24.99">$24.99</div>
            <button class="btn-buy" data-robux="2000" onclick="comprarProducto('2000 Robux', '24.99')">Comprar</button>
        </div>
    </div>
</div>

<div class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
<a href="https://wa.me/584228242411?text=Hola%2C%20necesito%20ayuda%20con%20una%20recarga" class="whatsapp-float" target="_blank">💬</a>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,push,set}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const fbConfig={
    apiKey:"AIzaSyDyo-HiGfO0IcRret7AgHj4dlU4j0PVlq0",
    authDomain:"recargasgames-14c38.firebaseapp.com",
    databaseURL:"https://recargasgames-14c38-default-rtdb.firebaseio.com",
    projectId:"recargasgames-14c38",
    storageBucket:"recargasgames-14c38.firebasestorage.app",
    messagingSenderId:"370952235234",
    appId:"1:370952235234:web:41a9ebd7084f1955a256bb"
};
const app=initializeApp(fbConfig),auth=getAuth(app),db=getDatabase(app);

let logueado=false,metodo="PAGO MOVIL",tasa=930,uidActual=null;
let emailOk = false, whatsappOk = false;
const juegoActual = "ROBLOX";

async function cargarTasaBinance() {
    try {
        const respuesta = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTVES", { method: 'GET', cache: 'no-cache' });
        if (!respuesta.ok) throw new Error("Error API");
        const datos = await respuesta.json();
        const precio = parseFloat(datos.price);
        if (!precio || precio <= 0) throw new Error("Precio inválido");
        tasa = Math.round(precio);
        localStorage.setItem('tasa_usd_ves', tasa);
        actualizarPrecios();
    } catch (error) {
        tasa = localStorage.getItem('tasa_usd_ves') ? parseFloat(localStorage.getItem('tasa_usd_ves')) : 930;
        actualizarPrecios();
    }
}

function actualizarPrecios(){
    document.querySelectorAll('.product-price').forEach(el=>{
        let u=parseFloat(el.dataset.usd);
        el.innerText = metodo==="PAGO MOVIL" ? Math.round(u*tasa).toLocaleString("es-VE")+" Bs" : u.toFixed(2)+" USDT";
    });
}

window.seleccionarPago=function(m,e){
    document.querySelectorAll('.pay-box').forEach(b=>b.classList.remove('active'));
    e.classList.add('active');
    metodo=m;
    actualizarPrecios();
};

function validarEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
function validarWhatsapp(whatsapp){ return /^\d{10,12}$/.test(whatsapp); }

let timeoutId = null;
const emailInput = document.getElementById("robloxEmail");
const whatsappInput = document.getElementById("robloxWhatsapp");
const statusDiv = document.getElementById("verificacionStatus");

function mostrarEstado(mensaje, tipo) {
    if(!statusDiv) return;
    let clase = "";
    if(tipo === "success") clase = "status-success";
    if(tipo === "error") clase = "status-error";
    if(tipo === "warning") clase = "status-warning";
    statusDiv.innerHTML = clase ? `<div class="${clase}">${mensaje}</div>` : "";
}

function verificarCampos(){
    const email = emailInput.value.trim();
    const whatsapp = whatsappInput.value.trim();
    if(!email && !whatsapp) { mostrarEstado(""); emailOk = false; whatsappOk = false; return; }
    if(!email) { mostrarEstado("Ingresa tu correo", "error"); emailOk = false; return; }
    if(!whatsapp) { mostrarEstado("Ingresa tu WhatsApp", "error"); whatsappOk = false; return; }
    if(!validarEmail(email)) { mostrarEstado("Correo inválido", "error"); emailOk = false; return; }
    if(!validarWhatsapp(whatsapp)) { mostrarEstado("WhatsApp inválido (10-12 dígitos)", "error"); whatsappOk = false; return; }
    mostrarEstado("Datos válidos ✅", "success");
    emailOk = true; whatsappOk = true;
}

emailInput.addEventListener("input", ()=>{ clearTimeout(timeoutId); timeoutId = setTimeout(verificarCampos, 300); });
whatsappInput.addEventListener("input", ()=>{ clearTimeout(timeoutId); timeoutId = setTimeout(verificarCampos, 300); });

window.comprarProducto = function(producto, precioUsd){
    const email = emailInput.value.trim();
    const whatsapp = whatsappInput.value.trim();
    
    if(!email){ alert("❌ Ingresa tu correo electrónico"); return; }
    if(!whatsapp){ alert("❌ Ingresa tu número de WhatsApp"); return; }
    if(!emailOk || !whatsappOk){ alert("⏳ Verifica tus datos antes de comprar"); return; }

    const precioBs = Math.round(parseFloat(precioUsd) * tasa);
    const robux = event.target.dataset.robux || 0;

    localStorage.setItem('correo', email);
    localStorage.setItem('whatsapp', whatsapp);
    localStorage.setItem('robux', robux);
    localStorage.setItem('juego_seleccionado', juegoActual);
    localStorage.setItem('producto_seleccionado', producto);
    localStorage.setItem('precio_usd', precioUsd);
    localStorage.setItem('precio_en_bs', precioBs);
    localStorage.setItem('metodo_pago', metodo);

    window.location.href = "pasarela.html";
};

onAuthStateChanged(auth,u=>{logueado=!!u; if(u)uidActual=u.uid;});
cargarTasaBinance();
setInterval(cargarTasaBinance, 60000);

window.addEventListener('scroll',()=>{
    const b=document.getElementById('backToTop');
    if(window.scrollY>300)b.classList.add('show');else b.classList.remove('show');
});
</script>
</body>
</html>
