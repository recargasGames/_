<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - RECARGASGAMES</title>
    <style>
        body { 
            background-image: url('fondo.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .register-box { 
            background: rgba(11, 18, 32, 0.95); 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid #dc2626; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            backdrop-filter: blur(10px);
        }
        h2 { color: #dc2626; margin-bottom: 20px; }
        .input-group { margin: 12px 0; }
        input { 
            width: 100%; 
            height: 48px; 
            border-radius: 12px; 
            border: 1px solid #1f2937; 
            background: #0b1220; 
            color: white; 
            padding: 12px;
            box-sizing: border-box; 
            font-size: 14px; 
            text-align: center;
        }
        input:focus { outline: none; border-color: #dc2626; }
        button { 
            width: 100%; 
            height: 48px; 
            background: #dc2626; 
            color: white; 
            border: none;
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: #b91c1c; }
        a { color: #60a5fa; text-decoration: none; display: block; margin-top: 15px; font-size: 14px; }
        a:hover { text-decoration: underline; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
        .success-msg { color: #10b981; font-size: 13px; margin-top: 10px; display: none; }
        .logo { margin-bottom: 20px; }
        .logo img { height: 50px; width: auto; }
        .info-text { font-size: 11px; color: #64748b; margin-top: 10px; text-align: center; }
        .info-text a { color: #10b981; display: inline; margin: 0; }
    </style>
</head>
<body>

<div class="register-box">
    <div class="logo"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"></div>
    <h2>📝 Crear Cuenta</h2>
    
    <form id="registerForm">
        <div class="input-group">
            <input type="text" id="nombre" placeholder="Nombre completo" autocomplete="name" required>
        </div>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email" required>
        </div>
        
        <div class="input-group">
            <input type="tel" id="telefono" placeholder="WhatsApp (ej: 04241234567)" autocomplete="tel">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password" required>
        </div>
        
        <button type="submit">Registrarme</button>
    </form>
    
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    
    <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    <div class="info-text">💡 Agrega tu WhatsApp para recibir notificaciones de tus pedidos</div>
</div>

<!-- === LIBRERÍA DE SUPABASE === -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ================== TUS DATOS — YA CONFIGURADOS ==================
const SUPABASE_URL = "https://fbjutmjclfxbcciiuqxr.supabase.co";
const SUPABASE_KEY = "sb_publishable_-eyCjY3CZfVt-83D7K4JZw_gX0-Fac3";
// ===================================================================

// Inicializar Supabase
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("registerForm");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    errorMsg.style.display = "none";
    successMsg.style.display = "none";
    
    const nombre = document.getElementById("nombre").value.trim();
    const email = document.getElementById("email").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    
    // Validaciones
    if (!nombre || !email || !password || !confirmPassword) {
        errorMsg.textContent = "❌ Completa todos los campos obligatorios";
        errorMsg.style.display = "block";
        return;
    }
    
    if (password !== confirmPassword) {
        errorMsg.textContent = "❌ Las contraseñas no coinciden";
        errorMsg.style.display = "block";
        return;
    }
    
    if (password.length < 6) {
        errorMsg.textContent = "❌ La contraseña debe tener al menos 6 caracteres";
        errorMsg.style.display = "block";
        return;
    }
    
    const btn = document.querySelector("button[type='submit']");
    btn.textContent = "Registrando...";
    btn.disabled = true;
    
    try {
        // 📝 REGISTRAR USUARIO
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    nombre: nombre,
                    telefono: telefono
                }
            }
        });
        
        if (error) throw error;
        
        // ✅ ÉXITO
        successMsg.textContent = "✅ Cuenta creada exitosamente. Revisa tu correo para confirmar.";
        successMsg.style.display = "block";
        
        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);
        
    } catch (error) {
        // ❌ ERRORES
        const msg = error.message || "";
        if (msg.includes("User already registered") || msg.includes("email-already-in-use")) {
            errorMsg.textContent = "❌ Este correo ya está registrado";
        } else if (msg.includes("Password should be at least 6 characters")) {
            errorMsg.textContent = "❌ Contraseña demasiado débil (mínimo 6 caracteres)";
        } else if (msg.includes("invalid email")) {
            errorMsg.textContent = "❌ Correo electrónico inválido";
        } else {
            errorMsg.textContent = "❌ Error: " + error.message;
        }
        errorMsg.style.display = "block";
        btn.textContent = "Registrarme";
        btn.disabled = false;
    }
});
</script>
</body>
</html>
