<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - RECARGASGAMES</title>
    <style>
        body { 
            background-image: url('fondo.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .register-box { 
            background: rgba(11, 18, 32, 0.95); 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid #dc2626; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            backdrop-filter: blur(10px);
        }
        h2 { color: #dc2626; margin-bottom: 20px; }
        
        .input-group {
            margin: 12px 0;
        }
        input { 
            width: 100%; 
            height: 48px; 
            border-radius: 12px; 
            border: 1px solid #1f2937; 
            background: #0b1220; 
            color: white; 
            padding: 12px;
            box-sizing: border-box; 
            font-size: 14px; 
            text-align: center;
        }
        input:focus { 
            outline: none; 
            border-color: #dc2626; 
        }
        
        button { 
            width: 100%; 
            height: 48px; 
            background: #dc2626; 
            color: white; 
            border: none;
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: #b91c1c; }
        
        a { 
            color: #60a5fa; 
            text-decoration: none; 
            display: block; 
            margin-top: 15px; 
            font-size: 14px; 
        }
        a:hover { text-decoration: underline; }
        
        .error-msg { 
            color: #ef4444; 
            font-size: 13px; 
            margin-top: 10px; 
            display: none; 
        }
        
        .logo { margin-bottom: 20px; }
        .logo img { height: 50px; width: auto; }
    </style>
</head>
<body>

<div class="register-box">
    <div class="logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>
    <h2>📝 Crear Cuenta</h2>
    
    <form id="registerForm">
        <div class="input-group">
            <input type="text" id="nombre" placeholder="Nombre completo" autocomplete="name" required>
        </div>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" required>
        </div>
        
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password" required>
        </div>
        
        <button type="submit">Registrarme</button>
    </form>
    
    <div id="errorMsg" class="error-msg"></div>
    
    <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
</div>

<script type="module" src="register.js"></script>

</body>
</html>
