<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Recargas Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b1220, #1a1a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            background: rgba(17, 24, 39, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #3b82f6;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            height: 60px;
        }
        .logo h1 {
            color: white;
            font-size: 24px;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: #9ca3af;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-register:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
        }
        .login-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .success-message {
            color: #22c55e;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .password-requirements {
            color: #6b7280;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <img src="logo.png" alt="Recargas Games">
            <h1>Crear Cuenta</h1>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>👤 Nombre completo</label>
                <input type="text" id="fullName" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label>📧 Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>🔑 Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                <div class="password-requirements">* La contraseña debe tener al menos 6 caracteres</div>
            </div>

            <div class="form-group">
                <label>✅ Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">Registrarse</button>
        </form>

        <div id="message"></div>

        <div class="login-link">
            ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');

            // Validaciones
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<div class="error-message">❌ Las contraseñas no coinciden</div>';
                return;
            }

            if (password.length < 6) {
                messageDiv.innerHTML = '<div class="error-message">❌ La contraseña debe tener al menos 6 caracteres</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Registrando...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Actualizar nombre de usuario
                await updateProfile(user, {
                    displayName: fullName
                });

                messageDiv.innerHTML = '<div class="success-message">✅ ¡Cuenta creada exitosamente! Redirigiendo...</div>';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                let errorMsg = '❌ Error al registrarse: ';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMsg += 'Este correo ya está registrado';
                        break;
                    case 'auth/invalid-email':
                        errorMsg += 'Correo electrónico inválido';
                        break;
                    case 'auth/weak-password':
                        errorMsg += 'La contraseña es muy débil';
                        break;
                    default:
                        errorMsg += error.message;
                }
                messageDiv.innerHTML = `<div class="error-message">${errorMsg}</div>`;
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
