<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<style>
body{background:#030712;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;color:white;}
.card{background:#0b1220;padding:30px;border-radius:20px;width:90%;max-width:400px;border:1px solid #1f2937;}
h2{text-align:center;margin-bottom:20px;}
input{width:100%;height:50px;margin-bottom:15px;border:none;border-radius:12px;padding:15px;background:#111827;color:white;box-sizing:border-box;}
button{width:100%;height:50px;border:none;border-radius:12px;background:#2563eb;color:white;font-size:18px;font-weight:bold;cursor:pointer;}
a{color:#60a5fa;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
<h2>Crear Cuenta</h2>
<form id="registerForm">
<input type="email" id="email" placeholder="Correo electrónico" required>
<input type="password" id="password" placeholder="Contraseña" required>
<button type="submit">Registrarme</button>
</form>
<p style="text-align:center;margin-top:15px;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div>
<script type="module" src="scripts/register.js"></script>
</body>
</html>
