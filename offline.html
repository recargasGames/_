<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin Conexión - RecargasGames</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:radial-gradient(ellipse at top, #0f1629 0%, #050810 60%, #000000 100%);
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}
.box{
    background:linear-gradient(135deg,rgba(20,30,55,0.75),rgba(10,14,26,0.92));
    border:1px solid rgba(212,175,55,0.3);
    border-radius:24px;
    padding:40px 30px;
    max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.icono{
    font-size:70px;
    margin-bottom:20px;
    animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}
h1{
    font-size:24px;
    font-weight:800;
    margin-bottom:12px;
    background:linear-gradient(135deg,#fff,#f5d76e);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
p{
    color:#cbd5e1;
    font-size:15px;
    line-height:1.6;
    margin-bottom:24px;
}
.btn{
    display:inline-block;
    background:linear-gradient(135deg,#d4af37,#f5d76e,#d4af37);
    color:#0a0e1a;
    padding:14px 32px;
    border-radius:12px;
    text-decoration:none;
    font-weight:800;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    border:none;
    cursor:pointer;
    transition:all 0.3s;
    box-shadow:0 4px 15px rgba(212,175,55,0.4);
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(212,175,55,0.6);
}
</style>
</head>
<body>
<div class="box">
    <div class="icono">📡</div>
    <h1>Sin Conexión</h1>
    <p>Parece que no tienes internet en este momento.<br>Verifica tu conexión e intenta de nuevo.</p>
    <button class="btn" onclick="location.reload()">🔄 Reintentar</button>
</div>
</body>
</html>
