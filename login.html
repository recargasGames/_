<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Recargas Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b1220, #1a1a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(17, 24, 39, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #3b82f6;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            height: 60px;
        }
        .logo h1 {
            color: white;
            font-size: 24px;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: #9ca3af;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
        }
        .register-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .success-message {
            color: #22c55e;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .reset-password {
            text-align: center;
            margin-top: 15px;
        }
        .reset-password a {
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
        .reset-password a:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="logo.png" alt="Recargas Games">
            <h1>Iniciar Sesión</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>🔑 Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Ingresar</button>
        </form>

        <div id="message"></div>

        <div class="register-link">
            ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </div>
        <div class="reset-password">
            <a href="#" id="resetPassword">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.textContent = 'Iniciando sesión...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                messageDiv.innerHTML = '<div class="success-message">✅ ¡Bienvenido! Redirigiendo...</div>';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                let errorMsg = '❌ Error al iniciar sesión: ';
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMsg += 'Usuario no encontrado';
                        break;
                    case 'auth/wrong-password':
                        errorMsg += 'Contraseña incorrecta';
                        break;
                    case 'auth/invalid-email':
                        errorMsg += 'Correo electrónico inválido';
                        break;
                    case 'auth/too-many-requests':
                        errorMsg += 'Demasiados intentos. Intenta más tarde';
                        break;
                    default:
                        errorMsg += error.message;
                }
                messageDiv.innerHTML = `<div class="error-message">${errorMsg}</div>`;
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });

        // Restablecer contraseña
        document.getElementById('resetPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                messageDiv.innerHTML = '<div class="error-message">❌ Ingresa tu correo para restablecer la contraseña</div>';
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                messageDiv.innerHTML = '<div class="success-message">✅ Correo de restablecimiento enviado. Revisa tu bandeja de entrada.</div>';
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-message">❌ Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
