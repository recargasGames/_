<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>RECARGASGAMES - Mi Billetera</title>

<!-- Firebase Compat (Igual que Netflix) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
    --oro: #d4af37;
    --oro-claro: #ffe58a;
    --fondo: #080b14;
    --gris: #94a3b8;
    --verde: #22c55e;
    --rojo: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; padding-top: 85px; padding-bottom: 35px; background: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
.video-fondo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: .25; pointer-events: none; }
.video-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at top, rgba(212,175,55,.12), transparent 40%), linear-gradient(180deg, rgba(5,8,16,.88), rgba(5,8,16,.98)); }

.barra-superior { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(5,8,16,.96); border-bottom: 1px solid rgba(212,175,55,.35); backdrop-filter: blur(15px); }
.header { max-width: 700px; margin: auto; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
.brand img { height: 48px; max-width: 170px; object-fit: contain; border-radius: 10px; }
.btn-volver { padding: 10px 16px; border: 1px solid rgba(212,175,55,.5); border-radius: 10px; color: var(--oro-claro); background: rgba(212,175,55,.12); text-decoration: none; font-size: 13px; font-weight: 800; }

.main { width: 100%; max-width: 580px; margin: auto; padding: 18px; }

/* SALDO */
.saldo-card { padding: 22px 18px; margin-bottom: 18px; border-radius: 19px; background: linear-gradient(145deg, rgba(212,175,55,.22), rgba(8,13,26,.95)); border: 1px solid rgba(212,175,55,.55); text-align: center; }
.saldo-label { color: var(--oro-claro); font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.saldo-valor { font-size: clamp(38px, 10vw, 52px); font-weight: 950; line-height: 1; }
.saldo-valor .moneda { color: var(--oro-claro); font-size: .55em; }
.saldo-info { margin-top: 8px; color: #c9d4e6; font-size: 11px; }

/* TARJETAS Y CAMPOS */
.card { padding: 21px 18px; margin-bottom: 18px; border-radius: 19px; border: 1px solid rgba(212,175,55,.24); background: linear-gradient(145deg, rgba(22,32,54,.96), rgba(8,13,26,.97)); }
.card-title { display: flex; align-items: center; gap: 11px; margin-bottom: 19px; color: var(--oro-claro); font-size: 14px; font-weight: 900; text-transform: uppercase; }
.paso { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #101522; background: linear-gradient(135deg, var(--oro), var(--oro-claro)); font-weight: 900; }

.form-group { margin-bottom: 17px; }
.form-group label { display: block; margin-bottom: 8px; color: #dce3ee; font-size: 12px; font-weight: 800; text-transform: uppercase; }
.form-input { width: 100%; height: 52px; padding: 12px 15px; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; outline: none; background: rgba(0,0,0,.35); color: #fff; font-size: 16px; }
.form-input:focus { border-color: var(--oro); }

.montos-rapidos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 11px; }
.btn-monto { padding: 10px 4px; border: 1px solid rgba(212,175,55,.35); border-radius: 9px; background: rgba(212,175,55,.08); color: var(--oro-claro); font-weight: 800; font-size: 13px; cursor: pointer; }
.btn-monto.activo { background: linear-gradient(135deg, var(--oro), var(--oro-claro)); color: #111827; }

.total-box { margin-top: 16px; padding: 16px; border: 1px solid rgba(212,175,55,.3); border-radius: 13px; background: rgba(0,0,0,.3); text-align: center; }
.total-label { color: var(--gris); font-size: 11px; font-weight: 700; text-transform: uppercase; }
.total-valor { display: block; margin-top: 5px; color: var(--oro-claro); font-size: 26px; font-weight: 900; }
.tasa-info { margin-top: 8px; color: #94a3b8; font-size: 11px; }

/* DATOS DE PAGO */
.datos-pago { padding: 13px 15px; border: 1px solid rgba(255,255,255,.07); border-radius: 14px; background: rgba(0,0,0,.3); }
.dato { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.dato:last-child { border-bottom: none; }
.dato strong { display: block; margin-bottom: 4px; color: #9caabd; font-size: 11px; text-transform: uppercase; }
.dato span { color: #fff; font-size: 14px; font-weight: 800; }
.btn-copiar { padding: 9px 11px; border: 1px solid rgba(212,175,55,.35); border-radius: 9px; background: rgba(212,175,55,.12); color: var(--oro-claro); font-size: 11px; font-weight: 800; cursor: pointer; }

.btn-accion { width: 100%; min-height: 55px; margin-top: 16px; padding: 15px; border: none; border-radius: 13px; background: linear-gradient(135deg, #c69b25, #ffe58a, #d4af37); color: #101522; font-size: 14px; font-weight: 950; text-transform: uppercase; cursor: pointer; }
.btn-accion:disabled { opacity: .5; cursor: not-allowed; }

.alert { display: none; margin-top: 16px; padding: 16px; border-radius: 13px; font-size: 13px; line-height: 1.7; }
.alert.error { display: block; background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.5); }
.alert.success { display: block; background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.5); }
</style>
</head>

<body>

<video autoplay muted loop playsinline class="video-fondo">
    <source src="fondo.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<header class="barra-superior">
    <div class="header">
        <a href="index.html" class="brand"><img src="logo.png" alt="Recargas Games"></a>
        <a href="index.html" class="btn-volver">← Volver</a>
    </div>
</header>

<main class="main">
    <section class="saldo-card">
        <div class="saldo-label">💰 Tu saldo disponible</div>
        <div class="saldo-valor"><span class="moneda">$</span><span id="saldoNumero">0.00</span></div>
        <div class="saldo-info" id="saldoInfoCuenta">Verificando sesión...</div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">1</span> Monto a recargar</div>
        <div class="form-group">
            <label>Monto en Dólares (USD)</label>
            <input type="number" id="montoRecarga" class="form-input" placeholder="Ej: 5.00" min="0.01" max="500" step="0.01">
            <div class="montos-rapidos">
                <button type="button" class="btn-monto" data-monto="1">$1</button>
                <button type="button" class="btn-monto" data-monto="5">$5</button>
                <button type="button" class="btn-monto" data-monto="10">$10</button>
                <button type="button" class="btn-monto" data-monto="20">$20</button>
            </div>
        </div>
        <div class="total-box">
            <span class="total-label">Total a pagar en Bs</span>
            <strong class="total-valor" id="montoBs">— Bs</strong>
            <div class="tasa-info" id="tasaInfo">Cargando tasa...</div>
        </div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">2</span> Datos para Pago Móvil</div>
        <div class="datos-pago">
            <div class="dato"><div><strong>Banco</strong><span>(0102) BDV</span></div><button class="btn-copiar" data-copiar="0102">📋</button></div>
            <div class="dato"><div><strong>Cédula</strong><span>32824869</span></div><button class="btn-copiar" data-copiar="32824869">📋</button></div>
            <div class="dato"><div><strong>Teléfono</strong><span>04228242411</span></div><button class="btn-copiar" data-copiar="04228242411">📋</button></div>
            <div class="dato"><div><strong>Monto</strong><span id="montoBsCopiar">— Bs</span></div><button class="btn-copiar" id="copiarMonto">📋</button></div>
        </div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">3</span> Enviar comprobante</div>
        <div class="form-group">
            <label>Número de referencia del pago</label>
            <input type="text" id="referenciaPago" class="form-input" placeholder="Ej: 0050943851750" maxlength="40">
        </div>
        <button class="btn-accion" id="btnEnviar">📤 Enviar recarga</button>
        <div class="alert" id="resultado"></div>
    </section>
</main>

<script>
// 1. INICIALIZACIÓN DIRECTA (Igual que Netflix)
const firebaseConfig = {
    apiKey: "AIzaSyAARiBZAruTMx2anf6qCn61SKhXYsyL5w",
    authDomain: "free-52119.firebaseapp.com",
    databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "free-52119",
    storageBucket: "free-52119.firebasestorage.app",
    messagingSenderId: "632240144599",
    appId: "1:632240144599:web:e31c25665ffe19c194b092"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();
let tasa = 940;
let usuarioActual = null;

// 2. VERIFICAR SESIÓN (Sin redirecciones raras)
auth.onAuthStateChanged((user) => {
    if (!user) {
        // Si no hay sesión, lo mandamos al index a loguearse
        document.getElementById("saldoInfoCuenta").textContent = "⚠️ Inicia sesión en el inicio para recargar.";
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
        return;
    }
    
    usuarioActual = user;
    document.getElementById("saldoInfoCuenta").textContent = "👤 " + (user.email || "Usuario");
    
    // Escuchar saldo en tiempo real
    db.ref("usuarios/" + user.uid + "/saldo_billetera").on("value", (snap) => {
        document.getElementById("saldoNumero").textContent = (Number(snap.val()) || 0).toFixed(2);
    });
});

// 3. TASA DE CAMBIO
fetch("/api/tasa").then(r => r.json()).then(d => {
    if(d.ok) { 
        tasa = d.tasa_usdt; 
        document.getElementById("tasaInfo").textContent = "Tasa: " + tasa + " Bs"; 
    }
}).catch(() => {});

// 4. CALCULAR MONTO
const inputMonto = document.getElementById("montoRecarga");
const montoBsEl = document.getElementById("montoBs");
const montoBsCopiar = document.getElementById("montoBsCopiar");

inputMonto.addEventListener("input", () => {
    const usd = Number(inputMonto.value);
    if (usd > 0) {
        const bs = Math.round(usd * tasa).toLocaleString("es-VE") + " Bs";
        montoBsEl.textContent = bs;
        montoBsCopiar.textContent = bs;
    } else {
        montoBsEl.textContent = "— Bs";
        montoBsCopiar.textContent = "— Bs";
    }
});

// Botones de monto rápido
document.querySelectorAll(".btn-monto").forEach(b => {
    b.addEventListener("click", () => {
        document.querySelectorAll(".btn-monto").forEach(btn => btn.classList.remove("activo"));
        b.classList.add("activo");
        inputMonto.value = b.dataset.monto;
        inputMonto.dispatchEvent(new Event("input"));
    });
});

// 5. COPIAR DATOS
document.querySelectorAll("[data-copiar]").forEach(b => {
    b.addEventListener("click", () => {
        navigator.clipboard.writeText(b.dataset.copiar);
        alert("✅ Copiado: " + b.dataset.copiar);
    });
});

document.getElementById("copiarMonto").addEventListener("click", () => {
    if(montoBsCopiar.textContent !== "— Bs") {
        navigator.clipboard.writeText(montoBsCopiar.textContent);
        alert("✅ Copiado: " + montoBsCopiar.textContent);
    }
});

// 6. ENVIAR RECARGA
document.getElementById("btnEnviar").addEventListener("click", async () => {
    if (!usuarioActual) return alert("Debes iniciar sesión.");
    
    const btn = document.getElementById("btnEnviar");
    const res = document.getElementById("resultado");
    const monto = Number(inputMonto.value);
    const refCode = document.getElementById("referenciaPago").value.trim().toUpperCase();

    if (monto < 0.01 || !refCode) {
        res.className = "alert error";
        res.textContent = "❌ Ingresa un monto válido y una referencia.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Enviando...";

    try {
        const data = {
            uid: usuarioActual.uid,
            email: usuarioActual.email,
            id_cliente: usuarioActual.uid,
            monto_usd: monto,
            monto_bs: Math.round(monto * tasa),
            referencia: refCode,
            metodo: "PAGO MOVIL",
            estado: "PENDIENTE_VERIFICACION",
            fecha: new Date().toISOString(),
            fecha_legible: new Date().toLocaleString("es-VE")
        };
        
        await db.ref("recargas_billetera").push(data);

        res.className = "alert success";
        res.innerHTML = `✅ <b>¡Recarga enviada!</b><br>Tu saldo se acreditará después de verificar el pago.`;
        
        inputMonto.value = "";
        document.getElementById("referenciaPago").value = "";
        inputMonto.dispatchEvent(new Event("input"));
    } catch (e) {
        res.className = "alert error";
        res.textContent = "❌ Error al guardar. Revisa tu conexión.";
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.textContent = "📤 Enviar recarga";
    }
});
</script>

</body>
</html>
