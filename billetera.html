<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RECARGASGAMES - Mi Billetera</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root { --oro: #d4af37; --oro-claro: #ffe58a; --gris: #94a3b8; --verde: #22c55e; --rojo: #ef4444; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; padding-top: 80px; background: #000; color: #fff; font-family: Arial, sans-serif; }
.barra-superior { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #050810; border-bottom: 1px solid rgba(212,175,55,.35); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
.brand img { height: 45px; }
.btn-volver { padding: 10px 16px; border: 1px solid var(--oro); border-radius: 10px; color: var(--oro-claro); text-decoration: none; font-weight: 800; font-size: 13px; }
.main { max-width: 580px; margin: auto; padding: 18px; }

.saldo-card { padding: 22px; margin-bottom: 18px; border-radius: 19px; background: rgba(212,175,55,.15); border: 1px solid var(--oro); text-align: center; }
.saldo-label { color: var(--oro-claro); font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
.saldo-valor { font-size: 48px; font-weight: 900; color: #fff; }
.saldo-valor span { color: var(--oro-claro); font-size: 24px; }
.saldo-info { margin-top: 8px; font-size: 12px; color: #ccc; }

.card { padding: 20px; margin-bottom: 18px; border-radius: 19px; border: 1px solid rgba(212,175,55,.3); background: #0d1421; }
.card-title { font-size: 15px; font-weight: 900; color: var(--oro-claro); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
.paso { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--oro); color: #000; font-weight: 900; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 5px; color: #dce3ee; }
.form-input { width: 100%; height: 50px; padding: 0 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; }
.form-input:focus { border-color: var(--oro); outline: none; }

.montos-rapidos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.btn-monto { padding: 10px; border: 1px solid rgba(212,175,55,.4); border-radius: 8px; background: rgba(212,175,55,.1); color: var(--oro-claro); font-weight: bold; cursor: pointer; }
.btn-monto.activo { background: var(--oro); color: #000; }

.total-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,.4); border: 1px solid rgba(212,175,55,.2); border-radius: 10px; text-align: center; }
.total-label { font-size: 11px; color: var(--gris); text-transform: uppercase; }
.total-valor { display: block; margin-top: 5px; font-size: 24px; font-weight: 900; color: var(--oro-claro); }
.tasa-info { font-size: 11px; color: var(--gris); margin-top: 5px; }

.datos-pago { padding: 15px; background: #000; border: 1px solid #222; border-radius: 10px; }
.dato { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
.dato:last-child { border-bottom: none; }
.dato strong { display: block; font-size: 11px; color: var(--gris); }
.dato span { font-size: 14px; font-weight: bold; }
.btn-copiar { padding: 8px 12px; border: 1px solid var(--oro); border-radius: 8px; background: rgba(212,175,55,.1); color: var(--oro-claro); cursor: pointer; }
.btn-accion { width: 100%; height: 55px; margin-top: 15px; border: none; border-radius: 12px; background: var(--oro); color: #000; font-size: 15px; font-weight: 900; cursor: pointer; }
.alert { display: none; margin-top: 15px; padding: 15px; border-radius: 10px; background: rgba(34,197,94,.1); border: 1px solid var(--verde); color: #4ade80; font-size: 13px; }
.alert.error { background: rgba(239,68,68,.1); border-color: var(--rojo); color: #fca5a5; display: block; }
</style>
</head>
<body>

<header class="barra-superior">
    <a href="index.html" class="brand"><img src="logo.png"></a>
    <a href="index.html" class="btn-volver">← Volver</a>
</header>

<main class="main">
    <section class="saldo-card">
        <div class="saldo-label">💰 Tu saldo disponible</div>
        <div class="saldo-valor"><span>$</span><span id="saldoNumero">0.00</span></div>
        <div class="saldo-info" id="saldoInfoCuenta">Cargando usuario...</div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">1</span> Monto a recargar</div>
        <div class="form-group">
            <label>Monto (USD)</label>
            <input type="number" id="montoRecarga" class="form-input" placeholder="Ej: 5.00" min="0.01" max="500">
            <div class="montos-rapidos">
                <button class="btn-monto" data-monto="1">$1</button>
                <button class="btn-monto" data-monto="5">$5</button>
                <button class="btn-monto" data-monto="10">$10</button>
                <button class="btn-monto" data-monto="20">$20</button>
            </div>
        </div>
        <div class="total-box">
            <span class="total-label">Total a pagar en Bs</span>
            <strong class="total-valor" id="montoBs">— Bs</strong>
            <div class="tasa-info" id="tasaInfo">Cargando tasa...</div>
        </div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">2</span> Pago Móvil</div>
        <div class="datos-pago">
            <div class="dato"><div><strong>Banco</strong><span>0102 - BDV</span></div><button class="btn-copiar" data-copiar="0102">📋</button></div>
            <div class="dato"><div><strong>Cédula</strong><span>32824869</span></div><button class="btn-copiar" data-copiar="32824869">📋</button></div>
            <div class="dato"><div><strong>Teléfono</strong><span>04228242411</span></div><button class="btn-copiar" data-copiar="04228242411">📋</button></div>
            <div class="dato"><div><strong>Monto</strong><span id="montoBsCopiar">— Bs</span></div><button class="btn-copiar" id="copiarMonto">📋</button></div>
        </div>
    </section>

    <section class="card">
        <div class="card-title"><span class="paso">3</span> Enviar comprobante</div>
        <div class="form-group">
            <label>Número de Referencia</label>
            <input type="text" id="referenciaPago" class="form-input" placeholder="Ej: 005094...">
        </div>
        <button class="btn-accion" id="btnEnviar">📤 Enviar recarga</button>
        <div class="alert" id="resultado"></div>
    </section>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAARiBZAruTMx2anf6qCn61SKhXYsyL5w",
    authDomain: "free-52119.firebaseapp.com",
    databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "free-52119",
    storageBucket: "free-52119.firebasestorage.app",
    messagingSenderId: "632240144599",
    appId: "1:632240144599:web:e31c25665ffe19c194b092"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let tasa = 940;
let usuarioActual = null;

// AQUÍ ESTÁ LA MAGIA: NO REDIRIGE.
auth.onAuthStateChanged((user) => {
    if (!user) {
        document.getElementById("saldoInfoCuenta").innerHTML = "<span style='color:#ef4444'>⚠️ Sin sesión iniciada</span>";
        document.getElementById("resultado").className = "alert error";
        document.getElementById("resultado").textContent = "Debes iniciar sesión en la página principal primero.";
        return;
    }
    
    usuarioActual = user;
    document.getElementById("saldoInfoCuenta").textContent = "👤 " + (user.email || "Usuario");
    
    // Escuchar saldo en tiempo real
    db.ref("usuarios/" + user.uid + "/saldo_billetera").on("value", (snap) => {
        document.getElementById("saldoNumero").textContent = (Number(snap.val()) || 0).toFixed(2);
    });
});

// Cargar tasa
fetch("/api/tasa").then(r => r.json()).then(d => {
    if(d.ok) {
        tasa = d.tasa_usdt;
        document.getElementById("tasaInfo").textContent = "Tasa: " + tasa + " Bs";
    }
}).catch(() => {});

// Calcular monto
document.getElementById("montoRecarga").addEventListener("input", (e) => {
    const usd = Number(e.target.value);
    if(usd > 0) {
        const bs = Math.round(usd * tasa).toLocaleString("es-VE");
        document.getElementById("montoBs").textContent = bs + " Bs";
        document.getElementById("montoBsCopiar").textContent = bs + " Bs";
    } else {
        document.getElementById("montoBs").textContent = "— Bs";
        document.getElementById("montoBsCopiar").textContent = "— Bs";
    }
});

// Botones de monto rápido
document.querySelectorAll(".btn-monto").forEach(b => {
    b.addEventListener("click", () => {
        document.querySelectorAll(".btn-monto").forEach(btn => btn.classList.remove("activo"));
        b.classList.add("activo");
        document.getElementById("montoRecarga").value = b.dataset.monto;
        document.getElementById("montoRecarga").dispatchEvent(new Event("input"));
    });
});

// Copiar
document.querySelectorAll("[data-copiar]").forEach(b => {
    b.addEventListener("click", () => {
        navigator.clipboard.writeText(b.dataset.copiar);
        alert("Copiado: " + b.dataset.copiar);
    });
});

// Enviar recarga
document.getElementById("btnEnviar").addEventListener("click", async () => {
    if (!usuarioActual) return alert("No has iniciado sesión.");
    
    const monto = Number(document.getElementById("montoRecarga").value);
    const ref = document.getElementById("referenciaPago").value.trim().toUpperCase();
    const btn = document.getElementById("btnEnviar");
    const res = document.getElementById("resultado");

    if (monto < 0.01 || !ref) {
        res.className = "alert error";
        res.textContent = "❌ Ingresa un monto válido y una referencia.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Enviando...";

    try {
        const data = {
            uid: usuarioActual.uid,
            email: usuarioActual.email,
            id_cliente: usuarioActual.uid,
            monto_usd: monto,
            monto_bs: Math.round(monto * tasa),
            referencia: ref,
            metodo: "PAGO MOVIL",
            estado: "PENDIENTE_VERIFICACION",
            fecha: new Date().toISOString(),
            fecha_legible: new Date().toLocaleString("es-VE")
        };

        await db.ref("recargas_billetera").push(data);

        res.className = "alert";
        res.style.display = "block";
        res.style.background = "rgba(34,197,94,.2)";
        res.style.borderColor = "#22c55e";
        res.style.color = "#4ade80";
        res.textContent = "✅ Recarga enviada. El administrador la verificará pronto.";

        document.getElementById("montoRecarga").value = "";
        document.getElementById("referenciaPago").value = "";
        document.getElementById("montoBs").textContent = "— Bs";
        document.getElementById("montoBsCopiar").textContent = "— Bs";

    } catch (e) {
        res.className = "alert error";
        res.textContent = "❌ Error al guardar. Revisa las reglas de Firebase.";
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.textContent = "📤 Enviar recarga";
    }
});
</script>
</body>
</html>
