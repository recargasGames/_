<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Pedidos - Store Gamers</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --fondo-oscuro: #0a0f1c;
            --card-bg: #111827;
            --card-borde: #1e293b;
            --azul-brillante: #3b82f6;
            --verde-brillante: #10b981;
            --texto-gris: #94a3b8;
            --texto-blanco: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fondo-oscuro);
            color: var(--texto-blanco);
            min-height: 100vh;
            padding-bottom: 80px;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0a0f1c 70%);
        }

        /* --- BARRA SUPERIOR --- */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: rgba(10, 15, 28, 0.95);
            border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar .logo { height: 40px; border-radius: 8px; }
        .topbar .iconos { display: flex; gap: 15px; align-items: center; }
        .topbar .iconos svg { width: 24px; height: 24px; fill: none; stroke: #cbd5e1; stroke-width: 2; }
        .topbar .perfil { width: 36px; height: 36px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* --- SUB-MENÚ DE JUEGOS --- */
        .submenu {
            display: flex; gap: 20px; padding: 15px 20px;
            background: rgba(10, 15, 28, 0.8);
            border-bottom: 1px solid #1e293b;
            overflow-x: auto; white-space: nowrap;
        }
        .submenu span {
            font-size: 14px; font-weight: 600; color: #cbd5e1;
            display: flex; align-items: center; gap: 5px;
        }
        .submenu span.active { color: var(--texto-blanco); border-bottom: 2px solid var(--azul-brillante); padding-bottom: 5px; }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }

        /* --- TARJETAS DE RESUMEN --- */
        .resumen {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .resumen-card {
            flex: 1; background: var(--card-bg); border: 1px solid var(--card-borde);
            border-radius: 12px; padding: 15px 10px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .resumen-card .icono-box {
            width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
        }
        .resumen-card .icono-box.azul { background: rgba(59, 130, 246, 0.15); color: var(--azul-brillante); }
        .resumen-card .icono-box.naranja { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .resumen-card .icono-box.verde { background: rgba(16, 185, 129, 0.15); color: var(--verde-brillante); }
        .resumen-card .icono-box svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
        .resumen-card .numero { font-size: 22px; font-weight: 700; color: var(--texto-blanco); line-height: 1.2; }
        .resumen-card .etiqueta { font-size: 11px; color: var(--texto-gris); margin-top: 4px; }

        /* --- TÍTULO DE SECCIÓN --- */
        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 18px; font-weight: 700; margin-bottom: 15px; color: var(--texto-blanco);
        }
        .section-title svg { width: 22px; height: 22px; fill: var(--azul-brillante); }

        /* --- TARJETAS DE PEDIDOS --- */
        .pedidos-list { display: flex; flex-direction: column; gap: 15px; }
        .pedido-card {
            background: var(--card-bg);
            border: 1px solid var(--card-borde);
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }
        .pedido-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 12px; flex-wrap: wrap; gap: 5px;
        }
        .pedido-header-left { display: flex; flex-direction: column; gap: 4px; }
        .pedido-id { font-size: 16px; font-weight: 700; color: var(--azul-brillante); }
        .pedido-fecha { font-size: 11px; color: var(--texto-gris); display: flex; align-items: center; gap: 4px; }
        .pedido-header-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .pedido-precio { font-size: 18px; font-weight: 700; color: var(--verde-brillante); }
        .pedido-metodo { font-size: 10px; color: var(--texto-gris); text-transform: uppercase; display: flex; align-items: center; gap: 4px; }

        .pedido-body { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .pedido-producto { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
        .pedido-producto svg { width: 16px; height: 16px; fill: none; stroke: var(--azul-brillante); stroke-width: 2; }
        .pedido-referencia {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--texto-gris);
            background: #1e293b; padding: 6px 10px; border-radius: 6px;
        }
        .pedido-referencia svg { width: 12px; height: 12px; fill: none; stroke: var(--texto-gris); stroke-width: 2; }

        .pedido-jugador-box {
            background: #1e293b; border-radius: 8px; padding: 10px 12px; margin-bottom: 15px;
            font-size: 12px; line-height: 1.6; color: #cbd5e1;
        }
        .pedido-jugador-box strong { color: #fff; }

        /* --- LÍNEA DE TIEMPO --- */
        .pedido-timeline {
            display: flex; align-items: center; justify-content: space-between;
            position: relative; padding-top: 10px;
            border-top: 1px solid #1e293b;
        }
        .timeline-step { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; width: 70px; text-align: center; }
        .timeline-icon {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #1e293b; color: var(--texto-gris);
        }
        .timeline-icon svg { width: 16px; height: 16px; fill: currentColor; }
        .timeline-step.recibido .timeline-icon { background: var(--verde-brillante); color: #fff; }
        .timeline-step.verificando .timeline-icon { background: #f59e0b; color: #fff; }
        .timeline-step.completado .timeline-icon { background: var(--verde-brillante); color: #fff; }
        .timeline-label { font-size: 11px; font-weight: 600; color: var(--texto-gris); }
        .timeline-step.recibido .timeline-label,
        .timeline-step.verificando .timeline-label,
        .timeline-step.completado .timeline-label { color: #fff; }
        
        .timeline-line { flex: 1; height: 3px; background: #1e293b; margin-top: -22px; z-index: 1; border-radius: 3px; }
        .timeline-line.active { background: var(--azul-brillante); }
        .timeline-line.completed { background: var(--verde-brillante); }

        /* --- BOTÓN FLOTANTE --- */
        .btn-instalar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #2563eb; color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: 700; font-size: 15px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            cursor: pointer; z-index: 1000;
        }
        .btn-instalar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

        /* --- ESTADOS VACÍOS Y ERRORES --- */
        .sin-pedidos { text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--card-borde); }
        .sin-pedidos h3 { margin-bottom: 8px; }
        .sin-pedidos p { color: var(--texto-gris); font-size: 14px; }
        
        .loading { text-align: center; padding: 40px; color: var(--texto-gris); }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: var(--azul-brillante); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* --- TOAST --- */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 2000;
        }
        .toast.visible { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR (Tal cual la foto) -->
<header class="topbar">
    <!-- Cambia 'logo.png' por el logo real de Store Gamers si lo tienes -->
    <img src="logo.png" alt="Store Gamers" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMzYjgyZjYiIHN0cm9rZS13aWR0aD0iMiI+PHBhdGggZD0iTTEyIDJMMiA3bDEwIDUgMTAtNS0xMC01eiIvPjxwYXRoIGQ9Ik0yIDE3bDEwIDUgMTAtNS0xMC01LTEwIDV6Ii8+PC9zdmc+'">
    <div class="iconos">
        <!-- Icono de Campana -->
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <!-- Icono de Perfil -->
        <div class="perfil">
            <svg viewBox="0 0 24 24" style="stroke: #3b82f6;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <!-- Icono de Menú Hamburguesa -->
        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
</header>

<!-- SUB-MENÚ (Tal cual la foto) -->
<div class="submenu">
    <span class="active">FREE FIRE 💎</span>
    <span>PASES DE NIVEL</span>
    <span>BLOOD STRIKE</span>
</div>

<main class="container">

    <!-- TARJETAS DE RESUMEN (Total, Pendientes, Completados) -->
    <div class="resumen">
        <div class="resumen-card">
            <div class="icono-box azul">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <span class="numero" id="totalPedidos">0</span>
            <span class="etiqueta">Total Pedidos</span>
        </div>
        <div class="resumen-card">
            <div class="icono-box naranja">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span class="numero" id="pendientesCount">0</span>
            <span class="etiqueta">Pendientes</span>
        </div>
        <div class="resumen-card">
            <div class="icono-box verde">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <span class="numero" id="completadosCount">0</span>
            <span class="etiqueta">Completados</span>
        </div>
    </div>

    <!-- TÍTULO "MIS PEDIDOS" -->
    <div class="section-title">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v17l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5" stroke="#fff" stroke-width="2" fill="none"/></svg>
        Mis Pedidos
    </div>

    <!-- LISTA DE PEDIDOS (Aquí se cargarán los datos automáticamente) -->
    <div class="pedidos-list" id="listaPedidos">
        <div class="loading">
            <div class="spinner"></div>
            <p>Cargando tus pedidos...</p>

</main>

<!-- BOTÓN FLOTANTE "INSTALAR APP" -->
<button class="btn-instalar">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Instalar App
</button>

<div class="toast" id="toast" role="status"></div>

<script>
    // --- CONFIGURACIÓN DE FIREBASE (Tus datos reales) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092",
        measurementId: "G-5NLLLEPWPK"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let todosPedidos = [];
    let uidActual = null;
    const listaEl = document.getElementById('listaPedidos');
    const toastEl = document.getElementById('toast');

    // --- UTILIDADES ---
    function esc(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function avisar(mensaje) {
        toastEl.textContent = mensaje;
        toastEl.classList.add('visible');
        setTimeout(() => toastEl.classList.remove('visible'), 3000);
    }

    function formatearMonto(valor) {
        const n = parseFloat(valor);
        return isNaN(n) ? '0.00' : n.toFixed(2);
    }

    function formatearFecha(fechaStr) {
        if (!fechaStr) return 'Fecha no disponible';
        try {
            const d = new Date(fechaStr);
            if (isNaN(d.getTime())) return fechaStr; // Si ya viene formateada
            return d.toLocaleString('es-VE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return fechaStr; }
    }

    // --- CARGA DE DATOS ---
    auth.onAuthStateChanged((user) => {
        if (!user) {
            // Si no está logueado, redirigir a login (descomentar si es necesario)
            // window.location.href = 'login.html';
            // Por ahora, para pruebas, cargaremos datos de ejemplo si no hay usuario
            cargarPedidosDemo();
            return;
        }
        uidActual = user.uid;
        cargarPedidosReales();
    });

    function cargarPedidosReales() {
        const consulta = db.ref('pedidos').orderByChild('uid').equalTo(uidActual);
        consulta.on('value', (snapshot) => {
            todosPedidos = [];
            snapshot.forEach((child) => {
                const pedido = child.val();
                pedido.key = child.key;
                // Normalizar estado
                const est = String(pedido.estado || 'pendiente').toLowerCase();
                if (['completado', 'completada'].includes(est)) pedido._estado = 'completado';
                else if (['cancelado', 'cancelada'].includes(est)) pedido._estado = 'cancelado';
                else if (['procesando'].includes(est)) pedido._estado = 'procesando';
                else pedido._estado = 'pendiente';
                
                todosPedidos.push(pedido);
            });
            // Ordenar por fecha descendente
            todosPedidos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            renderizar();
        }, (error) => {
            console.error(error);
            listaEl.innerHTML = `<div class="sin-pedidos"><h3>Error de conexión</h3><p>No se pudieron cargar los pedidos.</p></div>`;
        });
    }

    // --- RENDERIZADO ---
    function renderizar() {
        // Actualizar contadores superiores
        const total = todosPedidos.length;
        const pendientes = todosPedidos.filter(p => p._estado === 'pendiente' || p._estado === 'procesando').length;
        const completados = todosPedidos.filter(p => p._estado === 'completado').length;

        document.getElementById('totalPedidos').textContent = total;
        document.getElementById('pendientesCount').textContent = pendientes;
        document.getElementById('completadosCount').textContent = completados;

        if (total === 0) {
            listaEl.innerHTML = `<div class="sin-pedidos"><h3>No tienes pedidos</h3><p>Realiza tu primera recarga para verla aquí.</p></div>`;
            return;
        }

        let html = '';
        todosPedidos.forEach(p => {
            const idPedido = p.numero_pedido || p.referencia || p.key || 'N/A';
            const juego = p.juego || 'Producto';
            const producto = p.producto ? ` - ${p.producto}` : '';
            const monto = formatearMonto(p.monto_usd || p.monto);
            const metodo = p.metodo || 'Pago Móvil';
            const fecha = formatearFecha(p.fecha);
            const refPago = p.referencia_pago || 'N/A';
            
            // Datos del jugador (solo si no es streaming y existen)
            const idJugador = p.id_jugador || p.player_id || '';
            const nombreJugador = p.nombre_jugador || p.player_name || '';
            let jugadorHtml = '';
            if (idJugador || nombreJugador) {
                jugadorHtml = `
                    <div class="pedido-jugador-box">
                        ${idJugador ? `<div><strong>ID de Jugador:</strong> ${esc(idJugador)}</div>` : ''}
                        ${nombreJugador ? `<div><strong>Nombre de Jugador:</strong> ${esc(nombreJugador)}</div>` : ''}
                    </div>`;
            }

            // Línea de tiempo
            let stepRecibido = 'recibido';
            let stepVerificando = '';
            let stepCompletado = '';
            let line1 = 'active';
            let line2 = '';

            if (p._estado === 'completado') {
                stepVerificando = 'verificando';
                stepCompletado = 'completado';
                line1 = 'completed';
                line2 = 'completed';
            } else if (p._estado === 'procesando') {
                stepVerificando = 'verificando';
                line1 = 'active';
            }

            const timelineHtml = p._estado === 'cancelado' ? '' : `
                <div class="pedido-timeline">
                    <div class="timeline-step ${stepRecibido}">
                        <div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="timeline-label">Recibido</div>
                    </div>
                    <div class="timeline-line ${line1}"></div>
                    <div class="timeline-step ${stepVerificando}">
                        <div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>
                        <div class="timeline-label">Verificando</div>
                    </div>
                    <div class="timeline-line ${line2}"></div>
                    <div class="timeline-step ${stepCompletado}">
                        <div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="timeline-label">Completado</div>
                    </div>
                </div>`;

            html += `
                <div class="pedido-card">
                    <div class="pedido-header">
                        <div class="pedido-header-left">
                            <div class="pedido-id">#${esc(idPedido)}</div>
                            <div class="pedido-fecha">
                                <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                ${esc(fecha)}
                            </div>
                        </div>
                        <div class="pedido-header-right">
                            <span class="pedido-precio">$${esc(monto)}</span>
                            <span class="pedido-metodo">
                                <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2;"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                                BS|${esc(metodo).toUpperCase()}
                            </span>
                        </div>
                    </div>

                    <div class="pedido-body">
                        <div class="pedido-producto">
                            <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            <span>${esc(juego)}${esc(producto)}</span>
                        </div>
                        <div class="pedido-referencia">
                            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            Ref: ${esc(refPago)}
                        </div>
                    </div>

                    ${jugadorHtml}
                    ${timelineHtml}
                </div>
            `;
        });

        listaEl.innerHTML = html;
    }

    // --- DATOS DEMO (Solo para que veas el diseño si no tienes Firebase configurado) ---
    // Esta función simula la carga de datos de la imagen que enviaste
    function cargarPedidosDemo() {
        // Simulamos 6 pedidos
