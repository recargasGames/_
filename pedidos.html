<style>
:root{
    --bg:#05070d;
    --surface:#0b101b;
    --surface-2:#101827;
    --blue:#2587ff;
    --blue-light:#6fe0ff;
    --gold:#d4af37;
    --gold-light:#f5d76e;
    --green:#39e6a1;
    --red:#ff637b;
    --yellow:#f5d76e;
    --text:#f4f7ff;
    --muted:#8995aa;
    --border:rgba(142,168,210,.12);
    --alto-nav:64px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;padding-top:70px;padding-bottom:30px;overflow-x:hidden;min-height:100vh;position:relative;}
body.con-nav{padding-bottom:calc(var(--alto-nav) + 24px + env(safe-area-inset-bottom));}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue-light);outline-offset:2px;}

.video-fondo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none;opacity:1;filter:brightness(1.15);will-change:transform;transform:translateZ(0);}
.video-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,7,13,0.15) 0%,rgba(5,7,13,0.35) 60%,rgba(5,7,13,0.6) 100%);z-index:-1;pointer-events:none;}

/* ===== BARRA SUPERIOR (Estilo imagen) ===== */
.barra-superior{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(5,7,13,0.95);border-bottom:1px solid rgba(37,135,255,0.2);box-shadow:0 4px 20px rgba(0,0,0,0.6);}
.header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand img{height:40px;width:auto;filter:drop-shadow(0 0 8px rgba(37,135,255,0.4));}
.brand-text{display:flex;flex-direction:column;}
.brand-text span:first-child{font-size:16px;font-weight:900;letter-spacing:0.5px;color:#fff;}
.brand-text span:first-child em{color:var(--blue);font-style:normal;}
.brand-text span:last-child{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.btn-volver{display:flex;align-items:center;gap:6px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:600;transition:.2s;}
.btn-volver:hover{color:#fff;}
.btn-volver svg{width:16px;height:16px;}

/* ===== MAIN ===== */
.main{padding:20px 15px;max-width:600px;margin:0 auto;position:relative;z-index:1;}

/* ===== RESUMEN STATS ===== */
.resumen-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.stat-card{background:linear-gradient(180deg,rgba(16,24,39,0.9),rgba(11,16,27,0.95));border:1px solid rgba(37,135,255,0.15);border-radius:16px;padding:12px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;}
.stat-icon svg{width:20px;height:20px;fill:none;stroke-width:2;}
.stat-card:nth-child(1) .stat-icon{background:rgba(37,135,255,0.15);color:var(--blue);}
.stat-card:nth-child(2) .stat-icon{background:rgba(245,215,110,0.15);color:var(--yellow);}
.stat-card:nth-child(3) .stat-icon{background:rgba(57,230,161,0.15);color:var(--green);}
.stat-info{display:flex;flex-direction:column;}
.stat-num{font-size:20px;font-weight:900;color:#fff;line-height:1.1;}
.stat-label{font-size:9px;color:var(--muted);font-weight:600;margin-top:2px;}

/* ===== TITULO ===== */
.pagina-titulo{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.pagina-titulo h1{font-size:24px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;}
.pagina-titulo h1 svg{width:24px;height:24px;stroke:var(--blue);fill:none;}

/* ===== FILTROS (Pills) ===== */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin-bottom:8px;scrollbar-width:none;}
.filtros::-webkit-scrollbar{display:none;}
.filtro-btn{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:rgba(16,24,39,0.8);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;}
.filtro-btn:hover{border-color:rgba(255,255,255,0.2);}
.filtro-btn.activo{background:linear-gradient(90deg,rgba(212,175,55,0.15),rgba(212,175,55,0.05));border-color:rgba(212,175,55,0.5);color:var(--gold-light);}
.filtro-count{background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:6px;font-size:10px;}
.filtro-btn.activo .filtro-count{background:transparent;color:var(--gold-light);}

/* ===== BUSCADOR ===== */
.search-box{position:relative;margin-bottom:20px;}
.search-box input{width:100%;height:48px;padding:0 16px 0 44px;border-radius:12px;background:rgba(16,24,39,0.8);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:14px;font-family:inherit;transition:.2s;}
.search-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,135,255,0.2);}
.search-box input::placeholder{color:#6b7280;}
.search-box .icon-search{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;width:18px;height:18px;pointer-events:none;}
.search-box .clear-search{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:none;place-items:center;background:rgba(255,255,255,0.1);border:none;color:#fff;cursor:pointer;border-radius:50%;}
.search-box .clear-search:hover{background:rgba(255,255,255,0.2);}

/* ===== META ===== */
.orders-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:var(--muted);font-size:11px;}

/* ===== TARJETAS ACORDEÓN ===== */
.orders-list{display:flex;flex-direction:column;gap:12px;}

.order-card{background:linear-gradient(180deg,rgba(16,24,39,0.95),rgba(11,16,27,0.98));border:1px solid rgba(37,135,255,0.15);border-radius:16px;overflow:hidden;transition:border-color .3s,box-shadow .3s;position:relative;}
.order-card.expanded{border-color:rgba(212,175,55,0.6);box-shadow:0 0 20px rgba(212,175,55,0.1);}

/* Fondo dinámico por juego */
.order-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.15; /* Ajusta la opacidad para que no opaque el texto */
    z-index: 0;
    pointer-events: none;
}
.order-card > * {
    position: relative;
    z-index: 1;
}

/* Cabecera del pedido */
.order-header{display:flex;align-items:center;padding:16px;cursor:pointer;user-select:none;}
.order-num-wrap{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.order-num{color:var(--blue-light);font-size:20px;font-weight:900;letter-spacing:-0.5px;text-shadow:0 0 10px rgba(37,135,255,0.3);}
.order-status{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-left:10px;white-space:nowrap;}

.status-success{color:#4ade80;background:rgba(57,230,161,0.1);border:1px solid rgba(57,230,161,0.3);}
.status-pending{color:#f5d76e;background:rgba(245,215,110,0.1);border:1px solid rgba(245,215,110,0.3);}
.status-error{color:#ff637b;background:rgba(255,99,123,0.1);border:1px solid rgba(255,99,123,0.3);}
.status-neutral{color:#93c5fd;background:rgba(37,135,255,0.1);border:1px solid rgba(37,135,255,0.3);}

.order-status svg{width:12px;height:12px;fill:none;stroke-width:3;}

.order-info-preview{display:flex;flex-direction:column;margin-top:4px;font-size:11px;color:#94a3b8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.order-arrow{color:#9ca3af;margin-left:12px;transition:transform .3s;}
.order-arrow svg{width:16px;height:16px;fill:none;stroke-width:2;}
.order-card.expanded .order-arrow{transform:rotate(180deg);color:#fff;}

/* Contenido expandido */
.order-body{display:none;padding:0 16px 16px;border-top:1px solid rgba(255,255,255,0.05);}
.order-card.expanded .order-body{display:block;animation:slideDown .3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

.order-fields{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.order-field{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.order-field-left{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:13px;font-weight:600;min-width:100px;}
.order-field-left svg{width:16px;height:16px;fill:none;stroke-width:2;}
.order-field-right{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:13px;font-weight:600;text-align:right;word-break:break-all;}

/* BLOQUE DE CUENTAS (Netflix, etc) */
.account-block{background:rgba(37,135,255,0.05);border:1px dashed rgba(37,135,255,0.3);border-radius:10px;padding:12px;margin-top:16px;}
.account-title{font-size:11px;color:var(--blue-light);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.account-row{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px;color:#fff;}
.account-row:last-child{margin-bottom:0;}
.account-row strong{color:#94a3b8;font-weight:600;font-size:11px;text-transform:uppercase;}
.account-row span{font-family:monospace;letter-spacing:0.5px;color:#e2e8f0;}

.copy-btn{background:transparent;border:none;color:#93c5fd;cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:4px;transition:.2s;}
.copy-btn:hover{background:rgba(37,135,255,0.2);color:#fff;}
.copy-btn svg{width:16px;height:16px;fill:none;stroke-width:2;}
.copy-btn.copied{color:#4ade80;}

/* ===== ESTADOS ===== */
.state-box{padding:40px 20px;text-align:center;background:rgba(16,24,39,0.5);border:1px dashed rgba(255,255,255,0.1);border-radius:16px;}
.state-icon{width:60px;height:60px;margin:0 auto 16px;display:grid;place-items:center;background:rgba(37,135,255,0.1);border-radius:50%;font-size:24px;color:var(--blue);}
.state-box h3{margin:0 0 8px;font-size:16px;font-weight:800;color:#fff;}
.state-box p{max-width:280px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.5;}
.spinner{width:24px;height:24px;margin:0 auto 16px;border:2px solid rgba(37,135,255,0.2);border-top-color:var(--blue);border-radius:50%;animation:rotar .8s linear infinite;}
@keyframes rotar{to{transform:rotate(360deg)}}

/* ===== PAGINACIÓN ===== */
.pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;}
.page-btn{width:38px;height:38px;display:grid;place-items:center;background:rgba(16,24,39,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--blue-light);cursor:pointer;transition:.2s;}
.page-btn:hover:not(:disabled){background:rgba(37,135,255,0.2);border-color:var(--blue);}
.page-btn:disabled{opacity:.3;cursor:not-allowed;}
.page-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;}
.page-info{min-width:80px;text-align:center;color:var(--muted);font-size:12px;font-weight:600;}
.page-info strong{color:#fff;}

/* ===== NAV INFERIOR ===== */
.nav-inferior{position:fixed;left:0;right:0;bottom:0;z-index:999;background:rgba(5,7,13,0.98);border-top:1px solid rgba(255,255,255,0.05);padding-bottom:env(safe-area-inset-bottom);}
.nav-inferior-inner{display:flex;max-width:600px;margin:0 auto;height:var(--alto-nav);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#68758b;text-decoration:none;font-size:11px;font-weight:600;transition:color 0.2s;position:relative;}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
.nav-item.active{color:var(--gold);}
.nav-item.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--gold);border-radius:2px 2px 0 0;}
.nav-item.soporte{color:var(--green);}

/* Toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;background:#fff;color:#000;box-shadow:0 8px 25px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transition:all 0.3s ease;z-index:3000;white-space:nowrap;}
.toast.visible{opacity:1;visibility:visible;transform:translate(-50%,0);}

@media(max-width:380px){
    .stat-card{padding:8px 6px;gap:6px;}
    .stat-icon{width:32px;height:32px;}
    .stat-num{font-size:18px;}
    .stat-label{font-size:8px;}
    .order-num{font-size:18px;}
    .order-field-left{min-width:80px;font-size:12px;}
    .order-field-right{font-size:12px;}
}
</style>
</head>

function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);}
function firstValue(o,keys,fb=""){for(const k of keys){const v=o&&o[k];if(v!==undefined&&v!==null&&String(v).trim()!=="")return v;}return fb;}
function normalizeText(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}

function getOrderId(o,k){return String(firstValue(o,["numeroPedido","numero_pedido","orderNumber","orderId","pedidoId","pedido","numero","idPedido","id_pedido","id"],k));}
function getPlayerId(o){return String(firstValue(o,["id_jugador","idJugador","playerId","player_id","uid_jugador","uidJugador","idFreeFire","id_free_fire","id_usuario","idUsuario","gameId","game_id"],"No indicado"));}
function getNickname(o){return String(firstValue(o,["nombre_jugador","nombreJugador","nickname","nickName","nick","playerName","player_name","nombre_usuario","nombreUsuario","usuario_juego","usuarioJuego"],"No indicado"));}
function getProduct(o){return String(firstValue(o,["producto","product","nombreProducto","nombre_producto","nombre","descripcion","description","paquete","item"],"Producto no especificado"));}
function getReference(o){return String(firstValue(o,["referencia","reference","referenciaPago","referencia_pago","referencia_pago_movil","referenciaPagoMovil","ref","paymentReference","transactionReference","transaccion","transactionId"],"No indicada"));}
function getStatus(o){return String(firstValue(o,["estado","status","estadoPedido","estado_pedido","statusPedido","status_pedido"],"pendiente"));}
function getJuego(o){return String(firstValue(o,["juego","game","nombre_juego","nombreJuego"],"")).toUpperCase();}

// Funciones para cuentas de streaming
function getCorreoCuenta(o){return String(firstValue(o,["correo_cuenta","correo","email","usuario_cuenta","cuenta_correo","email_cuenta"],""));}
function getPassCuenta(o){return String(firstValue(o,["clave_cuenta","clave","password","pass","contrasena","cuenta_clave","pin"],""));}
function getPerfilCuenta(o){return String(firstValue(o,["perfil","perfil_cuenta","pin_perfil"],""));}

function classifyStatus(raw){
    const s = normalizeText(raw);
    if(s.includes("complet")||s.includes("exitos")||s.includes("entreg")||s.includes("finaliz")||s.includes("aprob")||s.includes("success")||s.includes("realizado"))
        return {type:"completado",label:"Completado",css:"status-success",icon:IC.checkCircle};
    if(s.includes("error")||s.includes("fall")||s.includes("rechaz")||s.includes("cancel")||s.includes("deneg")||s.includes("failed"))
        return {type:"error",label:"Con problemas",css:"status-error",icon:IC.clock};
    if(s.includes("pendient")||s.includes("verific")||s.includes("proceso")||s.includes("espera")||s.includes("procesando")||s.includes("validando")||s.includes("iniciado")||s.includes("payment"))
        return {type:"pendiente",label:"Pendiente",css:"status-pending",icon:IC.clock};
    return {type:"pendiente",label:raw||"Procesando",css:"status-neutral",icon:IC.refresh};
}

function getOrderTimestamp(o){
    const raw = firstValue(o,["fecha","createdAt","created_at","fecha_creacion","fechaCreacion","timestamp","time","created","date"],null);
    if(raw===null) return 0;
    if(typeof raw==="number") return raw<1000000000000?raw*1000:raw;
    if(typeof raw==="object"){if(typeof raw.seconds==="number")return raw.seconds*1000;if(typeof raw._seconds==="number")return raw._seconds*1000;}
    const p = Date.parse(raw); return Number.isNaN(p)?0:p;
}
function getSearchText(o){return normalizeText([getOrderId(o,o._key),getPlayerId(o),getNickname(o),getProduct(o),getReference(o),getStatus(o),getJuego(o),getCorreoCuenta(o)].join(" "));}

function getVisibleOrders(){
    const q = normalizeText(searchInput.value);
    return allOrders.filter(o=>{
        const st = classifyStatus(getStatus(o));
        const okF = currentFilter==="todos" || st.type===currentFilter;
        const okS = !q || getSearchText(o).includes(q);
        return okF && okS;
    });
}

function updateSummary(){
    const c = allOrders.filter(o=>classifyStatus(getStatus(o)).type==="completado").length;
    const p = allOrders.filter(o=>classifyStatus(getStatus(o)).type==="pendiente").length;
    const e = allOrders.filter(o=>classifyStatus(getStatus(o)).type==="error").length;
    $("#totalOrders").textContent = allOrders.length;
    $("#completedOrders").textContent = c;
    $("#pendingOrders").textContent = p;
    $("#countAll").textContent = allOrders.length;
    $("#countCompleted").textContent = c;
    $("#countPending").textContent = p;
    $("#countError").textContent = e;
}

function updateFilterButtons(){
    document.querySelectorAll(".filtro-btn").forEach(b=>{
        const a = b.dataset.filter===currentFilter;
        b.classList.toggle("activo",a);
    });
}

// 🎯 FUNCIÓN PARA LIMPIAR EL NOMBRE DEL PRODUCTO
function limpiarProducto(juego, producto) {
    if (!producto) return '';
    let limpio = producto;
    
    // Quitar el nombre del juego si está al inicio (ej: "FREE FIRE - ", "NETFLIX - ")
    if (juego) {
        const regexJuego = new RegExp(juego + '\\s*-\\s*', 'i');
        limpio = limpio.replace(regexJuego, '');
    }

    // Normalizaciones
    limpio = limpio.replace(/Diamantes/gi, '💎');
    limpio = limpio.replace(/Robux/gi, 'R$');
    // Si dice "Perfil Netflix", lo dejamos tal cual

    return limpio.trim();
}

// 🎯 FUNCIÓN PARA OBTENER LA IMAGEN DE FONDO SEGÚN EL JUEGO
function obtenerImagenFondo(juego) {
    const j = juego.toLowerCase();
    if (j.includes('free fire') || j.includes('freefire') || j.includes('ff')) return 'url("ff.png")';
    if (j.includes('mobile legends') || j.includes('mlbb') || j.includes('ml')) return 'url("ml.png")';
    if (j.includes('blood strike') || j.includes('bloodstrike')) return 'url("bloodstrike.png")';
    if (j.includes('roblox')) return 'url("roblox.png")';
    if (j.includes('netflix')) return 'url("netflix.png")';
    if (j.includes('spotify')) return 'url("spotify.png")';
    if (j.includes('disney')) return 'url("disney.png")';
    if (j.includes('pubg')) return 'url("pubg.png")';
    if (j.includes('cod') || j.includes('call of duty')) return 'url("cod.png")';
    if (j.includes('arena breakout')) return 'url("arena.png")';
    if (j.includes('delta force')) return 'url("delta.png")';
    if (j.includes('bigo')) return 'url("bigo.png")';
    return 'url("fondo-default.png")'; // Imagen por defecto si no coincide
}

function createOrderCard(o){
    const orderId = getOrderId(o,o._key);
    const playerId = getPlayerId(o);
    const nickname = getNickname(o);
    const product = getProduct(o);
    const reference = getReference(o);
    const status = classifyStatus(getStatus(o));
    const juego = getJuego(o);

    // Limpiamos el producto y obtenemos la imagen
    const productoLimpiado = limpiarProducto(juego, product);
    const bgImage = obtenerImagenFondo(juego);

    const sOrd = escapeHTML(orderId);
    const sPlayer = escapeHTML(playerId);
    const sNick = escapeHTML(nickname);
    const sProd = escapeHTML(productoLimpiado); // Usamos el producto limpio aquí
    const sRef = escapeHTML(reference);
    const sJuego = escapeHTML(juego);

    const isExpanded = currentPage === 1 && ordersList.children.length === 0;

    // Lógica para saber si es una cuenta (Netflix, Disney, etc)
    const prodLower = product.toLowerCase();
    const juegoLower = juego.toLowerCase();
    const esCuenta = prodLower.includes("netflix") || prodLower.includes("disney") || prodLower.includes("spotify") || prodLower.includes("hbo") || prodLower.includes("prime") || juegoLower.includes("netflix") || juegoLower.includes("disney") || juegoLower.includes("spotify") || juegoLower.includes("hbo") || juegoLower.includes("prime");
    
    const correo = getCorreoCuenta(o);
    const pass = getPassCuenta(o);
    const perfil = getPerfilCuenta(o);

    // Generar los campos según el tipo de producto
    let fieldsHTML = '';

    if (esCuenta) {
        // Render para cuentas (Streaming)
        fieldsHTML = `
            <div class="account-block">
                <div class="account-title">${IC.key} Datos de Acceso</div>
                ${correo ? `
                <div class="account-row">
                    <div style="display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;">${IC.mail} Correo</div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span>${escapeHTML(correo)}</span>
                        <button class="copy-btn" type="button" data-copy="${escapeHTML(correo)}" onclick="event.stopPropagation(); copyText(this.dataset.copy, this)">${IC.copy}</button>
                    </div>
                </div>` : ''}
                
                ${pass ? `
                <div class="account-row">
                    <div style="display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;">${IC.key} Contraseña</div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span>${escapeHTML(pass)}</span>
                        <button class="copy-btn" type="button" data-copy="${escapeHTML(pass)}" onclick="event.stopPropagation(); copyText(this.dataset.copy, this)">${IC.copy}</button>
                    </div>
                </div>` : ''}

                ${perfil ? `
                <div class="account-row">
                    <div style="display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;">Perfil</div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span>${escapeHTML(perfil)}</span>
                    </div>
                </div>` : ''}

                ${(!correo && !pass) ? `
                <div style="font-size:12px;color:#f5d76e;text-align:center;padding:10px;">
                    ⏳ Procesando asignación de cuenta...
                </div>` : ''}
            </div>
            <div class="order-field" style="margin-top:12px;">
                <div class="order-field-left">${IC.tag} Ref</div>
                <div class="order-field-right">
                    <span>${sRef}</span>
                    ${reference!=="No indicada"?`<button class="copy-btn" type="button" data-copy="${escapeHTML(reference)}" onclick="event.stopPropagation(); copyText(this.dataset.copy, this)">${IC.copy}</button>`:""}
                </div>
            </div>
        `;
    } else {
        // Render para juegos (Free Fire, Roblox, etc)
        fieldsHTML = `
            <div class="order-field">
                <div class="order-field-left">${IC.user} ID</div>
                <div class="order-field-right">${sPlayer}</div>
            </div>
            <div class="order-field">
                <div class="order-field-left">${IC.game} Nickname</div>
                <div class="order-field-right">${sNick}</div>
            </div>
            <div class="order-field">
                <div class="order-field-left">${IC.box} Producto</div>
                <div class="order-field-right">${sProd}</div>
            </div>
            <div class="order-field">
                <div class="order-field-left">${IC.tag} Ref</div>
                <div class="order-field-right">
                    <span>${sRef}</span>
                    ${reference!=="No indicada"?`<button class="copy-btn" type="button" data-copy="${escapeHTML(reference)}" onclick="event.stopPropagation(); copyText(this.dataset.copy, this)">${IC.copy}</button>`:""}
                </div>
            </div>
        `;
    }

    const card = document.createElement("article");
    card.className = `order-card ${isExpanded ? 'expanded' : ''}`;
    
    // 🎯 ASIGNAMOS LA IMAGEN DE FONDO DINÁMICAMENTE
    card.style.setProperty('--bg-image', bgImage);
    card.style.backgroundImage = `linear-gradient(180deg, rgba(16,24,39,0.95), rgba(11,16,27,0.98)), ${bgImage}`;
    card.style.backgroundSize = 'cover';
    card.style.backgroundPosition = 'center';
    
    card.innerHTML = `
        <div class="order-header" onclick="toggleCard(this)">
            <div class="order-num-wrap">
                <div>
                    <span class="order-num">#${sOrd}</span>
                    <span class="order-status ${status.css}">
                        ${status.icon} ${escapeHTML(status.label)}
                    </span>
                    <div class="order-info-preview">
                        ${sJuego ? sJuego + ' - ' : ''}${sProd}
                    </div>
                </div>
            </div>
            <div class="order-arrow">${IC.chevron}</div>
        </div>

        <div class="order-body">
            <div class="order-fields">
                ${fieldsHTML}
            </div>
        </div>
    `;
    return card;
}

window.toggleCard = function(header) {
    const card = header.parentElement;
    const isExpanded = card.classList.contains("expanded");
    
    if (isExpanded) {
        card.classList.remove("expanded");
    } else {
        card.classList.add("expanded");
    }
};

function renderOrders(){
    if(loadingOrders) return;
    updateSummary();
    updateFilterButtons();
    const filtered = getVisibleOrders();
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
    if(currentPage>totalPages) currentPage = totalPages;
    if(currentPage<1) currentPage = 1;
    const start = (currentPage-1)*PAGE_SIZE;
    const pageOrders = filtered.slice(start, start+PAGE_SIZE);

    if(allOrders.length===0){
        renderEmpty("Todavía no tienes pedidos","Cuando realices una compra en Recargas Games, aparecerá aquí.",true);
        $("#resultsText").textContent = "0 pedidos";
        return;
    }
    if(total===0){
        renderEmpty("No encontramos resultados","Prueba con otra búsqueda o un filtro diferente.");
        $("#resultsText").textContent = "0 resultados";
        return;
    }

    ordersList.innerHTML = "";
    pageOrders.forEach((o,i)=>{
        const c = createOrderCard(o);
        c.style.animation = `fadeInCard .3s ease ${Math.min(i*40,150)}ms both`;
        ordersList.appendChild(c);
    });

    $("#resultsText").textContent = `Mostrando ${total} pedido(s)`;
    pagination.hidden = totalPages<=1;
    $("#pageInfo").innerHTML = `Página <strong>${currentPage}</strong> de <strong>${totalPages}</strong>`;
    $("#prevPage").disabled = currentPage<=1;
    $("#nextPage").disabled = currentPage>=totalPages;
}

const styleAnim = document.createElement("style");
styleAnim.textContent = `@keyframes fadeInCard{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}`;
document.head.appendChild(styleAnim);

function showToast(msg,isError=false){
    toastEl.textContent = msg;
    toastEl.className = "toast visible" + (isError?" error":"");
    if(isError) toastEl.style.background = "#ff637b", toastEl.style.color = "#fff";
    else toastEl.style.background = "#fff", toastEl.style.color = "#000";
    
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove("visible"), 3000);
}

async function copyText(text,btn){
    try{
        if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else{
            const ta = document.createElement("textarea");
            ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand("copy");
            ta.remove(); if(!ok) throw new Error();
        }
        if(btn){
            const original = btn.innerHTML;
            btn.classList.add("copied");
            btn.innerHTML = IC.check;
            setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = original; },1500);
        }
        showToast("Copiado ✓");
    }catch{showToast("No se pudo copiar", true);}
}

function subscribeToOrders(){
    if(!currentUser) return;
    if(activeOrdersRef && ordersListener){ activeOrdersRef.off("value", ordersListener); }
    loadingOrders = true;
    renderLoading();
    activeOrdersRef = db.ref("pedidos").orderByChild("uid").equalTo(currentUser.uid);
    ordersListener = (snapshot)=>{
        allOrders = [];
        snapshot.forEach(child=>{
            const v = child.val();
            if(v && typeof v==="object") allOrders.push({...v, _key: child.key});
        });
        allOrders.sort((a,b)=>{
            const d = getOrderTimestamp(b)-getOrderTimestamp(a);
            if(d!==0) return d;
            return String(b._key).localeCompare(String(a._key),undefined,{numeric:true});
        });
        loadingOrders = false;
        currentPage = 1;
        renderOrders();
    };
    activeOrdersRef.on("value", ordersListener, (error)=>{
        loadingOrders = false;
        console.error("Error consultando pedidos:",error);
        if(error && error.code==="PERMISSION_DENIED") renderError("No tienes permiso para consultar estos pedidos.");
        else renderError("Comprueba tu conexión e inténtalo nuevamente.");
    });
}

// ===== EVENTOS UI =====
searchInput.addEventListener("input",()=>{
    currentPage = 1;
    clearSearch.style.display = searchInput.value ? "grid" : "none";
    renderOrders();
});
clearSearch.addEventListener("click",()=>{
    searchInput.value = ""; clearSearch.style.display = "none";
    currentPage = 1; searchInput.focus(); renderOrders();
});
document.querySelectorAll(".filtro-btn").forEach(b=>{
    b.addEventListener("click",()=>{ currentFilter = b.dataset.filter; currentPage = 1; renderOrders(); });
});
$("#prevPage").addEventListener("click",()=>{ if(currentPage>1){currentPage--;renderOrders();window.scrollTo({top:0,behavior:"smooth"});} });
$("#nextPage").addEventListener("click",()=>{ const tp = Math.ceil(getVisibleOrders().length/PAGE_SIZE); if(currentPage<tp){currentPage++;renderOrders();window.scrollTo({top:0,behavior:"smooth"});} });

// ===== AUTH =====
auth.onAuthStateChanged((user)=>{
    if(user){
        currentUser = user;
        subscribeToOrders();
    }else{
        loadingOrders = false;
        renderEmpty("Inicia sesión", "Necesitas iniciar sesión para ver tus pedidos.", false);
        $("#resultsText").textContent = "Sin sesión activa";
    }
});
