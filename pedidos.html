<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Pedidos - Recargas Games</title>
    <link rel="preload" href="fondo.mp4" as="video" type="video/mp4">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --alto-nav: 64px;
            --dorado-claro: #f5d76e;
            --card-bg: rgba(13, 22, 39, 0.85);
            --card-borde: rgba(30, 42, 69, 0.6);
            --azul-brillante: #4a7aff;
            --verde-brillante: #00d26a;
            --naranja: #f59e0b;
            --rojo: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            padding-top: 68px;
            padding-bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
        }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--dorado-claro);
            outline-offset: 2px;
        }

        .video-fondo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; pointer-events: none;
            opacity: 1; filter: brightness(1.15);
            transform: translateZ(0);
        }
        .video-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(180deg,
                rgba(10,14,26,0.15) 0%,
                rgba(10,14,26,0.35) 60%,
                rgba(10,14,26,0.6) 100%);
            z-index: -1; pointer-events: none;
        }

        /* TOPBAR */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            background: rgba(11, 18, 32, 0.92);
            border-bottom: 2px solid #3b82f6;
            padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .topbar .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; }
        .topbar .logo img { height: 36px; border-radius: 8px; }
        .topbar .logo h1 { font-size: 16px; font-weight: 700; color: white; }
        .topbar .logo h1 span { color: #3b82f6; }
        .topbar .btn-back {
            background: none; border: none; color: #cbd5e1;
            font-size: 13px; cursor: pointer; transition: 0.3s;
            padding: 6px 10px; border-radius: 7px; font-family: inherit;
        }
        .topbar .btn-back:hover { background: rgba(255,255,255,0.08); color: white; }

        .container { max-width: 900px; margin: 0 auto; padding: 10px; position: relative; z-index: 1; }

        /* HEADER */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
        }
        .page-header h2 { font-size: 20px; font-weight: 700; }
        .page-header h2 span { color: #3b82f6; }
        .page-header .total {
            font-size: 12px; color: #cbd5e1;
            background: rgba(14, 26, 58, 0.85);
            border: 1px solid var(--card-borde);
            padding: 4px 12px; border-radius: 18px;
        }

        /* CHIPS */
        .chips {
            display: flex; gap: 5px; overflow-x: auto;
            padding-bottom: 2px; margin-bottom: 8px;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 11px; border-radius: 18px;
            background: rgba(14, 26, 58, 0.75);
            border: 1px solid var(--card-borde);
            color: #cbd5e1; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.25s;
        }
        .chip .n {
            font-size: 10px; color: #94a3b8;
            background: rgba(255,255,255,0.08);
            padding: 1px 6px; border-radius: 9px;
        }
        .chip:hover { border-color: rgba(212, 175, 55, 0.5); color: var(--dorado-claro); }
        .chip.activo {
            color: var(--dorado-claro);
            background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(59,130,246,0.12));
            border-color: rgba(212,175,55,0.55);
        }

        /* BUSCADOR */
        .buscador { margin-bottom: 10px; }
        .buscador input {
            width: 100%; padding: 9px 13px;
            border-radius: 10px; background: rgba(6, 12, 32, 0.75);
            border: 1px solid var(--card-borde);
            color: white; font-size: 13px; font-family: inherit;
        }
        .buscador input::placeholder { color: #94a3b8; }
        .buscador input:focus { outline: none; border-color: #3b82f6; }

        .pedidos-list { display: flex; flex-direction: column; gap: 8px; }

        /* ═══════════════════════════════════════════════
           TARJETA DE PEDIDO COMPACTA
           ═══════════════════════════════════════════════ */
        .pedido-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            padding-bottom: 24px; /* 🆕 ESPACIO INFERIOR COMO EN EL DASHBOARD */
            border: 1px solid var(--card-borde);
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }
        .pedido-card:hover { border-color: #3b82f6; }
        .pedido-card.expandido {
            border-color: var(--dorado-claro);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }
        .pedido-card.est-cancelado { border-color: rgba(239, 68, 68, 0.45); }

        /* HEADER DE TARJETA */
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .pedido-header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        .pedido-id {
            font-size: 15px;
            font-weight: 700;
            color: var(--azul-brillante);
            white-space: nowrap;
        }
        .pedido-header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .pedido-precio {
            font-size: 16px;
            font-weight: 700;
            color: var(--verde-brillante);
        }
        .pedido-card.est-cancelado .pedido-precio { color: #8899b0; text-decoration: line-through; }

        /* BADGE DE ESTADO */
        .estado-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 12px;
            font-size: 10px; font-weight: 700;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .estado-badge::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
        }
        .estado-badge.completado { color: var(--verde-brillante); background: rgba(0, 210, 106, 0.15); border-color: rgba(0, 210, 106, 0.5); }
        .estado-badge.pendiente  { color: var(--naranja); background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.5); }
        .estado-badge.procesando { color: var(--azul-brillante); background: rgba(74, 122, 255, 0.15); border-color: rgba(74, 122, 255, 0.5); }
        .estado-badge.cancelado  { color: var(--rojo); background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); }

        /* BODY */
        .pedido-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }
        .pedido-producto {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .pedido-producto svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--azul-brillante);
            stroke-width: 2;
            flex-shrink: 0;
        }
        .pedido-fecha-inline {
            font-size: 11px;
            color: #8899b0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pedido-referencia {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #8899b0;
            background: rgba(17, 28, 50, 0.6);
            padding: 4px 8px;
            border-radius: 5px;
            word-break: break-all;
        }
        .pedido-referencia svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #8899b0;
            stroke-width: 2;
            flex-shrink: 0;
        }

        /* JUGADOR */
        .pedido-jugador-box {
            background: rgba(22, 34, 59, 0.6);
            border-radius: 6px;
            padding: 7px 10px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #cbd5e1;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .pedido-jugador-box strong { color: #fff; font-weight: 600; }
        .pedido-jugador-box span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        /* TIMELINE */
        .pedido-timeline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(30, 42, 69, 0.5);
        }
        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 65px;
            text-align: center;
        }
        .timeline-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2a45;
            color: #8899b0;
            transition: all 0.3s;
        }
        .timeline-icon svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }
        .timeline-step.recibido .timeline-icon { background: var(--azul-brillante); color: #fff; }
        .timeline-step.verificando .timeline-icon { background: var(--naranja); color: #fff; }
        .timeline-step.completado .timeline-icon { background: var(--verde-brillante); color: #fff; }
        .timeline-label {
            font-size: 10px;
            font-weight: 600;
            color: #8899b0;
        }
        .timeline-step.recibido .timeline-label,
        .timeline-step.verificando .timeline-label,
        .timeline-step.completado .timeline-label {
            color: #fff;
        }
        .timeline-line {
            flex: 1;
            height: 3px;
            background: #1e2a45;
            margin-top: -17px;
            border-radius: 2px;
            transition: background 0.3s;
        }
        .timeline-line.active { background: var(--azul-brillante); }
        .timeline-line.completed { background: var(--verde-brillante); }

        /* ═══════════════════════════════════════════════
           PANEL EXPANDIBLE (DETALLES)
           ═══════════════════════════════════════════════ */
        .detalle-expandido {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin 0.3s ease, padding 0.3s ease;
            background: rgba(10, 14, 26, 0.9);
            border-radius: 10px;
            margin-top: 0;
            padding: 0 14px;
            border: 1px solid transparent;
        }
        .pedido-card.expandido .detalle-expandido {
            max-height: 1500px;
            margin-top: 12px;
            padding: 14px;
            border-color: rgba(212, 175, 55, 0.3);
        }
        .detalle-expandido h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--dorado-claro);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 6px;
        }

        /* PIN BOX */
        .pin-box {
            margin-top: 8px;
            padding: 12px;
            background: rgba(34, 197, 94, 0.12);
            border: 1.5px solid #22c55e;
            border-radius: 8px;
            text-align: center;
        }
        .pin-box .pin-label {
            font-size: 10px;
            color: #cbd5e1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .pin-box .pin-value {
            font-size: 18px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 2px;
            margin: 6px 0;
            word-break: break-all;
            font-family: 'Courier New', Consolas, monospace;
        }
        .pin-box .btn-copiar {
            background: rgba(34, 197, 94, 0.25);
            color: #4ade80;
            border: none;
            padding: 7px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .pin-box .btn-copiar:hover { background: rgba(34, 197, 94, 0.4); }

        /* STREAMING BOX */
        .streaming-box {
            margin-top: 8px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.1), rgba(17, 60, 207, 0.08));
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
        }
        .streaming-box .streaming-titulo {
            font-size: 13px;
            font-weight: 800;
            color: var(--dorado-claro);
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dato-entrega {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 9px 11px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            margin-bottom: 7px;
        }
        .dato-entrega:last-of-type { margin-bottom: 0; }
        .dato-entrega .dato-label {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .dato-entrega .dato-contenido {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dato-entrega .dato-valor {
            flex: 1;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-family: 'Courier New', Consolas, monospace;
            line-height: 1.3;
        }
        .dato-entrega .btn-copiar-dato {
            width: 34px;
            height: 34px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            color: var(--dorado-claro);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
            font-family: inherit;
        }
        .dato-entrega .btn-copiar-dato svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .dato-entrega .btn-copiar-dato:hover { background: rgba(212, 175, 55, 0.3); }
        .dato-entrega .btn-copiar-dato.copiado {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.6);
            color: #4ade80;
        }
        .dato-entrega .btn-copiar-dato.copiado svg { display: none; }
        .dato-entrega .btn-copiar-dato.copiado::after { content: '✓'; font-size: 18px; font-weight: bold; }

        .dato-entrega.codigo-renovacion {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.55);
            border-width: 1.5px;
        }
        .dato-entrega.codigo-renovacion .dato-label { color: var(--dorado-claro); }
        .dato-entrega.codigo-renovacion .dato-valor { color: var(--dorado-claro); font-weight: 800; }

        .aviso-renovacion {
            margin-top: 6px;
            font-size: 10px;
            color: #fcd34d;
            text-align: center;
            line-height: 1.3;
        }

        .ayuda-streaming {
            display: block;
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #cbd5e1;
            text-decoration: underline;
        }
        .ayuda-streaming:hover { color: var(--dorado-claro); }

        /* MANUAL BOX */
        .manual-box {
            margin-top: 8px;
            padding: 10px;
            background: rgba(37, 211, 102, 0.12);
            border: 1.5px solid #25D366;
            border-radius: 8px;
            text-align: center;
        }
        .manual-box .manual-text { font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
        .manual-box .btn-whatsapp {
            background: #25D366;
            color: #06210f;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
        }

        .aviso-estado {
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 7px;
            font-size: 11px;
            line-height: 1.35;
            border: 1px solid transparent;
        }
        .aviso-estado.cancelado  { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

        /* ACCIONES */
        .acciones {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-accion {
            flex: 1;
            min-width: 100px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid transparent;
        }
        .btn-accion.dorado {
            color: var(--dorado-claro);
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.55);
        }
        .btn-accion.dorado:hover { background: rgba(212, 175, 55, 0.25); }
        .btn-accion.wa { color: #4ade80; background: transparent; border-color: rgba(37, 211, 102, 0.6); }
        .btn-accion.wa:hover { background: rgba(37, 211, 102, 0.15); }

        /* SIN PEDIDOS / LOADING */
        .sin-pedidos {
            text-align: center;
            padding: 32px 16px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-borde);
        }
        .sin-pedidos .icono { font-size: 40px; margin-bottom: 10px; }
        .sin-pedidos h3 { font-size: 17px; margin-bottom: 5px; }
        .sin-pedidos p { color: #cbd5e1; font-size: 13px; line-height: 1.4; }
        .sin-pedidos .btn-tienda {
            display: inline-block;
            margin-top: 12px;
            padding: 9px 22px;
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            color: #0a0e1a;
            border: none;
            border-radius: 9px;
            font-weight: 800;
            font-size: 13px;
            text-decoration: none;
        }

        .loading { text-align: center; padding: 24px; color: #94a3b8; }
        .loading .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            max-width: calc(100% - 32px);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(10, 14, 26, 0.97);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 3000;
            text-align: center;
        }
        .toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* NOTIFICACIÓN FLOTANTE PEDIDO NUEVO */
        .notif-pedido {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            max-width: calc(100% - 32px);
            width: 380px;
            padding: 14px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.95), rgba(22, 163, 74, 0.95));
            border: 2px solid #4ade80;
            box-shadow: 0 20px 60px rgba(34, 197, 94, 0.5), 0 0 40px rgba(34, 197, 94, 0.3);
            color: #fff;
            z-index: 5000;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }
        .notif-pedido.visible { transform: translateX(-50%) translateY(0); }
        .notif-pedido .notif-icono {
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
            animation: latido 1s ease-in-out infinite;
        }
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .notif-pedido .notif-texto { flex: 1; min-width: 0; }
        .notif-pedido .notif-titulo {
            font-size: 14px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .notif-pedido .notif-sub {

        /* NAV INFERIOR */

<body>

    <div class="buscador">

    <div class="pedidos-list" id="listaPedidos" aria-live="polite">

            <p>Cargando tus pedidos...</p>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="nav-inferior" aria-label="Navegación principal">

        <a href="index.html#juegos" class="nav-item">

        <a href="https://wa.me/584228242411" class="nav-item soporte" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>
            Soporte
        </a>
    </div>
</nav>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092",
        measurementId: "G-5NLLLEPWPK"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const WHATSAPP = '584228242411';

    let todosPedidos = [];
    let uidActual = null;
    let consultaActual = null;
    let estadoFiltro = 'todos';
    let toastTimer = null;
    let pedidosVistos = new Set();
    let primeraCarga = true;

    const listaEl = document.getElementById('listaPedidos');
    const buscarEl = document.getElementById('buscarInput');
    const toastEl = document.getElementById('toast');

    function esc(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function avisar(mensaje) {
        toastEl.textContent = mensaje;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 3000);
    }

    function mostrarNotifPedido(pedido) {
        const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || 'N/A';
        const juego = pedido.juego || 'Producto';
        const producto = pedido.producto || '';

        const notif = document.createElement('div');
        notif.className = 'notif-pedido';
        notif.innerHTML = `
            <div class="notif-icono">🎉</div>
            <div class="notif-texto">
                <div class="notif-titulo">¡Pedido #${esc(idPedido)} creado!</div>
                <div class="notif-sub">${esc(juego)}${producto ? ' - ' + esc(producto) : ''}</div>
            </div>
            <button class="notif-cerrar" aria-label="Cerrar">✕</button>
        `;

        document.body.appendChild(notif);
        requestAnimationFrame(() => notif.classList.add('visible'));

        const btnCerrar = notif.querySelector('.notif-cerrar');
        btnCerrar.onclick = () => cerrarNotif(notif);
        setTimeout(() => cerrarNotif(notif), 6000);

        reproducirSonido();
        vibrar();
    }

    function cerrarNotif(notif) {
        if (!notif || !notif.parentNode) return;
        notif.classList.remove('visible');
        setTimeout(() => {
            if (notif.parentNode) notif.parentNode.removeChild(notif);
        }, 500);
    }

    function reproducirSonido() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const notas = [523.25, 659.25, 783.99];
            notas.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                const t = ctx.currentTime + (i * 0.1);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                osc.start(t);
                osc.stop(t + 0.4);
            });
            setTimeout(() => { try { ctx.close(); } catch(e) {} }, 1000);
        } catch(e) {}
    }

    function vibrar() {
        if (navigator.vibrate) {
            try { navigator.vibrate([200, 100, 200]); } catch(e) {}
        }
    }

    function normalizarEstado(raw) {
        const e = String(raw || 'pendiente').toLowerCase().trim();
        if (['completado', 'completada', 'completed', 'completada_ok'].includes(e)) return 'completado';
        if (['cancelado', 'cancelada', 'cancelled', 'canceled'].includes(e)) return 'cancelado';
        if (['procesando', 'processing'].includes(e)) return 'procesando';
        return 'pendiente';
    }

    document.getElementById('btnVolver').addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
    });

    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        uidActual = user.uid;
        cargarPedidos();
    });

    function cargarPedidos() {
        if (consultaActual) consultaActual.off();
        consultaActual = db.ref('pedidos').orderByChild('uid').equalTo(uidActual);

        consultaActual.on('value', (snapshot) => {
            const nuevosPedidos = [];
            const idsActuales = new Set();

            snapshot.forEach((childSnapshot) => {
                const pedido = childSnapshot.val();
                pedido.key = childSnapshot.key;
                pedido._estado = normalizarEstado(pedido.estado);
                nuevosPedidos.push(pedido);
                idsActuales.add(childSnapshot.key);
            });

            if (!primeraCarga) {
                nuevosPedidos.forEach((p) => {
                    if (!pedidosVistos.has(p.key)) mostrarNotifPedido(p);
                });
            }

            pedidosVistos = idsActuales;
            primeraCarga = false;

            nuevosPedidos.sort((a, b) => {
                if (a.fecha && b.fecha) return new Date(b.fecha) - new Date(a.fecha);
                return 0;
            });

            todosPedidos = nuevosPedidos;
            actualizarContadores();
            filtrarPedidos();

        }, (error) => {
            console.error('Error cargando pedidos:', error);
            listaEl.innerHTML = `
                <div class="sin-pedidos">
                    <div class="icono">⚠️</div>
                    <h3>No pudimos cargar tus pedidos</h3>
                    <p>Revisa tu conexión e intenta de nuevo.</p>
                    <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener" class="btn-tienda">Contactar soporte</a>
                </div>
            `;
        });
    }

    function actualizarContadores() {
        const cuentas = { todos: todosPedidos.length, completado: 0, pendiente: 0, procesando: 0, cancelado: 0 };
        todosPedidos.forEach((p) => { cuentas[p._estado]++; });
        Object.keys(cuentas).forEach((k) => {
            document.getElementById('n-' + k).textContent = cuentas[k];
        });
        document.getElementById('totalPedidos').textContent =
            `${todosPedidos.length} ${todosPedidos.length === 1 ? 'pedido' : 'pedidos'}`;
    }

    function filtrarPedidos() {
        const busqueda = buscarEl.value.toLowerCase().trim();
        let filtrados = todosPedidos;

        if (estadoFiltro !== 'todos') {
            filtrados = filtrados.filter((p) => p._estado === estadoFiltro);
        }

        if (busqueda) {
            filtrados = filtrados.filter((p) => {
                const id = String(p.referencia || p.key || '').toLowerCase();
                const juego = String(p.juego || p.producto || '').toLowerCase();
                const ref = String(p.referencia_pago || '').toLowerCase();
                return id.includes(busqueda) || juego.includes(busqueda) || ref.includes(busqueda);
            });
        }

        mostrarPedidos(filtrados);
    }

    function formatearFecha(valor) {
        if (!valor) return 'Sin fecha';
        const fecha = new Date(valor);
        if (isNaN(fecha.getTime())) return String(valor);
        return fecha.toLocaleString('es-VE', {
            day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
    }

    function formatearMonto(valor) {
        const n = parseFloat(valor);
        return isNaN(n) ? '0.00' : n.toFixed(2);
    }

    const ICONOS = {
        caja: `<svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>`,
        ref: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
        check: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
        lupa: `<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
        copiar: `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`
    };

    function mostrarPedidos(pedidos) {
        if (pedidos.length === 0) {
            const sinNinguno = todosPedidos.length === 0;
            listaEl.innerHTML = `
                <div class="sin-pedidos">
                    <div class="icono">📭</div>
                    <h3>${sinNinguno ? 'Aún no tienes pedidos' : 'No encontramos pedidos'}</h3>
                    <p>${sinNinguno
                        ? 'Cuando hagas tu primera recarga, aparecerá aquí.'
                        : 'Prueba con otro estado o cambia la búsqueda.'}</p>
                    ${sinNinguno ? '<a href="index.html" class="btn-tienda">Elegir un juego</a>' : ''}
                </div>
            `;
            return;
        }

        let html = '';

        pedidos.forEach((pedido) => {
            const estado = pedido._estado;
            const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || pedido.key || 'N/A';
            const juego = pedido.juego || 'Producto';
            const producto = pedido.producto || '';
            const monto = formatearMonto(pedido.monto_usd || pedido.monto);
            const metodo = pedido.metodo || 'Pago Móvil';
            const idJugador = pedido.id_jugador || pedido.player_id || 'No especificado';
            const nombreJugador = pedido.nombre_jugador || pedido.player_name || 'No especificado';

            let stepRecibido = 'recibido';
            let stepVerificando = '';
            let stepCompletado = '';
            let line1 = 'active';
            let line2 = '';

            if (estado === 'completado') {
                stepVerificando = 'verificando';
                stepCompletado = 'completado';
                line1 = 'completed';
                line2 = 'completed';
            } else if (estado === 'procesando') {
                stepVerificando = 'verificando';
            } else if (estado === 'cancelado') {
                stepRecibido = ''; stepVerificando = ''; stepCompletado = '';
                line1 = ''; line2 = '';
            }

            const timelineHtml = estado === 'cancelado' ? '' : `
                <div class="pedido-timeline">
                    <div class="timeline-step ${stepRecibido}">
                        <div class="timeline-icon">${ICONOS.check}</div>
                        <div class="timeline-label">Recibido</div>
                    </div>
                    <div class="timeline-line ${line1}"></div>
                    <div class="timeline-step ${stepVerificando}">
                        <div class="timeline-icon">${ICONOS.lupa}</div>
                        <div class="timeline-label">Verificado</div>
                    </div>
                    <div class="timeline-line ${line2}"></div>
                    <div class="timeline-step ${stepCompletado}">
                        <div class="timeline-icon">${ICONOS.check}</div>
                        <div class="timeline-label">Entregado</div>
                    </div>
                </div>
            `;

            let jugadorHtml = '';
            if (idJugador !== 'No especificado' || nombreJugador !== 'No especificado') {
                jugadorHtml = `
                    <div class="pedido-jugador-box">
                        ${idJugador !== 'No especificado' ? `<span><strong>ID:</strong> ${esc(idJugador)}</span>` : ''}
                        ${nombreJugador !== 'No especificado' ? `<span><strong>Nombre:</strong> ${esc(nombreJugador)}</span>` : ''}
                    </div>
                `;
            }

            const esStreaming = pedido.es_streaming === true ||
                                (pedido.datos_streaming && (pedido.datos_streaming.correo || pedido.datos_streaming.clave));

            let detalleInterno = '';

            if (!esStreaming && estado !== 'cancelado' && (pedido.pin || (pedido.codigos && pedido.codigos.length > 0))) {
                const pinValue = pedido.pin || pedido.codigos[0];
                const etiqueta = juego.toUpperCase().includes('ROBLOX') ? 'Tu PIN de Roblox' : 'Tu código';
                detalleInterno += `
                    <div class="pin-box">
                        <div class="pin-label">${etiqueta}</div>
                        <div class="pin-value">${esc(pinValue)}</div>
                        <button class="btn-copiar" data-pin="${esc(pinValue)}">Copiar</button>
                    </div>
                `;
            }

            if (esStreaming && estado !== 'cancelado' && pedido.datos_streaming) {
                const d = pedido.datos_streaming;
                const codAprob = pedido.codigo_aprobacion || '';
                const tieneValor = (v) => v !== undefined && v !== null && String(v).trim() !== '';

                let camposHtml = '';
                const agregarDato = (label, valor, clase = '') => {
                    if (!tieneValor(valor)) return '';
                    const v = esc(valor);
                    return `
                        <div class="dato-entrega ${clase}">
                            <div class="dato-label">${label}</div>
                            <div class="dato-contenido">
                                <div class="dato-valor">${v}</div>
                                <button class="btn-copiar-dato" data-copiar="${v}" aria-label="Copiar ${label}">
                                    ${ICONOS.copiar}
                                </button>
                            </div>
                        </div>
                    `;
                };

                camposHtml += agregarDato('📧 CORREO', d.correo);
                camposHtml += agregarDato('🔑 CONTRASEÑA', d.clave);
                camposHtml += agregarDato('👤 PERFIL', d.perfil);
                camposHtml += agregarDato('🔢 PIN DEL PERFIL', d.pin_perfil);
                camposHtml += agregarDato('📅 VENCE', d.fecha_vencimiento);
                if (tieneValor(codAprob)) {
                    camposHtml += agregarDato('🎟️ CÓDIGO DE RENOVACIÓN', codAprob, 'codigo-renovacion');
                    camposHtml += `<div class="aviso-renovacion">⚠️ Guarda este código. Lo necesitarás para renovar.</div>`;
                }

                if (camposHtml) {
                    const titulo = d.perfil ? '🎬 Datos del perfil' : '🎬 Datos de la cuenta';
                    const mensajeAyuda = `Hola, necesito ayuda con mi pedido ${idPedido}`;
                    detalleInterno += `
                        <div class="streaming-box">
                            <div class="streaming-titulo">${titulo}</div>
                            ${camposHtml}
                            <a class="ayuda-streaming" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensajeAyuda)}" target="_blank" rel="noopener">
                                ¿Problemas para entrar? Escríbenos
                            </a>
                        </div>
                    `;
                }
            } else if (esStreaming && estado !== 'cancelado') {
                const mensaje = `Hola, necesito los datos de mi pedido ${idPedido}`;
                detalleInterno += `
                    <div class="manual-box">
                        <div class="manual-text">⚠️ Este pedido requiere entrega manual. Contáctanos.</div>
                        <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}" target="_blank" rel="noopener" class="btn-whatsapp">
                            Pedir mi entrega por WhatsApp
                        </a>
                    </div>
                `;
            }

            if (!esStreaming && estado !== 'cancelado') {
                const esManual = (pedido.metodo_pago === 'MANUAL') ||
                                 (pedido.paquete && String(pedido.paquete).startsWith('manual_'));
                if (esManual) {
                    detalleInterno += `
                        <div class="manual-box">
                            <div class="manual-text">Este producto se entrega de forma manual.</div>
                            <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, necesito mi pedido ' + idPedido)}" target="_blank" rel="noopener" class="btn-whatsapp">
                                Pedir mi entrega
                            </a>
                        </div>
                    `;
                }
            }

            if (estado === 'cancelado') {
                const motivo = pedido.motivo_cancelacion || pedido.motivo || 'No pudimos verificar el pago.';
                detalleInterno += `
                    <div class="aviso-estado cancelado">${esc(motivo)}</div>
                    <div class="acciones">
                        <a class="btn-accion dorado" href="index.html">Reintentar</a>
                        <a class="btn-accion wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, mi pedido ' + idPedido + ' fue cancelado')}" target="_blank" rel="noopener">Soporte</a>
                    </div>
                `;
            }

            html += `
                <article class="pedido-card est-${estado}" data-pedido-key="${esc(pedido.key)}">
                    <div class="pedido-header">
                        <div class="pedido-header-left">
                            <span class="pedido-id">#${esc(idPedido)}</span>
                            <span class="estado-badge ${estado}">${estado.charAt(0).toUpperCase() + estado.slice(1)}</span>
                        </div>
                        <div class="pedido-header-right">
                            <span class="pedido-precio">$${esc(monto)}</span>
                        </div>
                    </div>

                    <div class="pedido-body">
                        <div class="pedido-producto">
                            ${ICONOS.caja}
                            <span>${esc(juego)}${producto ? ' · ' + esc(producto) : ''}</span>
                        </div>
                        <div class="pedido-fecha-inline">
                            📅 ${esc(formatearFecha(pedido.fecha))} · 💳 ${esc(metodo)}
                        </div>
                        <div class="pedido-referencia">
                            ${ICONOS.ref}
                            ${esc(pedido.referencia_pago || 'N/A')}
                        </div>
                    </div>

                    ${jugadorHtml}
                    ${timelineHtml}

                    <div class="detalle-expandido">
                        <h4>📋 Detalles del Pedido</h4>
                        ${detalleInterno}
                    </div>
                </article>
            `;
        });

        listaEl.innerHTML = html;
    }

    listaEl.addEventListener('click', (e) => {
        if (e.target.closest('.btn-copiar') || e.target.closest('.btn-copiar-dato')) return;
        const card = e.target.closest('.pedido-card');
        if (!card) return;
        card.classList.toggle('expandido');
    });

    listaEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-copiar');
        if (!btn) return;
        e.stopPropagation();
        const pin = btn.dataset.pin;
        if (!pin) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pin)
                .then(() => avisar('✓ Copiado al portapapeles'))
                .catch(() => avisar('No se pudo copiar'));
        } else {
            avisar('Mantén presionado para copiar');
        }
    });

    listaEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-copiar-dato');
        if (!btn) return;
        e.stopPropagation();
        const texto = btn.dataset.copiar;
        if (!texto) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(texto)
                .then(() => {
                    btn.classList.add('copiado');
                    setTimeout(() => btn.classList.remove('copiado'), 1500);
                    avisar('✓ Copiado');
                })
                .catch(() => avisar('No se pudo copiar'));
        } else {
            avisar('Mantén presionado para copiar');
        }
    });

    document.getElementById('chips').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        estadoFiltro = chip.dataset.estado;
        document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c === chip));
        filtrarPedidos();
    });

    buscarEl.addEventListener('input', filtrarPedidos);
</script>

</body>
</html>
