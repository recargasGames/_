<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Pedidos - Recargas Games</title>
    <link rel="preload" href="fondo.mp4" as="video" type="video/mp4">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --alto-nav: 64px;
            --dorado-claro: #f5d76e;
            --panel-bg: rgba(8, 13, 26, 0.88);
            --card-bg: rgba(12, 18, 34, 0.92);
            --card-borde: rgba(255, 255, 255, 0.1);
            --azul-brillante: #3b6dff;
            --verde-brillante: #10b981;
            --verde-precio: #14c58a;
            --naranja: #f59e0b;
            --rojo: #ef4444;
            --muted: #9aa8c2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            padding-top: 68px;
            padding-bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
        }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--dorado-claro);
            outline-offset: 2px;
        }

        .video-fondo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; pointer-events: none;
            opacity: 1; filter: brightness(1.15);
            transform: translateZ(0);
        }
        .video-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(180deg,
                rgba(10,14,26,0.15) 0%,
                rgba(10,14,26,0.35) 60%,
                rgba(10,14,26,0.6) 100%);
            z-index: -1; pointer-events: none;
        }

        /* TOPBAR */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            background: rgba(11, 18, 32, 0.92);
            border-bottom: 2px solid #3b82f6;
            padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .topbar .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; }
        .topbar .logo img { height: 34px; border-radius: 8px; }
        .topbar .logo h1 { font-size: 15px; font-weight: 700; color: white; }
        .topbar .logo h1 span { color: #3b82f6; }
        .topbar .btn-back {
            background: none; border: none; color: #cbd5e1;
            font-size: 13px; cursor: pointer; transition: 0.3s;
            padding: 6px 10px; border-radius: 7px; font-family: inherit;
        }
        .topbar .btn-back:hover { background: rgba(255,255,255,0.08); color: white; }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 14px 14px 0;
            position: relative;
            z-index: 1;
        }

        /* TARJETAS DE RESUMEN */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat {
            background: rgba(10, 16, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 12px 6px 10px;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .stat.azul { border-color: rgba(59, 109, 255, 0.55); }
        .stat-icono {
            width: 38px; height: 38px;
            border-radius: 11px;
            margin: 0 auto 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icono svg { width: 19px; height: 19px; fill: #fff; }
        .stat.azul .stat-icono { background: linear-gradient(135deg, #3b6dff, #5b8cff); }
        .stat.naranja .stat-icono { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .stat.verde .stat-icono { background: linear-gradient(135deg, #10b981, #14d9a0); }
        .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
        .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

        /* PANEL */
        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .panel-header {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 20px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel-header svg { width: 22px; height: 22px; fill: var(--azul-brillante); flex-shrink: 0; }
        .panel-header h2 { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
        .panel-body { padding: 14px; }

        /* CHIPS */
        .chips {
            display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 2px; margin-bottom: 10px;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 12px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-borde);
            color: #cbd5e1; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.25s;
        }
        .chip .n {
            font-size: 10px; color: #94a3b8;
            background: rgba(255,255,255,0.08);
            padding: 1px 6px; border-radius: 8px;
        }
        .chip:hover { border-color: rgba(212, 175, 55, 0.5); color: var(--dorado-claro); }
        .chip.activo {
            color: var(--dorado-claro);
            background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(59,130,246,0.12));
            border-color: rgba(212,175,55,0.55);
        }

        /* BUSCADOR */
        .buscador { margin-bottom: 12px; }
        .buscador input {
            width: 100%; padding: 10px 14px;
            border-radius: 12px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-borde);
            color: white; font-size: 13px; font-family: inherit;
        }
        .buscador input::placeholder { color: #94a3b8; }
        .buscador input:focus { outline: none; border-color: var(--azul-brillante); }

        .pedidos-list { display: flex; flex-direction: column; gap: 14px; }

        /* TARJETA DE PEDIDO */
        .pedido-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 16px 14px;
            border: 1px solid var(--card-borde);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }
        .pedido-card:hover { border-color: rgba(59, 109, 255, 0.6); }
        .pedido-card.expandido {
            border-color: var(--dorado-claro);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }
        .pedido-card.est-cancelado { border-color: rgba(239, 68, 68, 0.45); }

        .pedido-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px 12px;
            margin-bottom: 14px;
        }
        .pedido-header-left, .pedido-header-right {
            display: inline-flex;
            align-items: center;
            gap: 8px 10px;
        }
        .pedido-id {
            font-size: 18px;
            font-weight: 800;
            color: var(--azul-brillante);
            white-space: nowrap;
        }
        .pedido-fecha-inline {
            font-size: 12px;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .pedido-fecha-inline svg, .pedido-metodo svg {
            width: 13px; height: 13px; fill: var(--muted); flex-shrink: 0;
        }
        .pedido-precio {
            font-size: 18px;
            font-weight: 800;
            color: var(--verde-precio);
            line-height: 1;
        }
        .pedido-metodo {
            font-size: 12px;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }
        .pedido-card.est-cancelado .pedido-precio { color: var(--muted); text-decoration: line-through; }

        .estado-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 11px;
            font-size: 10px; font-weight: 700;
            border: 1px solid transparent;
            white-space: nowrap;
            margin-left: auto;
        }
        .estado-badge::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
        }
        .estado-badge.completado { color: var(--verde-brillante); background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.5); }
        .estado-badge.pendiente  { color: var(--naranja); background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.5); }
        .estado-badge.procesando { color: #6b93ff; background: rgba(59, 109, 255, 0.15); border-color: rgba(59, 109, 255, 0.5); }
        .estado-badge.cancelado  { color: var(--rojo); background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); }

        .pedido-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .pedido-producto {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            flex-wrap: wrap;
        }
        .pedido-producto > svg {
            width: 18px; height: 18px;
            fill: var(--azul-brillante);
            flex-shrink: 0;
        }
        .pedido-referencia {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 7px 12px;
            border-radius: 9px;
            word-break: break-all;
        }
        .pedido-referencia svg { width: 14px; height: 14px; fill: var(--azul-brillante); flex-shrink: 0; }

        .pedido-jugador-box {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.4;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pedido-jugador-box strong { color: #fff; font-weight: 700; }
        .pedido-jugador-box span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .pedido-timeline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding-top: 4px;
        }
        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 78px;
            text-align: center;
        }
        .timeline-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2a45;
            color: #8899b0;
            transition: all 0.3s;
        }
        .timeline-icon svg { width: 17px; height: 17px; fill: currentColor; }
        .timeline-step.recibido .timeline-icon,
        .timeline-step.verificando .timeline-icon,
        .timeline-step.completado .timeline-icon { background: var(--verde-brillante); color: #fff; }
        .timeline-step.espera .timeline-icon { background: var(--naranja); color: #fff; }
        .timeline-label {
            font-size: 12px;
            font-weight: 700;
            color: #8899b0;
        }
        .timeline-step.recibido .timeline-label,
        .timeline-step.verificando .timeline-label,
        .timeline-step.completado .timeline-label,
        .timeline-step.espera .timeline-label { color: #fff; }
        .timeline-line {
            flex: 1;
            height: 3px;
            background: #1e2a45;
            margin-top: 15px;
            border-radius: 2px;
            transition: background 0.3s;
        }
        .timeline-line.active, .timeline-line.completed { background: var(--azul-brillante); }

        .aviso-tocar {
            text-align: center;
            font-size: 11px;
            color: var(--dorado-claro);
            padding-top: 10px;
            margin-top: 12px;
            border-top: 1px dashed rgba(212, 175, 55, 0.25);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .pedido-card.expandido .aviso-tocar { color: #94a3b8; }

        .detalle-expandido {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin 0.3s ease, padding 0.3s ease;
            background: rgba(10, 14, 26, 0.9);
            border-radius: 12px;
            margin-top: 0;
            padding: 0 10px;
            border: 1px solid transparent;
        }
        .pedido-card.expandido .detalle-expandido {
            max-height: 1500px;
            margin-top: 12px;
            padding: 12px 10px;
            border-color: rgba(212, 175, 55, 0.3);
        }
        .detalle-expandido h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--dorado-claro);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 6px;
            text-align: center;
        }

        .pin-box {
            margin-top: 6px;
            padding: 11px;
            background: rgba(34, 197, 94, 0.12);
            border: 1.5px solid #22c55e;
            border-radius: 10px;
            text-align: center;
        }
        .pin-box .pin-label { font-size: 10px; color: #cbd5e1; letter-spacing: 1px; text-transform: uppercase; }
        .pin-box .pin-value {
            font-size: 16px; font-weight: 700; color: #4ade80;
            letter-spacing: 1.5px; margin: 6px 0; word-break: break-all;
            font-family: 'Courier New', Consolas, monospace;
        }
        .pin-box .btn-copiar {
            background: rgba(34, 197, 94, 0.25); color: #4ade80; border: none;
            padding: 6px 18px; border-radius: 7px; font-weight: 700;
            cursor: pointer; font-size: 12px; font-family: inherit;
        }
        .pin-box .btn-copiar:hover { background: rgba(34, 197, 94, 0.4); }

        .streaming-box {
            margin-top: 6px;
            padding: 11px;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.1), rgba(17, 60, 207, 0.08));
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
        }
        .streaming-box .streaming-titulo {
            font-size: 12px; font-weight: 800; color: var(--dorado-claro);
            text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px;
        }
        .dato-entrega {
            display: flex; flex-direction: column; gap: 3px;
            padding: 9px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px; margin-bottom: 6px;
        }
        .dato-entrega:last-of-type { margin-bottom: 0; }
        .dato-entrega .dato-label { font-size: 10px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
        .dato-entrega .dato-contenido { display: flex; align-items: center; gap: 6px; }
        .dato-entrega .dato-valor {
            flex: 1; font-size: 13px; font-weight: 700; color: #fff;
            word-break: break-word; overflow-wrap: anywhere;
            font-family: 'Courier New', Consolas, monospace; line-height: 1.3;
        }
        .dato-entrega .btn-copiar-dato {
            width: 30px; height: 30px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 7px; color: var(--dorado-claro); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; padding: 0; font-family: inherit;
        }
        .dato-entrega .btn-copiar-dato svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; }
        .dato-entrega .btn-copiar-dato:hover { background: rgba(212, 175, 55, 0.3); }
        .dato-entrega .btn-copiar-dato.copiado { background: rgba(34, 197, 94, 0.25); border-color: rgba(34, 197, 94, 0.6); color: #4ade80; }
        .dato-entrega .btn-copiar-dato.copiado svg { display: none; }
        .dato-entrega .btn-copiar-dato.copiado::after { content: '✓'; font-size: 15px; font-weight: bold; }

        .dato-entrega.codigo-renovacion { background: rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.55); border-width: 1.5px; }
        .dato-entrega.codigo-renovacion .dato-label { color: var(--dorado-claro); }
        .dato-entrega.codigo-renovacion .dato-valor { color: var(--dorado-claro); font-weight: 800; }

        .aviso-renovacion { margin-top: 6px; font-size: 10px; color: #fcd34d; text-align: center; line-height: 1.3; }

        .ayuda-streaming { display: block; margin-top: 9px; text-align: center; font-size: 11px; color: #cbd5e1; text-decoration: underline; }
        .ayuda-streaming:hover { color: var(--dorado-claro); }

        .manual-box {
            margin-top: 6px; padding: 11px;
            background: rgba(37, 211, 102, 0.12);
            border: 1.5px solid #25D366; border-radius: 10px; text-align: center;
        }
        .manual-box .manual-text { font-size: 12px; color: #cbd5e1; margin-bottom: 7px; }
        .manual-box .btn-whatsapp {
            background: #25D366; color: #06210f; border: none;
            padding: 7px 16px; border-radius: 7px; font-weight: 800;
            text-decoration: none; display: inline-block; font-size: 12px;
        }

        .aviso-estado {
            margin-top: 6px; padding: 8px 10px; border-radius: 8px;
            font-size: 12px; line-height: 1.35; border: 1px solid transparent;
        }
        .aviso-estado.cancelado { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

        .acciones { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .btn-accion {
            flex: 1; min-width: 90px;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 10px; border-radius: 9px;
            font-size: 12px; font-weight: 700; font-family: inherit;
            text-decoration: none; cursor: pointer; transition: all 0.25s;
            border: 1px solid transparent;
        }
        .btn-accion.dorado { color: var(--dorado-claro); background: rgba(212, 175, 55, 0.12); border-color: rgba(212, 175, 55, 0.55); }
        .btn-accion.dorado:hover { background: rgba(212, 175, 55, 0.25); }
        .btn-accion.wa { color: #4ade80; background: transparent; border-color: rgba(37, 211, 102, 0.6); }
        .btn-accion.wa:hover { background: rgba(37, 211, 102, 0.15); }

        /* PAGINACIÓN */
        .paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 18px 10px 6px;
            flex-wrap: wrap;
        }
        .pag-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-borde);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .pag-btn:hover:not(:disabled) {
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--dorado-claro);
        }
        .pag-btn.activo {
            background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(59,130,246,0.15));
            border-color: rgba(212,175,55,0.7);
            color: var(--dorado-claro);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
        .pag-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .pag-info {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            text-align: center;
        }
        .pag-puntos {
            color: var(--muted);
            padding: 0 4px;
            font-weight: 700;
            user-select: none;
        }

        .sin-pedidos {
            text-align: center; padding: 28px 14px;
            background: var(--card-bg); border-radius: 16px; border: 1px solid var(--card-borde);
        }
        .sin-pedidos .icono { font-size: 38px; margin-bottom: 8px; }
        .sin-pedidos h3 { font-size: 16px; margin-bottom: 4px; }
        .sin-pedidos p { color: #cbd5e1; font-size: 13px; line-height: 1.4; }
        .sin-pedidos .btn-tienda {
            display: inline-block; margin-top: 12px; padding: 9px 22px;
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            color: #0a0e1a; border: none; border-radius: 10px;
            font-weight: 800; font-size: 13px; text-decoration: none;
        }

        .loading { text-align: center; padding: 24px; color: #94a3b8; }
        .loading .spinner {
            width: 28px; height: 28px; border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; left: 50%;
            bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
            transform: translate(-50%, 20px); max-width: calc(100% - 32px);
            padding: 9px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092",
        measurementId: "G-5NLLLEPWPK"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const WHATSAPP = '584228242411';
    const POR_PAGINA = 5;

    let todosPedidos = [];
    let pedidosFiltrados = [];
    let paginaActual = 1;
    let uidActual = null;
    let consultaActual = null;
    let estadoFiltro = 'todos';
    let toastTimer = null;
    let pedidosVistos = new Set();
    let estadosVistos = new Map(); // key → estado anterior
    let primeraCarga = true;

    const listaEl = document.getElementById('listaPedidos');
    const buscarEl = document.getElementById('buscarInput');
    const toastEl = document.getElementById('toast');
    const paginacionEl = document.getElementById('paginacion');
    const pagInfoEl = document.getElementById('pagInfo');

    /* =====================================================
       UTILIDADES
       ===================================================== */

    function esc(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function avisar(mensaje) {
        toastEl.textContent = mensaje;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 3000);
    }

    function normalizarEstado(raw) {
        const e = String(raw || 'pendiente').toLowerCase().trim();
        if (['completado', 'completada', 'completed', 'completada_ok'].includes(e)) return 'completado';
        if (['cancelado', 'cancelada', 'cancelled', 'canceled'].includes(e)) return 'cancelado';
        if (['procesando', 'processing'].includes(e)) return 'procesando';
        return 'pendiente';
    }

    /* =====================================================
       NOTIFICACIONES
       ===================================================== */

    // Pide permiso al cargar la página (una sola vez)
    function pedirPermisoNotificaciones() {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'default') {
            // Pequeño retraso para no ser agresivo
            setTimeout(() => {
                Notification.requestPermission().then((permiso) => {
                    if (permiso === 'granted') {
                        console.log('✅ Notificaciones activadas');
                    }
                });
            }, 2000);
        }
    }

    // Notificación nativa del sistema (aparece como WhatsApp)
    function enviarNotifSistema(pedido) {
        if (!('Notification' in window)) return;
        if (Notification.permission !== 'granted') return;

        try {
            const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || 'N/A';
            const juego = pedido.juego || 'Producto';
            const producto = pedido.producto || '';
            const cuerpo = producto ? `${juego} · ${producto}` : juego;

            const notif = new Notification('🎉 ¡Recarga completada!', {
                body: cuerpo,
                icon: '/logo.png',
                badge: '/logo.png',
                vibrate: [200, 100, 200],
                tag: 'recarga-' + idPedido,
                renotify: true,
                silent: false
            });

            notif.onclick = () => {
                window.focus();
                window.location.href = 'pedidos.html';
                notif.close();
            };

            // Cerrar sola después de 6 segundos
            setTimeout(() => {
                try { notif.close(); } catch(e) {}
            }, 6000);

        } catch(e) {
            console.warn('No se pudo enviar notificación del sistema:', e.message);
        }
    }

    // Tarjeta flotante tipo WhatsApp (dentro de la página)
    function mostrarNotifPedido(pedido) {
        const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || 'N/A';
        const juego = pedido.juego || 'Producto';
        const producto = pedido.producto || '';

        // Eliminar notificaciones previas (para que no se acumulen)
        document.querySelectorAll('.notif-pedido').forEach(n => n.remove());

        const notif = document.createElement('div');
        notif.className = 'notif-pedido';
        notif.innerHTML = `
            <div class="notif-icono">🎉</div>
            <div class="notif-texto">
                <div class="notif-titulo">¡Recarga completada!</div>
                <div class="notif-sub">${esc(juego)}${producto ? ' · ' + esc(producto) : ''}</div>
            </div>
            <button class="notif-cerrar" aria-label="Cerrar">✕</button>
        `;

        document.body.appendChild(notif);
        requestAnimationFrame(() => notif.classList.add('visible'));

        const btnCerrar = notif.querySelector('.notif-cerrar');
        btnCerrar.onclick = () => cerrarNotif(notif);

        // Auto-cerrar a los 6 segundos
        setTimeout(() => cerrarNotif(notif), 6000);

        // Al tocar la tarjeta → abrir pedidos.html
        notif.addEventListener('click', (e) => {
            if (e.target.closest('.notif-cerrar')) return;
            window.location.href = 'pedidos.html';
        });

        // Sonido tipo "tin"
        reproducirSonido();
        vibrar();
    }

    function cerrarNotif(notif) {
        if (!notif || !notif.parentNode) return;
        notif.classList.remove('visible');
        setTimeout(() => {
            if (notif.parentNode) notif.parentNode.removeChild(notif);
        }, 500);
    }

    // Sonido "tin" corto tipo WhatsApp
    function reproducirSonido() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            // Acorde tipo WhatsApp: dos notas rápidas y agudas
            const notas = [
                { freq: 880.00, delay: 0.00, dur: 0.15 },  // A5
                { freq: 1174.66, delay: 0.10, dur: 0.20 } // D6
            ];
            notas.forEach(({ freq, delay, dur }) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                const t = ctx.currentTime + delay;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.start(t);
                osc.stop(t + dur);
            });
            setTimeout(() => { try { ctx.close(); } catch(e) {} }, 1000);
        } catch(e) {}
    }

    function vibrar() {
        if (navigator.vibrate) {
            try { navigator.vibrate([200, 100, 200]); } catch(e) {}
        }
    }

    /* =====================================================
       CARGA DE DATOS
       ===================================================== */

    document.getElementById('btnVolver').addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
    });

    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        uidActual = user.uid;
        pedirPermisoNotificaciones();
        cargarPedidos();
    });

    function cargarPedidos() {
        if (consultaActual) consultaActual.off();
        consultaActual = db.ref('pedidos').orderByChild('uid').equalTo(uidActual);

        consultaActual.on('value', (snapshot) => {
            const nuevosPedidos = [];
            const idsActuales = new Set();
            const estadosActuales = new Map();
            const pedidosCompletadosNuevos = [];

            snapshot.forEach((childSnapshot) => {
                const pedido = childSnapshot.val();
                pedido.key = childSnapshot.key;
                pedido._estado = normalizarEstado(pedido.estado);
                nuevosPedidos.push(pedido);
                idsActuales.add(childSnapshot.key);
                estadosActuales.set(childSnapshot.key, pedido._estado);

                // Detectar pedidos recién completados
                if (!primeraCarga) {
                    const estadoAnterior = estadosVistos.get(childSnapshot.key);
                    const esNuevo = !pedidosVistos.has(childSnapshot.key);

                    // Caso 1: pedido nuevo que YA está completado
                    if (esNuevo && pedido._estado === 'completado') {
                        pedidosCompletadosNuevos.push(pedido);
                    }
                    // Caso 2: pedido existente que cambió A completado
                    else if (!esNuevo && estadoAnterior !== 'completado' && pedido._estado === 'completado') {
                        pedidosCompletadosNuevos.push(pedido);
                    }
                }
            });

            // Disparar notificaciones (una sola vez por pedido completado)
            pedidosCompletadosNuevos.forEach((p) => {
                mostrarNotifPedido(p);
                enviarNotifSistema(p);
            });

            pedidosVistos = idsActuales;
            estadosVistos = estadosActuales;
            primeraCarga = false;

            nuevosPedidos.sort((a, b) => {
                if (a.fecha && b.fecha) return new Date(b.fecha) - new Date(a.fecha);
                return 0;
            });

            todosPedidos = nuevosPedidos;
            actualizarContadores();
            filtrarPedidos();

        }, (error) => {
            console.error('Error cargando pedidos:', error);
            listaEl.innerHTML = `
                <div class="sin-pedidos">
                    <div class="icono">⚠️</div>
                    <h3>No pudimos cargar tus pedidos</h3>
                    <p>Revisa tu conexión e intenta de nuevo.</p>
                    <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener" class="btn-tienda">Contactar soporte</a>
                </div>
            `;
        });
    }

    function actualizarContadores() {
        const cuentas = { todos: todosPedidos.length, completado: 0, pendiente: 0, procesando: 0, cancelado: 0 };
        todosPedidos.forEach((p) => { cuentas[p._estado]++; });
        Object.keys(cuentas).forEach((k) => {
            document.getElementById('n-' + k).textContent = cuentas[k];
        });
        document.getElementById('stat-total').textContent = cuentas.todos;
        document.getElementById('stat-pendientes').textContent = cuentas.pendiente;
        document.getElementById('stat-completados').textContent = cuentas.completado;
    }

    function filtrarPedidos() {
        const busqueda = buscarEl.value.toLowerCase().trim();
        let filtrados = todosPedidos;

        if (estadoFiltro !== 'todos') {
            filtrados = filtrados.filter((p) => p._estado === estadoFiltro);
        }

        if (busqueda) {
            filtrados = filtrados.filter((p) => {
                const id = String(p.numero_pedido || p.referencia || p.key || '').toLowerCase();
                const juego = String(p.juego || p.producto || '').toLowerCase();
                const ref = String(p.referencia_pago || '').toLowerCase();
                return id.includes(busqueda) || juego.includes(busqueda) || ref.includes(busqueda);
            });
        }

        pedidosFiltrados = filtrados;
        paginaActual = 1;
        renderizarPagina();
    }

    function renderizarPagina() {
        const total = pedidosFiltrados.length;
        const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));

        if (paginaActual > totalPaginas) paginaActual = totalPaginas;
        if (paginaActual < 1) paginaActual = 1;

        const inicio = (paginaActual - 1) * POR_PAGINA;
        const fin = inicio + POR_PAGINA;
        const pedidosPagina = pedidosFiltrados.slice(inicio, fin);

        mostrarPedidos(pedidosPagina);
        renderizarPaginacion(totalPaginas, total);
    }

    function renderizarPaginacion(totalPaginas, totalPedidos) {
        if (totalPedidos === 0) {
            paginacionEl.innerHTML = '';
            pagInfoEl.textContent = '';
            return;
        }

        let html = '';
        html += `<button class="pag-btn" data-pag="ant" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>`;

        const paginas = generarPaginas(paginaActual, totalPaginas);
        paginas.forEach((p) => {
            if (p === '...') {
                html += `<span class="pag-puntos">…</span>`;
            } else {
                html += `<button class="pag-btn ${p === paginaActual ? 'activo' : ''}" data-pag="${p}">${p}</button>`;
            }
        });

        html += `<button class="pag-btn" data-pag="sig" ${paginaActual === totalPaginas ? 'disabled' : ''}>›</button>`;

        paginacionEl.innerHTML = html;

        const desde = (paginaActual - 1) * POR_PAGINA + 1;
        const hasta = Math.min(paginaActual * POR_PAGINA, totalPedidos);
        pagInfoEl.textContent = `Mostrando ${desde}-${hasta} de ${totalPedidos} pedidos · Página ${paginaActual} de ${totalPaginas}`;
    }

    function generarPaginas(actual, total) {
        const paginas = [];
        if (total <= 7) {
            for (let i = 1; i <= total; i++) paginas.push(i);
            return paginas;
        }

        paginas.push(1);
        if (actual > 4) paginas.push('...');

        const inicio = Math.max(2, actual - 1);
        const fin = Math.min(total - 1, actual + 1);
        for (let i = inicio; i <= fin; i++) paginas.push(i);

        if (actual < total - 3) paginas.push('...');
        paginas.push(total);

        return paginas;
    }

    paginacionEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.pag-btn');
        if (!btn || btn.disabled) return;

        const val = btn.dataset.pag;
        if (val === 'ant') paginaActual = Math.max(1, paginaActual - 1);
        else if (val === 'sig') paginaActual = paginaActual + 1;
        else paginaActual = parseInt(val);

        renderizarPagina();
        document.querySelector('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    function formatearFecha(valor) {
        if (!valor) return 'Sin fecha';
        const fecha = new Date(valor);
        if (isNaN(fecha.getTime())) return String(valor);
        return fecha.toLocaleString('es-VE', {
            day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
    }

    function formatearMonto(valor) {
        const n = parseFloat(valor);
        return isNaN(n) ? '0.00' : n.toFixed(2);
    }

    const ICONOS = {
        caja: `<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1H3V8zm0 3h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8zm7 2v2h4v-2h-4z"/></svg>`,
        ref: `<svg viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 0 1 1 1v19l-3-2-2.5 2-2.5-2-2.5 2L7 20l-3 2V3a1 1 0 0 1 1-1zm3 6v2h8V8H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>`,
        recibido: `<svg viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 0 1 1 1v19l-3-2-2.5 2-2.5-2-2.5 2L7 20l-3 2V3a1 1 0 0 1 1-1zm3 6v2h8V8H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>`,
        check: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
        lupa: `<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
        calendario: `<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14v10zM7 11h5v5H7z"/></svg>`,
        cartera: `<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h13v3H5.5a.5.5 0 0 0 0 1H21v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6zm14 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>`,
        copiar: `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`
    };

    function mostrarPedidos(pedidos) {
        if (pedidos.length === 0) {
            const sinNinguno = todosPedidos.length === 0;
            listaEl.innerHTML = `
                <div class="sin-pedidos">
                    <div class="icono">📭</div>
                    <h3>${sinNinguno ? 'Aún no tienes pedidos' : 'No encontramos pedidos'}</h3>
                    <p>${sinNinguno
                        ? 'Cuando hagas tu primera recarga, aparecerá aquí.'
                        : 'Prueba con otro estado o cambia la búsqueda.'}</p>
                    ${sinNinguno ? '<a href="index.html" class="btn-tienda">Elegir un juego</a>' : ''}
                </div>
            `;
            return;
        }

        let html = '';

        pedidos.forEach((pedido) => {
            const estado = pedido._estado;
            const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || pedido.key || 'N/A';
            const juego = pedido.juego || 'Producto';
            const producto = pedido.producto || '';
            const monto = formatearMonto(pedido.monto_usd || pedido.monto);
            const metodo = pedido.metodo || 'Pago Móvil';
            const idJugador = pedido.id_jugador || pedido.player_id || 'No especificado';
            const nombreJugador = pedido.nombre_jugador || pedido.player_name || 'No especificado';

            let stepRecibido = 'recibido';
            let stepVerificando = '';
            let stepCompletado = '';
            let line1 = 'active';
            let line2 = '';

            if (estado === 'completado') {
                stepVerificando = 'verificando';
                stepCompletado = 'completado';
                line1 = 'completed';
                line2 = 'completed';
            } else if (estado === 'procesando') {
                stepVerificando = 'espera';
            }

            const timelineHtml = estado === 'cancelado' ? '' : `
                <div class="pedido-timeline">
                    <div class="timeline-step ${stepRecibido}">
                        <div class="timeline-icon">${ICONOS.recibido}</div>
                        <div class="timeline-label">Recibido</div>
                    </div>
                    <div class="timeline-line ${line1}"></div>
                    <div class="timeline-step ${stepVerificando}">
                        <div class="timeline-icon">${ICONOS.lupa}</div>
                        <div class="timeline-label">Verificando</div>
                    </div>
                    <div class="timeline-line ${line2}"></div>
                    <div class="timeline-step ${stepCompletado}">
                        <div class="timeline-icon">${ICONOS.check}</div>
                        <div class="timeline-label">Completado</div>
                    </div>
                </div>
            `;

            let jugadorHtml = '';
            if (idJugador !== 'No especificado' || nombreJugador !== 'No especificado') {
                jugadorHtml = `
                    <div class="pedido-jugador-box">
                        ${idJugador !== 'No especificado' ? `<span><strong>ID de Jugador:</strong> ${esc(idJugador)}</span>` : ''}
                        ${nombreJugador !== 'No especificado' ? `<span><strong>Nombre de Jugador:</strong> ${esc(nombreJugador)}</span>` : ''}
                    </div>
                `;
            }

            const esStreaming = pedido.es_streaming === true ||
                                (pedido.datos_streaming && (pedido.datos_streaming.correo || pedido.datos_streaming.clave));

            let detalleInterno = '';

            if (!esStreaming && estado !== 'cancelado' && (pedido.pin || (pedido.codigos && pedido.codigos.length > 0))) {
                const pinValue = pedido.pin || pedido.codigos[0];
                const etiqueta = juego.toUpperCase().includes('ROBLOX') ? 'Tu PIN de Roblox' : 'Tu código';
                detalleInterno += `
                    <div class="pin-box">
                        <div class="pin-label">${etiqueta}</div>
                        <div class="pin-value">${esc(pinValue)}</div>
                        <button class="btn-copiar" data-pin="${esc(pinValue)}">Copiar</button>
                    </div>
                `;
            }

            if (!esStreaming && estado !== 'cancelado' && !pedido.pin && (!pedido.codigos || pedido.codigos.length === 0)) {
                detalleInterno += `
                    <div class="pin-box">
                        <div class="pin-label">Resumen del pedido</div>
                        <div class="pin-value" style="font-size:14px;letter-spacing:0.3px;">${esc(juego)}${producto ? ' - ' + esc(producto) : ''}</div>
                        <div style="font-size:11px;color:#94a3b8;margin-top:3px;">ID: ${esc(idJugador)}</div>
                    </div>
                `;
            }

            if (esStreaming && estado !== 'cancelado' && pedido.datos_streaming) {
                const d = pedido.datos_streaming;
                const codAprob = pedido.codigo_aprobacion || '';
                const tieneValor = (v) => v !== undefined && v !== null && String(v).trim() !== '';

                let camposHtml = '';
                const agregarDato = (label, valor, clase = '') => {
                    if (!tieneValor(valor)) return '';
                    const v = esc(valor);
                    return `
                        <div class="dato-entrega ${clase}">
                            <div class="dato-label">${label}</div>
                            <div class="dato-contenido">
                                <div class="dato-valor">${v}</div>
                                <button class="btn-copiar-dato" data-copiar="${v}" aria-label="Copiar ${label}">
                                    ${ICONOS.copiar}
                                </button>
                            </div>
                        </div>
                    `;
                };

                camposHtml += agregarDato('📧 CORREO', d.correo);
                camposHtml += agregarDato('🔑 CONTRASEÑA', d.clave);
                camposHtml += agregarDato('👤 PERFIL', d.perfil);
                camposHtml += agregarDato('🔢 PIN', d.pin_perfil);
                camposHtml += agregarDato('📅 VENCE', d.fecha_vencimiento);
                if (tieneValor(codAprob)) {
                    camposHtml += agregarDato('🎟️ RENOVACIÓN', codAprob, 'codigo-renovacion');
                    camposHtml += `<div class="aviso-renovacion">⚠️ Guarda este código para renovar.</div>`;
                }

                if (camposHtml) {
                    const titulo = d.perfil ? '🎬 Datos del perfil' : '🎬 Datos de la cuenta';
                    const mensajeAyuda = `Hola, necesito ayuda con mi pedido ${idPedido}`;
                    detalleInterno += `
                        <div class="streaming-box">
                            <div class="streaming-titulo">${titulo}</div>
                            ${camposHtml}
                            <a class="ayuda-streaming" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensajeAyuda)}" target="_blank" rel="noopener">
                                ¿Problemas? Escríbenos
                            </a>
                        </div>
                    `;
                }
            } else if (esStreaming && estado !== 'cancelado') {
                const mensaje = `Hola, necesito los datos de mi pedido ${idPedido}`;
                detalleInterno += `
                    <div class="manual-box">
                        <div class="manual-text">⚠️ Este pedido requiere entrega manual.</div>
                        <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}" target="_blank" rel="noopener" class="btn-whatsapp">
                            Pedir por WhatsApp
                        </a>
                    </div>
                `;
            }

            if (!esStreaming && estado !== 'cancelado') {
                const esManual = (pedido.metodo_pago === 'MANUAL') ||
                                 (pedido.paquete && String(pedido.paquete).startsWith('manual_'));
                if (esManual) {
                    detalleInterno += `
                        <div class="manual-box">
                            <div class="manual-text">Entrega manual.</div>
                            <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, necesito mi pedido ' + idPedido)}" target="_blank" rel="noopener" class="btn-whatsapp">
                                Pedir por WhatsApp
                            </a>
                        </div>
                    `;
                }
            }

            if (estado === 'cancelado') {
                const motivo = pedido.motivo_cancelacion || pedido.motivo || 'No pudimos verificar el pago.';
                detalleInterno += `
                    <div class="aviso-estado cancelado">${esc(motivo)}</div>
                    <div class="acciones">
                        <a class="btn-accion dorado" href="index.html">Reintentar</a>
                        <a class="btn-accion wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, mi pedido ' + idPedido + ' fue cancelado')}" target="_blank" rel="noopener">Soporte</a>
                    </div>
                `;
            }

            html += `
                <article class="pedido-card est-${estado}" data-pedido-key="${esc(pedido.key)}">
                    <div class="pedido-header">
                        <div class="pedido-header-left">
                            <span class="pedido-id">#${esc(idPedido)}</span>
                            <span class="pedido-fecha-inline">
                                ${ICONOS.calendario}
                                ${esc(formatearFecha(pedido.fecha))}
                            </span>
                        </div>
                        <div class="pedido-header-right">
                            <span class="pedido-precio">$${esc(monto)}</span>
                            <span class="pedido-metodo">
                                ${ICONOS.cartera}
                                ${esc(metodo)}
                            </span>
                        </div>
                    </div>

                    <div class="pedido-body">
                        <div class="pedido-producto">
                            ${ICONOS.caja}
                            <span>${esc(juego)}${producto ? ' - ' + esc(producto) : ''}</span>
                            <span class="estado-badge ${estado}">${estado.charAt(0).toUpperCase() + estado.slice(1)}</span>
                        </div>
                        <div class="pedido-referencia">
                            ${ICONOS.ref}
                            Ref: ${esc(pedido.referencia_pago || 'N/A')}
                        </div>
                    </div>

                    ${jugadorHtml}
                    ${timelineHtml}

                    <div class="detalle-expandido">
                        <h4>📋 Detalles del Pedido</h4>
                        ${detalleInterno}
                    </div>

                    <div class="aviso-tocar">👆 Toca para ver los datos</div>
                </article>
            `;
        });

        listaEl.innerHTML = html;
    }

    listaEl.addEventListener('click', (e) => {
        if (e.target.closest('.btn-copiar') || e.target.closest('.btn-copiar-dato') || e.target.closest('a')) return;
        const card = e.target.closest('.pedido-card');
        if (!card) return;

        card.classList.toggle('expandido');

        const aviso = card.querySelector('.aviso-tocar');
        if (aviso) {
            aviso.textContent = card.classList.contains('expandido')
                ? '👆 Toca para ocultar'
                : '👆 Toca para ver los datos';
        }
    });

    listaEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-copiar');
        if (!btn) return;
        e.stopPropagation();
        const pin = btn.dataset.pin;
        if (!pin) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pin)
                .then(() => avisar('✓ Copiado'))
                .catch(() => avisar('No se pudo copiar'));
        } else {
            avisar('Mantén presionado para copiar');
        }
    });

    listaEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-copiar-dato');
        if (!btn) return;
        e.stopPropagation();
        const texto = btn.dataset.copiar;
        if (!texto) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(texto)
                .then(() => {
                    btn.classList.add('copiado');
                    setTimeout(() => btn.classList.remove('copiado'), 1500);
                    avisar('✓ Copiado');
                })
                .catch(() => avisar('No se pudo copiar'));
        } else {
            avisar('Mantén presionado para copiar');
        }
    });

    document.getElementById('chips').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        estadoFiltro = chip.dataset.estado;
        document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c === chip));
        filtrarPedidos();
    });

    buscarEl.addEventListener('input', filtrarPedidos);
</script>

</body>
</html>
