.video-overlay{background:linear-gradient(180deg,rgba(3,7,15,.68),rgba(3,7,15,.9) 60%,#03060d)}
.topbar{height:76px;padding:0 20px;background:rgba(3,8,18,.94);border-bottom:2px solid #2587ff;box-shadow:0 8px 28px #0005;backdrop-filter:blur(16px)}
.logo img{width:56px;height:56px;object-fit:contain;border:0;background:transparent}.logo h1{font-size:23px;font-weight:900}.logo h1 span{color:#2587ff}.btn-back{font-size:16px;color:#b7c4da}
.container{max-width:760px;padding:16px 14px 24px}
.resumen-pedidos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 16px}
.resumen-item{min-width:0;display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:20px;background:linear-gradient(145deg,rgba(12,22,39,.98),rgba(5,12,24,.98));border:1px solid rgba(110,143,190,.28);box-shadow:0 8px 20px #0004}
.resumen-icono{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;font-size:29px;font-weight:900;color:white;background:linear-gradient(145deg,#368bff,#1454e8);box-shadow:0 5px 18px #2678ff30}
.resumen-pendientes .resumen-icono{background:linear-gradient(145deg,#ffbd47,#ef830d);box-shadow:0 5px 18px #ff9d2030}.resumen-completados .resumen-icono{background:linear-gradient(145deg,#13e6a0,#00a86f);box-shadow:0 5px 18px #00d99a30}
.resumen-item strong{display:block;font-size:25px;line-height:1.1;font-weight:900}.resumen-item small{display:block;margin-top:4px;color:#aebbd0;font-size:11px;line-height:1.2}
.panel-pedidos{padding:20px 16px 18px;border-radius:28px;background:linear-gradient(155deg,rgba(5,13,27,.97),rgba(3,8,17,.97));border:1px solid rgba(97,130,180,.24);box-shadow:0 12px 36px #0005}
.page-header{justify-content:flex-start;margin:0 0 18px;gap:10px}.page-header h2{display:flex;align-items:center;gap:10px;font-size:28px;letter-spacing:-.5px}.page-header h2 span:not(.titulo-icono){color:#f4f7ff}.titulo-icono{display:inline-grid;place-items:center;color:#2587ff;font-size:31px}.page-header .total{margin-left:auto}
.chips{margin-bottom:15px;gap:8px}.chip{padding:10px 13px;border-radius:24px;font-size:13px;background:#0c1526;border-color:#ffffff14}.chip.activo{color:#fff;border-color:#f5d76e;background:linear-gradient(135deg,#f5d76e38,#d4af3717);box-shadow:0 0 16px #d4af371a}.chip.activo .n{background:#0007;color:#fff}
.buscador input{height:52px;border-radius:18px;background:#0b1424;border-color:#ffffff12;font-size:15px}
.pedidos-list{gap:11px}.pedido-card{position:relative;overflow:hidden;padding:17px 16px;border-radius:25px;background:linear-gradient(115deg,rgba(7,17,32,.98) 0%,rgba(7,17,32,.95) 70%,rgba(9,20,37,.9) 100%);border:1px solid rgba(37,135,255,.55);border-left:4px solid #2587ff;box-shadow:0 6px 20px #0004;transition:border-color .2s,box-shadow .2s,transform .2s}.pedido-card:hover{border-color:#53a1ff;box-shadow:0 0 18px #2587ff22}.pedido-card:has(.timeline-step.completado){border-left-color:#2587ff}.pedido-header{border:0;padding:0 0 4px;margin-bottom:9px}.pedido-id{font-size:26px;color:#54a2ff;text-shadow:0 0 14px #2587ff32}.pedido-precio{font-size:18px}.pedido-metodo{font-size:10px}.pedido-body{margin-bottom:12px}.pedido-producto{font-size:14px}.pedido-referencia{font-size:12px}.pedido-jugador-box{padding:12px 14px;border-radius:17px;font-size:13px;background:#081222;border-color:#ffffff10}.pedido-timeline{padding-top:12px}
.nav-inferior{background:rgba(3,8,18,.97);border-top:1px solid #ffffff16;box-shadow:0 -8px 28px #0006}.nav-inferior-inner{height:var(--alto-nav);max-width:760px}.nav-item{gap:5px;font-size:12px;color:#8d9ab0}.nav-item svg{width:25px;height:25px;stroke-width:1.9}.nav-item.active{color:#f5d76e}.nav-item.active svg{filter:drop-shadow(0 0 6px #f5d76e55)}.nav-item.soporte{color:#00d99a}
@media(max-width:520px){.topbar{height:70px;padding:0 13px}.logo img{width:45px;height:45px}.logo h1{font-size:19px}.btn-back{font-size:14px;padding:8px}.container{padding:12px 9px 18px}.resumen-pedidos{gap:7px;margin-bottom:12px}.resumen-item{padding:10px 8px;gap:7px;border-radius:17px}.resumen-icono{width:39px;height:39px;border-radius:12px;font-size:24px}.resumen-item strong{font-size:23px}.resumen-item small{font-size:10px}.panel-pedidos{padding:17px 10px 14px;border-radius:24px}.page-header h2{font-size:24px}.page-header .total{font-size:10px;padding:7px 8px}.chips{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}.chip{padding:9px 10px;font-size:12px}.pedido-card{padding:15px 12px;border-radius:22px}.pedido-id{font-size:24px}.nav-inferior-inner{height:70px}.nav-item{font-size:11px}.nav-item svg{width:24px;height:24px}body{padding-top:70px;padding-bottom:calc(70px + 20px + env(safe-area-inset-bottom))}}
@media(max-width:370px){.resumen-item{flex-direction:column;align-items:flex-start}.resumen-icono{width:34px;height:34px;font-size:21px}.resumen-item strong{font-size:21px}.resumen-item small{font-size:9px}.page-header h2{font-size:21px}.chip{font-size:11px;padding:8px}.pedido-id{font-size:21px}}

<body>
<video autoplay muted loop playsinline class="video-fondo" aria-hidden="true"><source src="fondo.mp4" type="video/mp4"></video>
<div class="video-overlay"></div>
<header class="topbar">
  <a href="index.html" class="logo"><img src="logo.png" alt="Recargas Games"><h1>Recargas<span>Games</span></h1></a>

</header>

    <div class="resumen-item resumen-pendientes"><span class="resumen-icono">◷</span><div><strong id="resumenPendientes">0</strong><small>Pendientes</small></div></div>

    <button class="chip" data-estado="pendiente" type="button">Pendientes <span class="n" id="n-pendiente">0</span></button>
    <button class="chip" data-estado="procesando" type="button">Procesando <span class="n" id="n-procesando">0</span></button>

  <div class="pedidos-list" id="listaPedidos" aria-live="polite"><div class="loading"><div class="spinner"></div><p>Cargando tus pedidos...</p></div></div>

<script>
'use strict';
const firebaseConfig={
 apiKey:"AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
 authDomain:"free-52119.firebaseapp.com",
 databaseURL:"https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"free-52119",
 storageBucket:"free-52119.firebasestorage.app",
 messagingSenderId:"632240144599",
 appId:"1:632240144599:web:e31c25665ffe19c194b092",
 measurementId:"G-5NLLLEPWPK"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
let todosPedidos=[],uidActual=null,consultaActual=null,estadoFiltro='todos',toastTimer=null;
const timersAutoOcultar=new Map();
const listaEl=document.getElementById('listaPedidos'),buscarEl=document.getElementById('buscarInput'),toastEl=document.getElementById('toast');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function avisar(m){toastEl.textContent=m;toastEl.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('visible'),3000);}
function normalizarEstado(raw){const e=String(raw||'pendiente').toLowerCase().trim();if(['completado','completada','completed','completada_ok'].includes(e))return'completado';if(['cancelado','cancelada','cancelled','canceled'].includes(e))return'cancelado';if(['procesando','processing'].includes(e))return'procesando';return'pendiente';}
document.getElementById('btnVolver').addEventListener('click',()=>{if(window.history.length>1)window.history.back();else window.location.href='index.html';});
auth.onAuthStateChanged(user=>{if(!user){window.location.href='login.html';return;}uidActual=user.uid;cargarPedidos();});
function cargarPedidos(){
 if(consultaActual)consultaActual.off();
 consultaActual=db.ref('pedidos').orderByChild('uid').equalTo(uidActual);
 consultaActual.on('value',snapshot=>{
  todosPedidos=[];
  snapshot.forEach(child=>{const p=child.val()||{};p.key=child.key;p._estado=normalizarEstado(p.estado);todosPedidos.push(p);});
  todosPedidos.sort((a,b)=>{const da=new Date(a.fecha||0).getTime(),dbb=new Date(b.fecha||0).getTime();return dbb-da;});
  actualizarContadores();filtrarPedidos();
 },error=>{
  console.error('Error cargando pedidos:',error);
  listaEl.innerHTML='<div class="sin-pedidos"><div class="icono">⚠️</div><h3>No pudimos cargar tus pedidos</h3><p>Revisa tu conexión e intenta de nuevo. Si sigue igual, escríbenos por WhatsApp.</p><a href="https://wa.me/584228242411" target="_blank" rel="noopener" class="btn-tienda">Contactar soporte</a></div>';
 });
}
function actualizarContadores(){
 const c={todos:todosPedidos.length,completado:0,pendiente:0,procesando:0,cancelado:0};
 todosPedidos.forEach(p=>c[p._estado]++);
 Object.keys(c).forEach(k=>document.getElementById('n-'+k).textContent=c[k]);
 document.getElementById('totalPedidos').textContent=`${todosPedidos.length} ${todosPedidos.length===1?'pedido':'pedidos'}`;
 document.getElementById('resumenTotal').textContent=c.todos;
 document.getElementById('resumenPendientes').textContent=c.pendiente;
 document.getElementById('resumenCompletados').textContent=c.completado;
}
function filtrarPedidos(){
 const q=buscarEl.value.toLowerCase().trim();
 let arr=estadoFiltro==='todos'?todosPedidos:todosPedidos.filter(p=>p._estado===estadoFiltro);
 if(q)arr=arr.filter(p=>[p.numero_pedido,p.order_id,p.referencia,p.key,p.juego,p.producto,p.referencia_pago].some(v=>String(v||'').toLowerCase().includes(q)));
 mostrarPedidos(arr);
}
function formatearFecha(v){if(!v)return'Fecha no disponible';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toLocaleString('es-VE',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function montoUSD(v){const n=Number.parseFloat(v);return Number.isFinite(n)?n.toFixed(2):'0.00';}
const iconos={
 caja:'<svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
 ref:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
 buscar:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>'
};
function mostrarPedidos(pedidos){
 if(!pedidos.length){
  const ninguno=todosPedidos.length===0;
  listaEl.innerHTML=`<div class="sin-pedidos"><div class="icono">📭</div><h3>${ninguno?'Aún no tienes pedidos':'No encontramos pedidos'}</h3><p>${ninguno?'Cuando hagas tu primera recarga, aparecerá aquí.':'Prueba con otro estado o cambia lo que escribiste en el buscador.'}</p>${ninguno?'<a href="index.html" class="btn-tienda">Elegir un juego</a>':''}</div>`;
  return;
 }
 let html='';
 pedidos.forEach(p=>{
  const estado=p._estado,id=p.numero_pedido||p.order_id||p.referencia||p.key||'N/A',juego=p.juego||'Producto',producto=p.producto||'',monto=montoUSD(p.monto_usd??p.monto),metodo=p.metodo||p.metodo_pago||'Pago Móvil',idJugador=p.id_jugador||p.player_id||'No especificado',nombreJugador=p.nombre_jugador||p.player_name||'No especificado';
  let sr='recibido',sv='',sc='',l1='active',l2='';
  if(estado==='completado'){sv='verificando';sc='completado';l1='completed';l2='completed';}
  else if(estado==='procesando'){sv='verificando';l1='active';}
  else if(estado==='cancelado'){sr=sv=sc=l1=l2='';}
  const esStreaming=p.es_streaming===true||!!(p.datos_streaming&&(p.datos_streaming.correo||p.datos_streaming.clave));
  let pinHtml='';
  const pin=(p.pin||(Array.isArray(p.codigos)?p.codigos[0]:''));
  if(!esStreaming&&pin){pinHtml=`<div class="pin-box"><div class="pin-label">${juego.toUpperCase().includes('ROBLOX')?'Tu PIN de Roblox':'Tu código'}</div><div class="pin-value">${esc(pin)}</div><button type="button" class="btn-copiar" data-pin="${esc(pin)}">Copiar</button></div>`;}
  let streamingHtml='';
  const d=p.datos_streaming||{},tieneDatos=esStreaming&&(d.correo||d.clave);
  if(tieneDatos){
   const campos=[['📧 CORREO',d.correo,''],['🔑 CONTRASEÑA',d.clave,''],['👤 PERFIL',d.perfil,''],['🔢 PIN DEL PERFIL',d.pin_perfil,''],['📅 VENCE',d.fecha_vencimiento,''],['🎟️ CÓDIGO DE RENOVACIÓN',p.codigo_aprobacion,'codigo-renovacion']].filter(x=>x[1]);
   const camposHtml=campos.map(([label,valor,clase])=>{const real=String(valor),dots='•'.repeat(Math.min(12,real.length));return `<div class="dato-entrega dato-oculto ${clase}" data-valor-real="${esc(real)}"><div class="dato-label">${label}</div><div class="dato-contenido"><div class="dato-valor">${dots}</div><button type="button" class="btn-copiar-dato" data-copiar="${esc(real)}" aria-label="Copiar ${esc(label)}">▢</button></div></div>`;}).join('');
   const titulo=d.perfil?'🎬 DATOS DE TU PERFIL':'🎬 DATOS DE TU CUENTA',sub=d.perfil?'Usa estos datos para iniciar sesión en Netflix':'Usa estos datos para iniciar sesión. No cambies la contraseña ni el PIN.';
   streamingHtml=`<div class="streaming-box"><div class="streaming-titulo">${titulo}</div><div class="streaming-subtitulo">${sub}</div><button type="button" class="btn-revelar-datos" data-accion="revelar" data-pedido="${esc(p.key)}">👁️ Ver datos de acceso</button><div class="contenedor-datos-streaming" id="datos-${esc(p.key)}">${camposHtml}${p.codigo_aprobacion?'<div class="aviso-renovacion">⚠️ Guarda este código. Lo necesitarás para renovar.</div>':''}<div class="contador-auto-ocultar">🙈 Se ocultará automáticamente en <span class="segundos" data-contador="${esc(p.key)}">60</span>s</div><button type="button" class="btn-revelar-datos" data-accion="ocultar" data-pedido="${esc(p.key)}">🙈 Ocultar datos</button></div></div>`;
  }else if(esStreaming){
   const msg=encodeURIComponent(`Hola, necesito los datos de acceso de mi pedido ${id} (${producto})`);
   streamingHtml=`<div class="pendiente-manual-box"><div class="icono-pendiente">⏳</div><div class="titulo-pendiente">Pendiente de entrega</div><div class="desc-pendiente">Tu pedido está siendo procesado.<br><strong>Te enviaremos los datos de acceso por WhatsApp</strong> en los próximos minutos.</div><a href="https://wa.me/584228242411?text=${msg}" target="_blank" rel="noopener" class="btn-whatsapp-pendiente">💬 Consultar por WhatsApp</a></div>`;
  }
  let manualHtml='';
  if(!esStreaming&&(p.metodo_pago==='MANUAL'||String(p.paquete||'').startsWith('manual_'))){
   const msg=encodeURIComponent(`Hola, necesito mi entrega del pedido ${id}`);
   manualHtml=`<div class="manual-box"><div class="manual-text">Este producto se entrega de forma manual.</div><a href="https://wa.me/584228242411?text=${msg}" target="_blank" rel="noopener" class="btn-whatsapp">Pedir mi entrega por WhatsApp</a></div>`;
  }
  html+=`<article class="pedido-card" data-pedido-key="${esc(p.key)}">
   <div class="pedido-header"><div class="pedido-header-left"><div class="pedido-id">#${esc(id)}</div><div class="pedido-fecha">📅 ${esc(formatearFecha(p.fecha))}</div></div><div class="pedido-header-right"><span class="pedido-precio">$${esc(monto)}</span><span class="pedido-metodo">${esc(metodo)}</span></div></div>
   <div class="pedido-body"><div class="pedido-producto">${iconos.caja}${esc(juego)} ${producto?' - '+esc(producto):''}</div><div class="pedido-referencia">${iconos.ref} Ref: ${esc(p.referencia_pago||'N/A')}</div></div>
   <div class="pedido-jugador-box"><div><strong>ID de Jugador:</strong> ${esc(idJugador)}</div><div><strong>Nombre de Jugador:</strong> ${esc(nombreJugador)}</div></div>
   <div class="pedido-timeline"><div class="timeline-step ${sr}"><div class="timeline-icon">${iconos.ok}</div><div class="timeline-label">Recibido</div></div><div class="timeline-line ${l1}"></div><div class="timeline-step ${sv}"><div class="timeline-icon">${iconos.buscar}</div><div class="timeline-label">Verificando</div></div><div class="timeline-line ${l2}"></div><div class="timeline-step ${sc}"><div class="timeline-icon">${iconos.ok}</div><div class="timeline-label">${estado==='cancelado'?'Cancelado':'Completado'}</div></div></div>
   ${pinHtml}${streamingHtml}${manualHtml}</article>`;
 });
 // Al volver a dibujar las tarjetas, limpiar temporizadores cuyos paneles ya no existen.
 for(const [key,timer] of timersAutoOcultar){if(!document.getElementById('datos-'+CSS.escape(key))){clearInterval(timer);timersAutoOcultar.delete(key);}}
 listaEl.innerHTML=html;
}
listaEl.addEventListener('click',e=>{
 const reveal=e.target.closest('.btn-revelar-datos');
 if(reveal){const key=reveal.dataset.pedido,box=document.getElementById('datos-'+key);if(!box)return;if(reveal.dataset.accion==='revelar')revelarDatos(key,box);else ocultarDatos(key,box);return;}
 const pinBtn=e.target.closest('.btn-copiar');if(pinBtn){copiarTexto(pinBtn.dataset.pin,'✓ PIN copiado');return;}
 const copyBtn=e.target.closest('.btn-copiar-dato');if(copyBtn){copiarTexto(copyBtn.dataset.copiar,'✓ Dato copiado');copyBtn.classList.add('copiado');setTimeout(()=>copyBtn.classList.remove('copiado'),1500);}
});
function revelarDatos(key,box){
 box.querySelectorAll('.dato-entrega').forEach(el=>{const value=el.dataset.valorReal||'';el.querySelector('.dato-valor').textContent=value;el.classList.remove('dato-oculto');});
 box.classList.add('visible');iniciarContador(key,box);avisar('👁️ Datos visibles por 60 segundos');
}
function ocultarDatos(key,box){
 box.querySelectorAll('.dato-entrega').forEach(el=>{const value=el.dataset.valorReal||'';el.querySelector('.dato-valor').textContent='•'.repeat(Math.min(12,value.length));el.classList.add('dato-oculto');});
 box.classList.remove('visible');cancelarContador(key);
}
function iniciarContador(key,box){
 cancelarContador(key);let seconds=60;const el=box.querySelector('[data-contador]');
 if(el)el.textContent=seconds;
 const timer=setInterval(()=>{seconds--;if(el)el.textContent=seconds;if(seconds<=0){ocultarDatos(key,box);avisar('🔒 Datos ocultados por seguridad');}},1000);
 timersAutoOcultar.set(key,timer);
}
function cancelarContador(key){if(timersAutoOcultar.has(key)){clearInterval(timersAutoOcultar.get(key));timersAutoOcultar.delete(key);}}
async function copiarTexto(texto,mensaje){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(String(texto||''));avisar(mensaje);}else{const area=document.createElement('textarea');area.value=String(texto||'');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();avisar(ok?mensaje:'Mantén presionado el dato para copiarlo.');}}
 catch(err){avisar('No se pudo copiar. Mantén presionado el dato.');}
}
document.getElementById('chips').addEventListener('click',e=>{const chip=e.target.closest('.chip');if(!chip)return;estadoFiltro=chip.dataset.estado;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('activo',c===chip));filtrarPedidos();});
buscarEl.addEventListener('input',filtrarPedidos);
window.addEventListener('beforeunload',()=>{if(consultaActual)consultaActual.off();for(const timer of timersAutoOcultar.values())clearInterval(timer);});
</script>
