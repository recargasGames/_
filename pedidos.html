 if(!pedidos.length){

  let streamingHtml='';
  const d=p.datos_streaming||{},tieneDatos=esStreaming&&(d.correo||d.clave);
  if(tieneDatos){
   const campos=[['📧 CORREO',d.correo,''],['🔑 CONTRASEÑA',d.clave,''],['👤 PERFIL',d.perfil,''],['🔢 PIN DEL PERFIL',d.pin_perfil,''],['📅 VENCE',d.fecha_vencimiento,''],['🎟️ CÓDIGO DE RENOVACIÓN',p.codigo_aprobacion,'codigo-renovacion']].filter(x=>x[1]);
   const camposHtml=campos.map(([label,valor,clase])=>{const real=String(valor),dots='•'.repeat(Math.min(12,real.length));return `<div class="dato-entrega dato-oculto ${clase}" data-valor-real="${esc(real)}"><div class="dato-label">${label}</div><div class="dato-contenido"><div class="dato-valor">${dots}</div><button type="button" class="btn-copiar-dato" data-copiar="${esc(real)}" aria-label="Copiar ${esc(label)}">▢</button></div></div>`;}).join('');
   const titulo=d.perfil?'🎬 DATOS DE TU PERFIL':'🎬 DATOS DE TU CUENTA',sub=d.perfil?'Usa estos datos para iniciar sesión en Netflix':'Usa estos datos para iniciar sesión. No cambies la contraseña ni el PIN.';
   streamingHtml=`<div class="streaming-box"><div class="streaming-titulo">${titulo}</div><div class="streaming-subtitulo">${sub}</div><button type="button" class="btn-revelar-datos" data-accion="revelar" data-pedido="${esc(p.key)}">👁️ Ver datos de acceso</button><div class="contenedor-datos-streaming" id="datos-${esc(p.key)}">${camposHtml}${p.codigo_aprobacion?'<div class="aviso-renovacion">⚠️ Guarda este código. Lo necesitarás para renovar.</div>':''}<div class="contador-auto-ocultar">🙈 Se ocultará automáticamente en <span class="segundos" data-contador="${esc(p.key)}">60</span>s</div><button type="button" class="btn-revelar-datos" data-accion="ocultar" data-pedido="${esc(p.key)}">🙈 Ocultar datos</button></div></div>`;
  }else if(esStreaming){
   const msg=encodeURIComponent(`Hola, necesito los datos de acceso de mi pedido ${id} (${producto})`);
   streamingHtml=`<div class="pendiente-manual-box"><div class="icono-pendiente">⏳</div><div class="titulo-pendiente">Pendiente de entrega</div><div class="desc-pendiente">Tu pedido está siendo procesado.<br><strong>Te enviaremos los datos de acceso por WhatsApp</strong> en los próximos minutos.</div><a href="https://wa.me/584228242411?text=${msg}" target="_blank" rel="noopener" class="btn-whatsapp-pendiente">💬 Consultar por WhatsApp</a></div>`;
  }
  let manualHtml='';
  if(!esStreaming&&(p.metodo_pago==='MANUAL'||String(p.paquete||'').startsWith('manual_'))){
   const msg=encodeURIComponent(`Hola, necesito mi entrega del pedido ${id}`);
   manualHtml=`<div class="manual-box"><div class="manual-text">Este producto se entrega de forma manual.</div><a href="https://wa.me/584228242411?text=${msg}" target="_blank" rel="noopener" class="btn-whatsapp">Pedir mi entrega por WhatsApp</a></div>`;
  }
  html+=`<article class="pedido-card" data-pedido-key="${esc(p.key)}">
   <div class="pedido-header"><div class="pedido-header-left"><div class="pedido-id">#${esc(id)}</div><div class="pedido-fecha">📅 ${esc(formatearFecha(p.fecha))}</div></div><div class="pedido-header-right"><span class="pedido-precio">$${esc(monto)}</span><span class="pedido-metodo">${esc(metodo)}</span></div></div>
   <div class="pedido-body"><div class="pedido-producto">${iconos.caja}${esc(juego)} ${producto?' - '+esc(producto):''}</div><div class="pedido-referencia">${iconos.ref} Ref: ${esc(p.referencia_pago||'N/A')}</div></div>
   <div class="pedido-jugador-box"><div><strong>ID de Jugador:</strong> ${esc(idJugador)}</div><div><strong>Nombre de Jugador:</strong> ${esc(nombreJugador)}</div></div>
   <div class="pedido-timeline"><div class="timeline-step ${sr}"><div class="timeline-icon">${iconos.ok}</div><div class="timeline-label">Recibido</div></div><div class="timeline-line ${l1}"></div><div class="timeline-step ${sv}"><div class="timeline-icon">${iconos.buscar}</div><div class="timeline-label">Verificando</div></div><div class="timeline-line ${l2}"></div><div class="timeline-step ${sc}"><div class="timeline-icon">${iconos.ok}</div><div class="timeline-label">${estado==='cancelado'?'Cancelado':'Completado'}</div></div></div>
   ${pinHtml}${streamingHtml}${manualHtml}</article>`;
 });
 // Al volver a dibujar las tarjetas, limpiar temporizadores cuyos paneles ya no existen.
 for(const [key,timer] of timersAutoOcultar){if(!document.getElementById('datos-'+CSS.escape(key))){clearInterval(timer);timersAutoOcultar.delete(key);}}
 listaEl.innerHTML=html;
}
listaEl.addEventListener('click',e=>{
 const reveal=e.target.closest('.btn-revelar-datos');
 if(reveal){const key=reveal.dataset.pedido,box=document.getElementById('datos-'+key);if(!box)return;if(reveal.dataset.accion==='revelar')revelarDatos(key,box);else ocultarDatos(key,box);return;}
 const pinBtn=e.target.closest('.btn-copiar');if(pinBtn){copiarTexto(pinBtn.dataset.pin,'✓ PIN copiado');return;}
 const copyBtn=e.target.closest('.btn-copiar-dato');if(copyBtn){copiarTexto(copyBtn.dataset.copiar,'✓ Dato copiado');copyBtn.classList.add('copiado');setTimeout(()=>copyBtn.classList.remove('copiado'),1500);}
});
function revelarDatos(key,box){
 box.querySelectorAll('.dato-entrega').forEach(el=>{const value=el.dataset.valorReal||'';el.querySelector('.dato-valor').textContent=value;el.classList.remove('dato-oculto');});
 box.classList.add('visible');iniciarContador(key,box);avisar('👁️ Datos visibles por 60 segundos');
}
function ocultarDatos(key,box){
 box.querySelectorAll('.dato-entrega').forEach(el=>{const value=el.dataset.valorReal||'';el.querySelector('.dato-valor').textContent='•'.repeat(Math.min(12,value.length));el.classList.add('dato-oculto');});
 box.classList.remove('visible');cancelarContador(key);
}
function iniciarContador(key,box){
 cancelarContador(key);let seconds=60;const el=box.querySelector('[data-contador]');
 if(el)el.textContent=seconds;
 const timer=setInterval(()=>{seconds--;if(el)el.textContent=seconds;if(seconds<=0){ocultarDatos(key,box);avisar('🔒 Datos ocultados por seguridad');}},1000);
 timersAutoOcultar.set(key,timer);
}
function cancelarContador(key){if(timersAutoOcultar.has(key)){clearInterval(timersAutoOcultar.get(key));timersAutoOcultar.delete(key);}}
async function copiarTexto(texto,mensaje){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(String(texto||''));avisar(mensaje);}else{const area=document.createElement('textarea');area.value=String(texto||'');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();avisar(ok?mensaje:'Mantén presionado el dato para copiarlo.');}}
 catch(err){avisar('No se pudo copiar. Mantén presionado el dato.');}
}
document.getElementById('chips').addEventListener('click',e=>{const chip=e.target.closest('.chip');if(!chip)return;estadoFiltro=chip.dataset.estado;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('activo',c===chip));filtrarPedidos();});
buscarEl.addEventListener('input',filtrarPedidos);
window.addEventListener('beforeunload',()=>{if(consultaActual)consultaActual.off();for(const timer of timersAutoOcultar.values())clearInterval(timer);});
</script>
</body>
</html>
