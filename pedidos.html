    let todosPedidos = [];
    let uidActual = null;
    let consultaActual = null;
    let estadoFiltro = 'todos';
    let toastTimer = null;

    let datosStreaming = {}; 
    const reveladas = {}; 
    let tickTimer = null;

    const listaEl = document.getElementById('listaPedidos');
    const toastEl = document.getElementById('toast');

    // --- TUS FUNCIONES (Mantenidas intactas) ---
    function esc(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function avisar(mensaje) {
        toastEl.textContent = mensaje;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 3000);
    }

    function normalizarEstado(raw) {
        const e = String(raw || 'pendiente').toLowerCase().trim();
        if (['completado', 'completada', 'completed', 'completada_ok'].includes(e)) return 'completado';
        if (['cancelado', 'cancelada', 'cancelled', 'canceled'].includes(e)) return 'cancelado';
        if (['procesando', 'processing'].includes(e)) return 'procesando';
        return 'pendiente';
    }

    function detectarServicioStreaming(pedido) {
        if (pedido.datos_streaming && pedido.datos_streaming.servicio) return pedido.datos_streaming.servicio;
        const combo = (String(pedido.juego || '') + ' ' + String(pedido.producto || '')).toUpperCase();
        if (/NETFLIX|\bNF\b/.test(combo)) return 'Netflix';
        if (/DISNEY|\bDS\b/.test(combo)) return 'Disney+';
        if (/\bHBO\b|\bMAX\b/.test(combo)) return 'HBO Max';
        if (/SPOTIFY/.test(combo)) return 'Spotify';
        if (/PARAMOUNT/.test(combo)) return 'Paramount+';
        if (/CRUNCHYROLL/.test(combo)) return 'Crunchyroll';
        return 'Streaming';
    }

    function esProductoStreaming(pedido) {
        if (pedido.es_streaming === true) return true;
        if (pedido.datos_streaming) return true;
        const combo = (String(pedido.juego || '') + ' ' + String(pedido.producto || '')).toUpperCase();
        return /NETFLIX|DISNEY|\bHBO\b|SPOTIFY|PARAMOUNT|CRUNCHYROLL/.test(combo);
    }

    function formatearFecha(valor) {
        if (!valor) return 'Fecha no disponible';
        const fecha = new Date(valor);
        if (isNaN(fecha.getTime())) return String(valor);
        return fecha.toLocaleString('es-VE', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatearMonto(valor) {
        const n = parseFloat(valor);
        return isNaN(n) ? '0.00' : n.toFixed(2);
    }

    function enlaceWhatsApp(texto) {
        return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`;
    }

    // --- CARGA DE FIREBASE ---
    auth.onAuthStateChanged((user) => {
        if (!user) {
            // window.location.href = 'login.html'; // Descomentar si usas login
            return;
        }
        uidActual = user.uid;
        cargarPedidos();
    });

    function cargarPedidos() {
        if (consultaActual) consultaActual.off();
        consultaActual = db.ref('pedidos').orderByChild('uid').equalTo(uidActual);

        consultaActual.on('value', (snapshot) => {
            todosPedidos = [];
            snapshot.forEach((childSnapshot) => {
                const pedido = childSnapshot.val();
                pedido.key = childSnapshot.key;
                pedido._estado = normalizarEstado(pedido.estado);
                todosPedidos.push(pedido);
            });

            todosPedidos.sort((a, b) => {
                if (a.fecha && b.fecha) return new Date(b.fecha) - new Date(a.fecha);
                return 0;
            });

            actualizarContadores();
            filtrarPedidos();
        }, (error) => {
            listaEl.innerHTML = `<div class="sin-pedidos"><h3>Error de conexión</h3><p>No se pudieron cargar los pedidos.</p></div>`;
        });
    }

    function actualizarContadores() {
        const total = todosPedidos.length;
        const pendientes = todosPedidos.filter(p => p._estado === 'pendiente' || p._estado === 'procesando').length;
        const completados = todosPedidos.filter(p => p._estado === 'completado').length;
        
        document.getElementById('totalPedidos').textContent = total;
        document.getElementById('pendientesCount').textContent = pendientes;
        document.getElementById('completadosCount').textContent = completados;
    }

    function filtrarPedidos() {
        let filtrados = todosPedidos;
        if (estadoFiltro !== 'todos') filtrados = filtrados.filter((p) => p._estado === estadoFiltro);
        mostrarPedidos(filtrados);
    }

    // --- RENDERIZADO DE PEDIDOS (AQUÍ ESTÁ EL CAMBIO DE DISEÑO) ---
    function mostrarPedidos(pedidos) {
        datosStreaming = {};

        if (pedidos.length === 0) {
            listaEl.innerHTML = `<div class="sin-pedidos"><h3>No hay pedidos</h3><p>Realiza tu primera recarga.</p></div>`;
            return;
        }

        let html = '';
        pedidos.forEach((pedido) => {
            const estado = pedido._estado;
            const idPedido = pedido.numero_pedido || pedido.order_id || pedido.referencia || pedido.key || 'N/A';
            const juego = pedido.juego || 'Producto';
            const producto = pedido.producto || '';
            const monto = formatearMonto(pedido.monto_usd || pedido.monto);
            const metodo = pedido.metodo || 'Pago Móvil';
            const fecha = formatearFecha(pedido.fecha);
            const refPago = pedido.referencia_pago || 'N/A';
            
            const esStreaming = esProductoStreaming(pedido);
            const servicioStreaming = detectarServicioStreaming(pedido);
            
            // --- Línea de tiempo (Igual a tu lógica) ---
            let stepRecibido = 'recibido'; let stepVerificando = ''; let stepCompletado = ''; let line1 = 'active'; let line2 = '';
            if (estado === 'completado') { stepVerificando = 'verificando'; stepCompletado = 'completado'; line1 = 'completed'; line2 = 'completed'; }
            else if (estado === 'procesando') { stepVerificando = 'verificando'; line1 = 'active'; }

            const timelineHtml = estado === 'cancelado' ? '' : `
                <div class="pedido-timeline">
                    <div class="timeline-step ${stepRecibido}"><div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div><div class="timeline-label">Recibido</div></div>
                    <div class="timeline-line ${line1}"></div>
                    <div class="timeline-step ${stepVerificando}"><div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div><div class="timeline-label">Verificando</div></div>
                    <div class="timeline-line ${line2}"></div>
                    <div class="timeline-step ${stepCompletado}"><div class="timeline-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div><div class="timeline-label">Completado</div></div>
                </div>`;

            // --- Datos del Jugador (Para Free Fire) ---
            let jugadorHtml = '';
            if (!esStreaming && (pedido.id_jugador || pedido.nombre_jugador)) {
                jugadorHtml = `
                    <div class="pedido-jugador-box">
                        ${pedido.id_jugador ? `<div><strong>ID de Jugador:</strong> ${esc(pedido.id_jugador)}</div>` : ''}
                        ${pedido.nombre_jugador ? `<div><strong>Nombre de Jugador:</strong> ${esc(pedido.nombre_jugador)}</div>` : ''}
                    </div>`;
            }

            // --- PIN / Código (Para Roblox, etc.) ---
            let pinHtml = '';
            if (!esStreaming && estado !== 'cancelado' && (pedido.pin || (pedido.codigos && pedido.codigos.length > 0))) {
                const pinValue = pedido.pin || pedido.codigos[0];
                pinHtml = `
                    <div class="pin-box">
                        <div class="pin-label">Tu código de canje</div>
                        <div class="pin-value">${esc(pinValue)}</div>
                        <button class="btn-copiar" data-pin="${esc(pinValue)}">Copiar</button>
                    </div>`;
            }

            // --- STREAMING (Netflix, Disney) ---
            let streamingHtml = '';
            const tieneDatosStreaming = esStreaming && estado !== 'cancelado' && pedido.datos_streaming && (pedido.datos_streaming.correo || pedido.datos_streaming.clave);

            if (tieneDatosStreaming) {
                const d = pedido.datos_streaming;
                const codAprob = pedido.codigo_aprobacion || '';
                const tieneValor = (v) => v !== undefined && v !== null && String(v).trim() !== '';
                const campos = [];
                if (tieneValor(d.correo)) campos.push({ label: 'Correo', valor: String(d.correo) });
                if (tieneValor(d.clave)) campos.push({ label: 'Contraseña', valor: String(d.clave) });
                if (tieneValor(d.perfil)) campos.push({ label: 'Perfil', valor: String(d.perfil) });
                if (tieneValor(d.pin_perfil)) campos.push({ label: 'PIN del perfil', valor: String(d.pin_perfil) });
                if (tieneValor(d.fecha_vencimiento)) campos.push({ label: 'Vence', valor: String(d.fecha_vencimiento) });
                if (tieneValor(codAprob)) campos.push({ label: 'Código de renovación', valor: String(codAprob) });

                datosStreaming[pedido.key] = campos;
                const camposHtml = campos.map((c, i) => `
                    <div class="dato-entrega dato-oculto">
                        <div class="dato-label">${esc(c.label)}</div>
                        <div class="dato-contenido">
                            <div class="dato-valor">${PUNTOS}</div>
                            <button class="btn-copiar-dato" data-pedido="${esc(pedido.key)}" data-idx="${i}">Copiar</button>
                        </div>
                    </div>`).join('');

                streamingHtml = `
                    <div class="streaming-box">
                        <div class="streaming-titulo">Datos de tu cuenta de ${esc(servicioStreaming)}</div>
                        <div class="streaming-subtitulo">Usa estos datos para iniciar sesión. No cambies la contraseña.</div>
                        <button class="btn-revelar-datos" data-accion="revelar" data-pedido="${esc(pedido.key)}">👁️ Ver datos de acceso</button>
                        <div class="contenedor-datos-streaming" id="datos-${esc(pedido.key)}">
                            ${camposHtml}
                            <div class="contador-auto-ocultar">Se ocultan en <span class="segundos">${SEGUNDOS_VISIBLE}</span> s</div>
                            <button class="btn-revelar-datos" data-accion="ocultar" data-pedido="${esc(pedido.key)}" style="margin-top:5px; border-color:#ef4444; color:#ef4444; background:rgba(239,68,68,0.1)">🙈 Ocultar datos</button>
                        </div>
                        <a class="ayuda-streaming" href="${enlaceWhatsApp('Hola, necesito ayuda con mi cuenta de ' + servicioStreaming)}" target="_blank">¿Problemas para entrar? Escríbenos</a>
                    </div>`;
            } else if (esStreaming && estado !== 'cancelado') {
                streamingHtml = `
                    <div class="streaming-box">
                        <div class="streaming-titulo">Preparando tu entrega de ${esc(servicioStreaming)}</div>
                        <div class="streaming-subtitulo">Te enviaremos los datos por WhatsApp.</div>
                        <a href="${enlaceWhatsApp('Hola, necesito los datos de mi pedido ' + idPedido)}" target="_blank" class="btn-revelar-datos" style="text-decoration:none;">💬 Consultar por WhatsApp</a>
                    </div>`;
            }

            // --- Entrega manual ---
            let manualHtml = '';
            if (!esStreaming && estado !== 'cancelado' && (pedido.metodo_pago === 'MANUAL' || (pedido.paquete && String(pedido.paquete).startsWith('manual_')))) {
                manualHtml = `
                    <div class="manual-box">
                        <div class="manual-text">Este producto se entrega de forma manual.</div>
                        <a href="${enlaceWhatsApp('Hola, necesito mi entrega del pedido ' + idPedido)}" target="_blank" class="btn-whatsapp">Pedir por WhatsApp</a>
                    </div>`;
            }

            // --- Cancelado ---
            let canceladoHtml = '';
            if (estado === 'cancelado') {
                canceladoHtml = `
                    <div class="aviso-estado cancelado">${esc(pedido.motivo_cancelacion || 'No pudimos verificar el pago.')}</div>
                    <div class="acciones">
                        <a class="btn-accion dorado" href="index.html">Reintentar</a>
                        <a class="btn-accion wa" href="${enlaceWhatsApp('Hola, mi pedido ' + idPedido + ' fue cancelado')}" target="_blank">Soporte</a>
                    </div>`;
            }

            // --- HTML FINAL DE LA TARJETA ---
            html += `
                <div class="pedido-card est-${estado}" data-pedido-key="${esc(pedido.key)}">
                    <div class="pedido-header">
                        <div class="pedido-header-left">
                            <div class="pedido-id">#${esc(idPedido)}</div>
                            <div class="pedido-fecha">
                                <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                ${esc(fecha)}
                            </div>
                        </div>
                        <div class="pedido-header-right">
                            <span class="pedido-precio">$${esc(monto)}</span>
                            <span class="pedido-metodo">
                                <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2;"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                                BS|${esc(metodo).toUpperCase()}
                            </span>
                        </div>
                    </div>

                    <div class="pedido-body">
                        <div class="pedido-producto">
                            <svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            <span>${esc(juego)}${producto ? ' - ' + esc(producto) : ''}</span>
                        </div>
                        <div class="pedido-referencia">
                            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            Ref: ${esc(refPago)}
                        </div>
                    </div>

                    ${timelineHtml}

                    <!-- AQUÍ ESTÁ LA MAGIA: Los datos ocultos que se muestran al tocar la tarjeta -->
                    <div class="detalles-ocultos" id="detalles-${esc(pedido.key)}">
                        ${jugadorHtml}
                        ${pinHtml}
                        ${streamingHtml}
                        ${manualHtml}
                        ${canceladoHtml}
                    </div>
                </div>
            `;
        });

        listaEl.innerHTML = html;

        // Mantener abiertos los datos de streaming si ya estaban revelados
        Object.keys(reveladas).forEach((key) => {
            const cont = document.getElementById('datos-' + key);
            if (cont) revelarDatos(key, cont, true);
            else delete reveladas[key];
        });
    }

    // --- LÓGICA DE CLIC PARA MOSTRAR/OCULTAR DETALLES ---
    listaEl.addEventListener('click', (e) => {
        const card = e.target.closest('.pedido-card');
        if (!card) return;
        
        // No abrir si se hizo clic en un botón dentro de los detalles
        if (e.target.closest('button') || e.target.closest('a')) return;

        const detalles = card.querySelector('.detalles-ocultos');
        if (detalles) {
            detalles.classList.toggle('visible');
        }
    });

    // --- LÓGICA DE STREAMING (Tus funciones originales) ---
    listaEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-revelar-datos');
        if (!btn) return;
        const pedidoKey = btn.dataset.pedido;
        const contenedor = document.getElementById('datos-' + pedidoKey);
        if (!contenedor) return;

        if (btn.dataset.accion === 'revelar') revelarDatos(pedidoKey, contenedor, false);
        else if (btn.dataset.accion === 'ocultar') ocultarDatos(pedidoKey, contenedor);
    });

    function revelarDatos(pedidoKey, contenedor, mantenerTiempo) {
        const campos = datosStreaming[pedidoKey] || [];
        contenedor.querySelectorAll('.dato-entrega').forEach((dato, i) => {
            const valorEl = dato.querySelector('.dato-valor');
            if (valorEl && campos[i]) valorEl.textContent = campos[i].valor;
            dato.classList.remove('dato-oculto');
        });
        contenedor.classList.add('visible');
        
        if (!mantenerTiempo || !reveladas[pedidoKey]) reveladas[pedidoKey] = Date.now() + SEGUNDOS_VISIBLE * 1000;
        iniciarTick();
        tick();
        if (!mantenerTiempo) avisar('Datos visibles por ' + SEGUNDOS_VISIBLE + ' segundos');
    }

    function ocultarDatos(pedidoKey, contenedor) {
        contenedor.querySelectorAll('.dato-entrega').forEach((dato) => {
            const valorEl = dato.querySelector('.dato-valor');
            if (valorEl) valorEl.textContent = PUNTOS;
            dato.classList.add('dato-oculto');
        });
        contenedor.classList.remove('visible');
        delete reveladas[pedidoKey];
    }

    function iniciarTick() {
        if (!tickTimer) tickTimer = setInterval(tick, 1000);
    }

    function tick() {
        const ahora = Date.now();
        let hayAbiertas = false;
        Object.keys(reveladas).forEach((key) => {
            const cont = document.getElementById('datos-' + key);
            const restante = Math.ceil((reveladas[key] - ahora) / 1000);
            if (!cont) { delete reveladas[key]; return; }
            if (restante <= 0) { ocultarDatos(key, cont); avisar('Datos ocultados por seguridad'); return; }
            hayAbiertas = true;
            const segEl = cont.querySelector('.segundos');
            if (segEl) segEl.textContent = restante;
        });
        if (!hayAbiertas && tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    }

    // --- COPIAR ---
    function copiarTexto(texto, onOk) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(texto).then(() => { if (onOk) onOk(); avisar('✓ Copiado'); }).catch(() => avisar('No se pudo copiar'));
        } else { avisar('Mantén presionado para copiar.'); }
    }

    listaEl.addEventListener('click', (e) => {
        const btnPin = e.target.closest('.btn-copiar');
        if (btnPin) { copiarTexto(btnPin.dataset.pin); return; }
        
        const btnDato = e.target.closest('.btn-copiar-dato');
        if (btnDato) {
            const campos = datosStreaming[btnDato.dataset.pedido] || [];
            const campo = campos[Number(btnDato.dataset.idx)];
            if (!campo) return;
            copiarTexto(campo.valor, () => {
                btnDato.classList.add('copiado');
                btnDato.textContent = '✓';
                setTimeout(() => { btnDato.classList.remove('copiado'); btnDato.textContent = 'Copiar'; }, 1500);
            });
        }
    });
</script>

</body>
</html>
