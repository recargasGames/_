<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Recargas Games</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1220;
            color: white;
            min-height: 100vh;
            padding-top: 80px;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(11, 18, 32, 0.95);
            border-bottom: 2px solid #3b82f6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .topbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar .logo img {
            height: 45px;
            border-radius: 10px;
        }
        .topbar .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }
        .topbar .logo h1 span {
            color: #3b82f6;
        }
        .topbar .btn-back {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: inherit;
        }
        .topbar .btn-back:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .perfil-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .perfil-card h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .perfil-card .sub {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .avatar-grande {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px;
            border: 3px solid #3b82f6;
        }

        .campo {
            margin-bottom: 18px;
        }
        .campo label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 5px;
        }
        .campo input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.5);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .campo input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.8);
        }
        .campo input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-guardar {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-guardar:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .btn-guardar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cerrar-sesion {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
        }
        .btn-cerrar-sesion:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .mensaje {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }
        .mensaje.exito {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .mensaje.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 500px) {
            .perfil-card {
                padding: 20px;
            }
            .topbar .logo h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- ====== BARRA SUPERIOR ====== -->
<header class="topbar">
    <div class="logo">
        <img src="logo.png" alt="Recargas Games">
        <h1>Recargas<span>Games</span></h1>
    </div>
    <!-- ✅ AHORA USA history.back() -->
    <button class="btn-back" onclick="volverAtras()">← Volver</button>
</header>

<!-- ====== CONTENIDO ====== -->
<div class="container">
    <div class="perfil-card">
        <h2>✏️ Editar Perfil</h2>
        <p class="sub">Actualiza tu información personal</p>

        <div class="avatar-grande" id="avatarGrande">A</div>

        <div class="campo">
            <label>📧 Correo electrónico</label>
            <input type="email" id="inputEmail" disabled>
        </div>

        <div class="campo">
            <label>👤 Nombre de usuario</label>
            <input type="text" id="inputNombre" placeholder="Tu nombre">
        </div>

        <div class="campo">
            <label>🎮 ID de jugador</label>
            <input type="text" id="inputIdJugador" placeholder="ID en el juego">
        </div>

        <div id="mensaje" class="mensaje"></div>

        <button class="btn-guardar" id="btnGuardar" onclick="guardarPerfil()">💾 Guardar Cambios</button>
        <button class="btn-cerrar-sesion" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
    </div>
</div>

<script>
    // ==============================================
    // 🔥 FIREBASE - CONFIGURACIÓN
    // ==============================================
    const firebaseConfig = {
        apiKey: "AIzaSyAARiBZAruTMx2anfq6nCn61SKhXYsyL5w",
        authDomain: "free-52119.firebaseapp.com",
        databaseURL: "https://free-52119-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "free-52119",
        storageBucket: "free-52119.firebasestorage.app",
        messagingSenderId: "632240144599",
        appId: "1:632240144599:web:e31c25665ffe19c194b092",
        measurementId: "G-5NLLLEPWPK"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let uidActual = null;

    // ==============================================
    // 🔙 VOLVER A LA PÁGINA ANTERIOR
    // ==============================================
    function volverAtras() {
        window.history.back();
    }

    // ==============================================
    // 👤 CARGAR DATOS DEL USUARIO
    // ==============================================
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        uidActual = user.uid;
        
        // Cargar datos de Auth
        document.getElementById('inputEmail').value = user.email || '';
        const nombre = user.displayName || '';
        document.getElementById('inputNombre').value = nombre;
        
        // Avatar
        const inicial = nombre.charAt(0).toUpperCase() || 'U';
        document.getElementById('avatarGrande').textContent = inicial;

        // Cargar ID del jugador desde Firebase
        const refUsuario = db.ref(`usuarios/${uidActual}`);
        refUsuario.on('value', (snapshot) => {
            const datos = snapshot.val();
            if (datos && datos.id_jugador) {
                document.getElementById('inputIdJugador').value = datos.id_jugador;
            } else {
                // Si no tiene, usar el de localStorage
                const idLocal = localStorage.getItem('id_jugador') || '';
                document.getElementById('inputIdJugador').value = idLocal;
            }
        });
    });

    // ==============================================
    // 💾 GUARDAR PERFIL
    // ==============================================
    function guardarPerfil() {
        const btn = document.getElementById('btnGuardar');
        const mensaje = document.getElementById('mensaje');
        
        btn.disabled = true;
        btn.textContent = '⏳ Guardando...';
        mensaje.className = 'mensaje';
        mensaje.style.display = 'none';

        const nombre = document.getElementById('inputNombre').value.trim();
        const idJugador = document.getElementById('inputIdJugador').value.trim();

        if (!nombre) {
            mostrarMensaje('error', '❌ El nombre es obligatorio');
            btn.disabled = false;
            btn.textContent = '💾 Guardar Cambios';
            return;
        }

        // Guardar en Firebase Auth (displayName)
        const user = auth.currentUser;
        user.updateProfile({
            displayName: nombre
        }).then(() => {
            // Guardar ID jugador en Firebase Database
            const refUsuario = db.ref(`usuarios/${uidActual}`);
            return refUsuario.update({
                nombre: nombre,
                id_jugador: idJugador,
                actualizado: new Date().toISOString()
            });
        }).then(() => {
            // Guardar en localStorage también
            localStorage.setItem('id_jugador', idJugador);
            localStorage.setItem('nombre_jugador', nombre);
            
            mostrarMensaje('exito', '✅ Perfil actualizado correctamente');
            
            // Actualizar avatar
            const inicial = nombre.charAt(0).toUpperCase();
            document.getElementById('avatarGrande').textContent = inicial;
            
        }).catch((error) => {
            console.error('Error al guardar:', error);
            mostrarMensaje('error', `❌ Error: ${error.message}`);
        }).finally(() => {
            btn.disabled = false;
            btn.textContent = '💾 Guardar Cambios';
        });
    }

    // ==============================================
    // 📢 MOSTRAR MENSAJE
    // ==============================================
    function mostrarMensaje(tipo, texto) {
        const mensaje = document.getElementById('mensaje');
        mensaje.className = `mensaje ${tipo}`;
        mensaje.textContent = texto;
        mensaje.style.display = 'block';
        
        // Ocultar después de 5 segundos
        clearTimeout(mensaje._timeout);
        mensaje._timeout = setTimeout(() => {
            mensaje.style.display = 'none';
        }, 5000);
    }

    // ==============================================
    // 🚪 CERRAR SESIÓN
    // ==============================================
    function cerrarSesion() {
        if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
            auth.signOut().then(() => {
                localStorage.removeItem('id_jugador');
                localStorage.removeItem('nombre_jugador');
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error('Error al cerrar sesión:', error);
                mostrarMensaje('error', `❌ Error: ${error.message}`);
            });
        }
    }

    console.log('✏️ Perfil cargado correctamente');
</script>

</body>
</html>
