<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Mi Perfil - RECARGASGAMES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background-image:url('fondo.jpg');background-size:cover;background-attachment:fixed;color:#fff;font-family:'Segoe UI',sans-serif}
.header{background:rgba(11,18,32,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;color:#10b981;display:flex;align-items:center;gap:10px}
.brand img{height:35px}
.header-actions{display:flex;gap:10px}
.back-home{background:#10b981;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none}
.back-home:hover{background:#059669}
.games-menu{display:flex;gap:8px;overflow-x:auto;background:rgba(11,18,32,.95);padding:12px 15px;border-bottom:1px solid #1f2937;margin-bottom:20px}
.games-menu a{text-decoration:none;color:#fff;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;transition:0.2s}
.games-menu a:hover{background:#10b981;color:#0f172a}
.games-menu a.active{background:#10b981;color:#0f172a}
.main{padding:20px;max-width:800px;margin:0 auto}
.welcome-card{background:rgba(11,18,32,.9);border-radius:20px;padding:25px;margin-bottom:20px;border:1px solid rgba(16,185,129,0.3)}
.welcome-card h1{font-size:24px;color:#10b981;margin-bottom:8px}
.welcome-card p{color:#9ca3af;font-size:14px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat-card{background:rgba(11,18,32,.85);border-radius:16px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,0.05)}
.stat-number{font-size:32px;font-weight:800;color:#10b981}
.stat-label{font-size:12px;color:#9ca3af;margin-top:8px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px}
.section-title{font-size:20px;font-weight:700;color:#fff}
.refresh-btn{background:#2563eb;color:#fff;border:none;padding:8px 20px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:600}
.refresh-btn:hover{background:#1d4ed8}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-select{background:#111827;border:1px solid #1f2937;color:#fff;padding:10px 15px;border-radius:30px;font-size:13px;cursor:pointer}
.pedidos-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.pedido-card{background:rgba(11,18,32,.85);border-radius:16px;padding:16px;border-left:4px solid;transition:0.2s;cursor:pointer}
.pedido-card:hover{transform:translateX(5px);background:rgba(11,18,32,.95)}
.pedido-card.estado-completado{border-left-color:#22c55e}
.pedido-card.estado-pendiente{border-left-color:#f97316}
.pedido-card.estado-verificando{border-left-color:#3b82f6}
.pedido-card.estado-cancelado{border-left-color:#ef4444}
.pedido-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pedido-juego{font-size:16px;font-weight:700;color:#10b981}
.pedido-estado{font-size:11px;padding:4px 10px;border-radius:30px;font-weight:600}
.estado-completado-badge{background:rgba(34,197,94,0.2);color:#22c55e}
.estado-pendiente-badge{background:rgba(249,115,22,0.2);color:#f97316}
.estado-verificando-badge{background:rgba(59,130,246,0.2);color:#60a5fa}
.estado-cancelado-badge{background:rgba(239,68,68,0.2);color:#ef4444}
.pedido-producto{font-size:15px;font-weight:600;color:#fff;margin-bottom:6px}
.pedido-monto{font-size:18px;font-weight:700;color:#fbbf24;margin-bottom:6px}
.pedido-ref{font-size:11px;color:#6b7280;font-family:monospace}
.pedido-fecha{font-size:10px;color:#4b5563;margin-top:8px}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.page-btn{background:#111827;border:1px solid #1f2937;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.page-btn.active{background:#10b981;border-color:#10b981}
.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center}
.modal-content{background:#1e293b;border-radius:20px;padding:25px;max-width:450px;width:90%;border:1px solid #10b981}
.modal-content h3{color:#10b981;margin-bottom:20px;font-size:20px}
.modal-content input{width:100%;height:45px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;padding:12px;margin-bottom:15px}
.modal-content input:focus{outline:none;border-color:#10b981}
.modal-buttons{display:flex;gap:12px;margin-top:10px}
.modal-buttons button{flex:1;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
.btn-save{background:#10b981;color:#fff;border:none}
.btn-cancel{background:#334155;color:#fff;border:none}
.btn-cerrar-sesion{background:#ef4444;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:20px;width:100%}
.btn-cerrar-sesion:hover{background:#dc2626}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:30px;font-weight:bold;z-index:1000;animation:fadeInUp 0.3s ease}
.toast.error{background:#ef4444}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360)}}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.empty-pedidos{text-align:center;padding:40px;background:rgba(11,18,32,.85);border-radius:16px;color:#6b7280}
@media(max-width:550px){.stats-grid{gap:10px}.stat-card{padding:12px}.stat-number{font-size:24px}}
</style>

<!-- Vercel Web Analytics -->
<script type="module">
    import { inject } from 'https://cdn.vercel-insights.com/v1/script.js';
    inject();
</script>
</head>
<body>

<div class="header">
    <div class="brand"><img src="logo.png" alt="Logo"> RECARGASGAMES</div>
    <div class="header-actions">
    </div>
</div>

<!-- Menú de juegos -->
<div class="games-menu">
    <a href="index.html">🏠 Inicio</a>
    <a href="freefire.html" class="active">🔥 Free Fire</a>
    <a href="bloodstrike.html">🪖 Blood Strike</a>
    <a href="roblox.html">🤖 Roblox</a>
    <a href="ml.html">👑 MLBB</a>
    <a href="cod.html">🎮 COD Mobile</a>
    <a href="pubg.html">🎮 PUBG Mobile</a>
</div>

<div class="main">
    <!-- Tarjeta de bienvenida -->
    <div class="welcome-card">
        <h1 id="saludoUsuario">Hola, Usuario</h1>
        <p>Bienvenido a tu panel de cliente</p>
    </div>

    <!-- Tarjetas de estadísticas -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="totalPedidos">0</div><div class="stat-label">Total Recargas</div></div>
        <div class="stat-card"><div class="stat-number" id="totalPendientes">0</div><div class="stat-label">Pendientes</div></div>
        <div class="stat-card"><div class="stat-number" id="totalCompletados">0</div><div class="stat-label">Completados</div></div>
    </div>

    <!-- MIS PEDIDOS -->
    <div class="section-header">
        <div class="section-title">📋 MIS PEDIDOS</div>
        <button class="refresh-btn" onclick="recargarPedidos()">🔄 Actualizar historial</button>
    </div>

    <!-- Filtros -->
    <div class="filters">
        <select id="filtroEstado" class="filter-select">
            <option value="todos">📌 Todos</option>
            <option value="Pendiente">⏳ Pendientes</option>
            <option value="Verificando">🔍 Verificando</option>
            <option value="Completado">✅ Completados</option>
            <option value="Cancelado">❌ Cancelados</option>
        </select>
    </div>

    <!-- Tarjetas de pedidos -->
    <div id="pedidosContainer" class="pedidos-grid">
        <div class="empty-pedidos">Cargando tus pedidos...</div>
    </div>

    <!-- Paginación -->
    <div class="pagination" id="pagination"></div>

    <!-- Botón cerrar sesión -->
    <button class="btn-cerrar-sesion" id="btnCerrarSesion">🚪 Cerrar Sesión</button>
</div>

<!-- Modal Editar Perfil (oculto, ya no se usa pero lo dejo por si acaso) -->
<div id="modalPerfil" class="modal" style="display:none">
    <div class="modal-content">
        <h3>✏️ Editar Perfil</h3>
        <input type="text" id="editNombre" placeholder="Nombre completo">
        <input type="password" id="editPassActual" placeholder="Contraseña actual">
        <input type="password" id="editPassNueva" placeholder="Nueva contraseña (opcional)">
        <input type="password" id="editPassConfirmar" placeholder="Confirmar nueva contraseña">
        <div class="modal-buttons">
            <button class="btn-save" id="btnGuardarPerfil">💾 Guardar</button>
            <button class="btn-cancel" onclick="cerrarModalPerfil()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Detalles Pedido -->
<div id="modalDetalles" class="modal">
    <div class="modal-content">
        <h3>📋 Detalles del Pedido</h3>
        <div id="modalBody"></div>
        <div class="modal-buttons">
            <button class="btn-save" onclick="cerrarModalDetalles()">Cerrar</button>
        </div>
    </div>
</div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
    apiKey:"AIzaSyDyo-HiGfO0IcRret7AgHj4dlU4j0PVlq0",
    authDomain:"recargasgames-14c38.firebaseapp.com",
    databaseURL:"https://recargasgames-14c38-default-rtdb.firebaseio.com",
    projectId:"recargasgames-14c38",
    storageBucket:"recargasgames-14c38.firebasestorage.app",
    messagingSenderId:"370952235234",
    appId:"1:370952235234:web:41a9ebd7084f1955a256bb"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let usuarioActual=null;
let pedidos=[];
let currentPage=1;
const porPagina=10;

function mostrarToast(mensaje,isError=false){
    const toast=document.createElement('div');
    toast.className='toast'+(isError?' error':'');
    toast.innerText=mensaje;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),3000);
}

function actualizarStats(){
    const total=pedidos.length;
    const pendientes=pedidos.filter(p=>p.estado==='Pendiente').length;
    const completados=pedidos.filter(p=>p.estado==='Completado').length;
    document.getElementById('totalPedidos').innerText=total;
    document.getElementById('totalPendientes').innerText=pendientes;
    document.getElementById('totalCompletados').innerText=completados;
}

function getBadgeClass(estado){
    if(estado==='Completado') return 'estado-completado-badge';
    if(estado==='Pendiente') return 'estado-pendiente-badge';
    if(estado==='Verificando') return 'estado-verificando-badge';
    return 'estado-cancelado-badge';
}

function getBorderClass(estado){
    if(estado==='Completado') return 'estado-completado';
    if(estado==='Pendiente') return 'estado-pendiente';
    if(estado==='Verificando') return 'estado-verificando';
    return 'estado-cancelado';
}

function filtrarPedidos(){
    let filtrados=pedidos;
    const estado=document.getElementById('filtroEstado').value;
    if(estado!=='todos') filtrados=filtrados.filter(p=>p.estado===estado);
    filtrados.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    return filtrados;
}

function renderizarPedidos(){
    const filtrados=filtrarPedidos();
    const totalPages=Math.ceil(filtrados.length/porPagina);
    const start=(currentPage-1)*porPagina;
    const paginados=filtrados.slice(start,start+porPagina);
    const container=document.getElementById('pedidosContainer');
    
    if(paginados.length===0){
        container.innerHTML='<div class="empty-pedidos">📭 No tienes pedidos aún</div>';
        document.getElementById('pagination').innerHTML='';
        actualizarStats();
        return;
    }
    
    let html='';
    paginados.forEach((p)=>{
        const badgeClass=getBadgeClass(p.estado);
        const borderClass=getBorderClass(p.estado);
        let estadoTexto=p.estado||'Pendiente';
        if(estadoTexto==='Completado') estadoTexto='✅ Completado';
        else if(estadoTexto==='Pendiente') estadoTexto='⏳ Pendiente';
        else if(estadoTexto==='Verificando') estadoTexto='🔍 Verificando';
        else estadoTexto='❌ Cancelado';
        
        const fechaMostrar=p.fecha || new Date(p.timestamp).toLocaleString();
        let juegoMostrar=p.juego || 'FREE FIRE';
        let iconoJuego='🔥';
        if(juegoMostrar.includes('BLOOD')) iconoJuego='🪖';
        else if(juegoMostrar.includes('ROBLOX')) iconoJuego='🤖';
        else if(juegoMostrar.includes('MOBILE')) iconoJuego='👑';
        else if(juegoMostrar.includes('COD')) iconoJuego='🎮';
        else if(juegoMostrar.includes('PUBG')) iconoJuego='🎮';
        
        html+=`
            <div class="pedido-card ${borderClass}" onclick="verDetalle('${p.id}')">
                <div class="pedido-header">
                    <span class="pedido-juego">${iconoJuego} ${juegoMostrar}</span>
                    <span class="pedido-estado ${badgeClass}">${estadoTexto}</span>
                </div>
                <div class="pedido-producto">📦 ${p.producto||'Producto'}</div>
                <div class="pedido-monto">💰 ${p.precio||'0 Bs'}</div>
                <div class="pedido-ref">Ref: ${p.referencia||'N/A'}</div>
                <div class="pedido-fecha">📅 ${fechaMostrar}</div>
            </div>
        `;
    });
    container.innerHTML=html;
    
    let pages='';
    for(let i=1;i<=totalPages;i++){
        pages+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="irPagina(${i})">${i}</button>`;
    }
    document.getElementById('pagination').innerHTML=pages;
    actualizarStats();
}

window.irPagina=(page)=>{currentPage=page;renderizarPedidos();};
window.recargarPedidos=()=>{currentPage=1;renderizarPedidos();};

window.verDetalle=(id)=>{
    const p=pedidos.find(x=>x.id===id);
    if(!p)return;
    document.getElementById('modalBody').innerHTML=`
        <div style="margin-bottom:12px"><strong>📦 Producto:</strong> ${p.producto||'N/A'}</div>
        <div style="margin-bottom:12px"><strong>🎮 Juego:</strong> ${p.juego||'N/A'}</div>
        <div style="margin-bottom:12px"><strong>💰 Monto:</strong> ${p.precio||'0 Bs'}</div>
        <div style="margin-bottom:12px"><strong>🆔 ID Jugador:</strong> ${p.id_jugador||p.jugadorId||'N/A'}</div>
        <div style="margin-bottom:12px"><strong>👤 Nombre:</strong> ${p.nombre_verificado||p.usuario||'N/A'}</div>
        <div style="margin-bottom:12px"><strong>🧾 Referencia:</strong> ${p.referencia||'N/A'}</div>
        <div style="margin-bottom:12px"><strong>💳 Método:</strong> ${p.metodo||'PAGO MOVIL'}</div>
        <div style="margin-bottom:12px"><strong>📅 Fecha:</strong> ${p.fecha||new Date(p.timestamp).toLocaleString()}</div>
        <div><strong>📌 Estado:</strong> ${p.estado||'Pendiente'}</div>
        ${p.comprobanteUrl ? `<div style="margin-top:12px"><strong>📷 Comprobante:</strong> <a href="${p.comprobanteUrl}" target="_blank" style="color:#10b981">Ver imagen</a></div>` : ''}
    `;
    document.getElementById('modalDetalles').style.display='flex';
};

window.cerrarModalDetalles=()=>document.getElementById('modalDetalles').style.display='none';

// Cerrar sesión
document.getElementById('btnCerrarSesion').onclick=()=>{
    signOut(auth).then(()=>{
        localStorage.clear();
        window.location.href="index.html";
    });
};

document.getElementById('filtroEstado')?.addEventListener('change',()=>{currentPage=1;renderizarPedidos();});

// Cargar datos
onAuthStateChanged(auth,async(user)=>{
    if(!user){
        window.location.href="login.html";
        return;
    }
    usuarioActual=user;
    const nombre=user.displayName||user.email;
    document.getElementById('saludoUsuario').innerHTML=`Hola, ${nombre.split(' ')[0]}`;
    
    // Cargar pedidos
    const pedidosRef=ref(db,'pedidos');
    onValue(pedidosRef,(snapshot)=>{
        const data=snapshot.val();
        pedidos=[];
        if(data){
            for(let id in data){
                const pedido=data[id];
                if(pedido.userId===user.uid){
                    pedidos.push({id,...pedido});
                }
            }
        }
        renderizarPedidos();
    });
});
</script>
</body>
</html>
